<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daran parvekepuutarha — prototyyppi</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231E4D3B'/%3E%3Cpath d='M32 52V30' stroke='%23EAF0E9' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M32 36c-11 0-17-6-17-15 10 0 17 6 17 15z' fill='%237FBFA0'/%3E%3Cpath d='M32 32c0-10 6-17 16-17 0 10-6 17-16 17z' fill='%23EAF0E9'/%3E%3C/svg%3E">
<meta name="theme-color" content="#1E4D3B">
<script>try{var _t=JSON.parse(localStorage.getItem('theme')||'null');if(_t)document.documentElement.dataset.theme=_t;}catch(e){}</script>
<style>
  /* ============================================================
     Daran parvekepuutarha — the chart direction.

     Soft, rounded, and organised by colour rather than by rules. Every plant
     owns the background colour of its own illustration, and that colour washes
     the whole row, chip and tile that belong to it, so the page is legible as a
     garden before it is read as an interface. Nothing shouts in capitals.

     UI     Avenir Next  — the site's own voice
     Prose  Charter      — what the model writes, in something you read
     ============================================================ */
  :root{
    --paper:#EFF2EA; --field:#FFFFFF; --ink:#17211B; --dim:#6C7A70; --rule:#E1E7DA;
    --pine:#1E4D3B; --leaf:#3E7D5C; --tomato:#C4462C; --water:#2F6E8F; --pollen:#B0810F;
    --ph-grow:#9BC7AA; --ph-flower:#DDA0B4; --ph-fruit:#E79A4E; --ph-harvest:#CC5438;
    --ui:"Avenir Next","Avenir","Segoe UI",system-ui,sans-serif;
    --prose:"Charter","Iowan Old Style","Georgia",serif;
    --s1:4px; --s2:8px; --s3:12px; --s4:18px; --s5:28px; --s6:44px;
    --r-lg:20px; --r-md:14px; --r-sm:10px; --r-pill:999px;
    --tint:#9BC7AA;
    --wash:color-mix(in srgb,var(--tint) 16%,var(--field));
    --shadow:0 2px 10px rgba(22,40,28,.05);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0F140F; --field:#19201A; --ink:#E7EEE4; --dim:#8B9A8C; --rule:#27302A;
      --pine:#8FCBA9; --leaf:#7FBFA0; --tomato:#EF7355; --water:#7BB9DB; --pollen:#DDB059;
      --shadow:0 2px 12px rgba(0,0,0,.3);
      --wash:color-mix(in srgb,var(--tint) 20%,var(--field));
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F140F; --field:#19201A; --ink:#E7EEE4; --dim:#8B9A8C; --rule:#27302A;
    --pine:#8FCBA9; --leaf:#7FBFA0; --tomato:#EF7355; --water:#7BB9DB; --pollen:#DDB059;
    --shadow:0 2px 12px rgba(0,0,0,.3);
    --wash:color-mix(in srgb,var(--tint) 20%,var(--field));
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--ui);-webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
  .vhid{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}

  #root{container-type:inline-size;position:relative;margin:0 auto;background:var(--paper)}
  #root.phone{max-width:392px;box-shadow:0 0 0 1px var(--rule)}
  .page{max-width:1120px;margin:0 auto;padding:var(--s4) var(--s4) var(--s5)}
  @container (max-width:899px){ .page{padding:var(--s3) var(--s3) var(--s4)} }

  /* ---- masthead ---- */
  .mast{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s4)}
  .mast h1{font-size:clamp(20px,3vw,25px);font-weight:600}
  .mast .where{font-size:13px;color:var(--dim)}
  .mast .fresh{margin-left:auto;font-size:12px;color:var(--dim);background:var(--field);
    border-radius:var(--r-pill);padding:5px 11px;border:1px solid var(--rule)}

  /* ---- a section is a card ---- */
  .sect{background:var(--field);border:1px solid var(--rule);border-radius:var(--r-lg);
    padding:var(--s4) var(--s4) var(--s5);margin-bottom:var(--s6);box-shadow:var(--shadow)}
  .sect:last-child{margin-bottom:0}
  .sect > .hd{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;
    padding-bottom:var(--s3);margin-bottom:var(--s4);border-bottom:2px solid var(--ink)}
  .sect > .hd h2{font-size:21px;letter-spacing:-.02em}
  .sect > .hd .meta{margin-left:auto;font-size:13px;color:var(--dim)}
  .sect > .hd .meta b{font-weight:600;color:var(--tomato)}
  /* a sub-heading inside a section: smaller, its own rule, its own air */
  .sub{display:flex;align-items:baseline;gap:var(--s2);margin:var(--s5) 0 var(--s2);font-size:15px;
    font-weight:600;color:var(--ink);padding-bottom:6px;border-bottom:1px solid var(--rule)}
  .sub:first-of-type{margin-top:var(--s4)}
  .sub .n{margin-left:auto;font-weight:400;font-size:12.5px;color:var(--dim)}

  /* ---- the nav: it governs the whole page, so it sits above the whole page ---- */
  .nav{position:sticky;top:0;z-index:15;background:var(--paper);margin:0 0 var(--s4);
    padding:var(--s2) 0;border-bottom:1px solid var(--rule)}
  .strip{display:flex;gap:6px;overflow-x:auto;padding:2px;scrollbar-width:thin}
  .chip{display:inline-flex;align-items:center;gap:8px;flex:none;border:1px solid var(--rule);
    background:var(--field);border-radius:var(--r-pill);padding:5px 15px 5px 5px;cursor:pointer;
    font-size:14px;white-space:nowrap}
  .chip .av{width:30px;height:30px;flex:none;overflow:hidden;border-radius:var(--r-pill)}
  .chip .av svg{width:100%;height:100%;display:block}
  .chip:hover{border-color:var(--leaf)}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
  .chip.all{padding:5px 17px}

  /* ---- the chart: one soft row per plant ---- */
  .row{display:flex;align-items:center;gap:var(--s3);padding:11px 2px;width:100%;text-align:left;
    border-top:1px solid var(--rule)}
  .row.head,.row.axis{border-top:none;padding:2px}
  .row.axis{border-top:1px solid var(--rule);padding-top:8px}
  .row .art{width:40px;height:40px;flex:none;overflow:hidden;border-radius:var(--r-sm)}
  .row .art svg{width:100%;height:100%;display:block}
  .row .who{width:136px;flex:none;min-width:0}
  .row .who b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;letter-spacing:-.01em}
  .row .who em{display:block;font-style:normal;font-size:12px;color:var(--dim);margin-top:2px}
  .row .bars{flex:1 1 auto;min-width:88px}
  .row .now{flex:0 0 clamp(168px,26%,280px);min-width:0;display:flex;gap:7px;align-items:flex-start}
  .row .now .mk{flex:none;font-size:13px;line-height:1.35}
  .row .now .txt{min-width:0;font-size:14px;line-height:1.35}
  .row .now .txt em{display:block;font-style:normal;font-size:11.5px;color:var(--dim);margin-top:1px}
  .row .now.bad .txt{color:var(--tomato);font-weight:600}
  .row .now.watch .txt{color:var(--water)}
  @keyframes settle{0%{transform:scale(1.01)}100%{transform:none}}
  .row.touched{animation:settle .7s ease-out;background:color-mix(in srgb,var(--leaf) 10%,transparent)}

  .track{position:relative;display:block;height:10px;background:color-mix(in srgb,var(--ink) 8%,transparent);
    border-radius:var(--r-pill);overflow:hidden}
  .bar{position:absolute;top:0;height:100%}
  .bar.grow{background:var(--ph-grow)} .bar.flower{background:var(--ph-flower)}
  .bar.fruit{background:var(--ph-fruit)} .bar.harvest{background:var(--ph-harvest)}
  .scale{position:relative;display:block;height:14px;font-size:11px;color:var(--dim)}
  .scale b{position:absolute;transform:translateX(-50%);font-weight:400}
  .scale b.today{color:var(--leaf);font-weight:600;transform:translateX(-4px)}
  .legend{display:flex;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s3);font-size:12px;color:var(--dim)}
  .legend i{display:inline-block;width:18px;height:8px;border-radius:var(--r-pill);margin-right:6px;vertical-align:0}

  /* ---- prose the model wrote ---- */
  .lede{font-family:var(--prose);font-size:21px;line-height:1.35;margin:0 0 var(--s3);font-weight:400}
  .lede .mk{margin-right:7px}
  .lede.bad{color:var(--tomato)} .lede.watch{color:var(--water)}
  p.prose{font-family:var(--prose);font-size:15.5px;line-height:1.6;margin:0 0 var(--s3);max-width:62ch}
  .quote{font-style:italic;color:var(--dim);font-size:14.5px;line-height:1.5}
  .data{font-size:12px;color:var(--dim)}

  /* ---- lists you act on ---- */
  .list{display:flex;flex-direction:column}
  .task{display:flex;gap:var(--s2);align-items:flex-start;padding:13px 2px;
    border-top:1px solid var(--rule)}
  .task:first-child{border-top:none}
  .task .mk{width:22px;flex:none;text-align:center;font-size:15px}
  .task .body{flex:1;min-width:0}
  .task .what{font-size:14.5px;font-weight:600}
  .task .whose{font-size:12px;color:var(--dim);display:block;margin-top:1px}
  .task .why{display:block;font-size:13.5px;color:var(--dim);line-height:1.45;margin-top:4px;
    font-family:var(--prose)}
  .task.done{opacity:.45}
  .task.added{background:color-mix(in srgb,var(--leaf) 9%,transparent);border-radius:var(--r-sm)}
  .task.changed{background:color-mix(in srgb,var(--pollen) 12%,transparent);border-radius:var(--r-sm)}
  .task.cut{opacity:.55}
  .task.cut .what{text-decoration:line-through;text-decoration-color:var(--tomato)}
  .flag{font-size:13px;font-weight:700;width:12px;flex:none;padding-top:1px}
  .flag.add{color:var(--leaf)} .flag.chg{color:var(--pollen)} .flag.cut{color:var(--tomato)}
  .tick{border:1px solid var(--leaf);color:var(--leaf);background:var(--field);border-radius:var(--r-pill);
    font-size:12.5px;padding:7px 13px;cursor:pointer;white-space:nowrap;flex:none}
  .task.done .tick{background:var(--leaf);color:var(--field);border-color:var(--leaf)}

  /* ---- weather ---- */
  .wx{padding:0 0 var(--s3);margin-bottom:var(--s3);border-bottom:1px solid var(--rule)}
  .wx .read{display:flex;gap:var(--s3);align-items:baseline;flex-wrap:wrap;font-size:13px;color:var(--dim)}
  .wx .read .deg{font-size:28px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
  .wx .read .deg.hot{color:var(--tomato)} .wx .read .cold{color:var(--water)}
  .wx .warn{margin-top:var(--s2);background:color-mix(in srgb,var(--tomato) 10%,transparent);
    border-radius:var(--r-sm);padding:10px var(--s3)}
  .wx .warn.cold{background:color-mix(in srgb,var(--water) 12%,transparent)}
  .wx .warn b{display:block;font-size:14px;font-weight:600;color:var(--tomato);margin-bottom:2px}
  .wx .warn.cold b{color:var(--water)}
  .wx .warn span{font-size:13.5px;color:var(--dim);line-height:1.45;font-family:var(--prose)}

  /* ---- segmented control ---- */
  .segs{display:flex;gap:3px;background:var(--paper);border-radius:var(--r-pill);padding:3px}
  .segs button{border:none;background:none;color:var(--dim);font-size:13px;border-radius:var(--r-pill);
    padding:6px 14px;cursor:pointer;min-height:32px}
  .segs button[aria-selected="true"]{background:var(--field);color:var(--ink);font-weight:600;
    box-shadow:var(--shadow)}

  /* ---- month ---- */
  .navrow{display:flex;align-items:center;gap:var(--s1);margin-bottom:var(--s3)}
  .navrow button{border:1px solid var(--rule);background:var(--field);border-radius:var(--r-pill);
    min-width:34px;height:34px;cursor:pointer;font-size:15px}
  .navrow .lab{min-width:160px;text-align:center;font-size:15px;font-weight:600}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:11.5px;color:var(--dim);
    text-align:center;padding-bottom:6px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cell{min-height:58px;background:var(--paper);border:1px solid transparent;border-radius:var(--r-sm);
    padding:5px 6px;cursor:pointer;position:relative;text-align:left}
  .cell:hover{border-color:var(--leaf)}
  .cell.out{background:none;cursor:default}
  .cell.past{opacity:.45}
  .cell.today{background:color-mix(in srgb,var(--leaf) 14%,transparent);border-color:var(--leaf)}
  .cell.hot{border-color:color-mix(in srgb,var(--tomato) 55%,transparent)}
  .cell.cold{border-color:color-mix(in srgb,var(--water) 55%,transparent)}
  .cell .d{font-size:12.5px;font-weight:600}
  .cell .t{position:absolute;top:5px;right:6px;font-size:10.5px;color:var(--dim)}
  .cell .t.warm{color:var(--tomato)}
  .dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
  .dot{width:6px;height:6px;border-radius:var(--r-pill);display:inline-block}
  .dot.water{background:var(--water)} .dot.pollen{background:var(--pollen)} .dot.care{background:var(--leaf)}
  .dot.note{background:var(--ink)}
  .dot.photo{background:none;box-shadow:inset 0 0 0 1.5px var(--dim)}

  /* ---- journal ---- */
  .day{display:flex;align-items:center;gap:var(--s2);margin:var(--s4) 0 var(--s2);font-size:13px;
    font-weight:600;color:var(--dim)}
  .day i{flex:1;height:1px;background:var(--rule)}
  .day span:last-child{font-weight:400;font-size:12px}
  .entry{padding:var(--s3) 0;border-top:1px solid var(--rule)}
  .entry .said{font-family:var(--prose);font-size:16.5px;line-height:1.45;margin:0 0 var(--s2)}
  .entry .read{display:flex;gap:var(--s2);align-items:flex-start;padding:8px 0 0;margin-top:6px}
  .entry .read .art{width:32px;height:32px;flex:none;border-radius:var(--r-sm);overflow:hidden;background:var(--field)}
  .entry .read .art svg{width:100%;height:100%;display:block}
  .entry .read b{font-size:13.5px;font-weight:600;display:block}
  .entry .read span{font-size:14px;line-height:1.45;font-family:var(--prose)}
  .entry.live{border-left:3px solid var(--leaf);padding-left:var(--s3)}

  /* ---- photos ---- */
  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
  .shots button{padding:0;border:none;border-radius:var(--r-md);overflow:hidden;background:var(--wash);
    cursor:pointer;aspect-ratio:1;position:relative;display:block}
  .shots svg{width:100%;height:100%;display:block}
  .shots .when{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,rgba(8,14,10,.62),transparent);
    color:#fff;font-size:11px;padding:14px 5px 5px;text-align:center}
  figure.ref{margin:var(--s3) 0 0}
  figure.ref img{width:100%;max-height:210px;object-fit:cover;border-radius:var(--r-md);display:block}
  figure.ref figcaption{font-size:12px;color:var(--dim);margin-top:6px}

  /* ---- life ---- */
  ul.life{list-style:none;margin:0;padding:0}
  ul.life li{display:flex;gap:var(--s3);padding:9px 2px;border-top:1px solid var(--rule)}
  ul.life li:first-child{border-top:none}
  ul.life .when{flex:none;width:76px;font-size:12px;color:var(--dim);padding-top:2px}
  ul.life .what{flex:1;min-width:0;font-size:14.5px;line-height:1.45}

  .seasonstrip{padding:var(--s1) 0 var(--s3)}
  .seasonstrip .track{margin:5px 0}
  .note{padding:var(--s3) 0;border-top:1px solid var(--rule)}
  .note .prose{margin-bottom:6px}
  .note .prose:last-child{margin-bottom:0}
  .dimmed{color:var(--dim)}
  .lede em{display:block;font-style:normal;font-family:var(--ui);font-size:13px;color:var(--dim);margin-top:5px}
  .none{color:var(--dim);font-size:14.5px;font-family:var(--prose);font-style:italic;padding:var(--s2) 0}

  /* ---- the composer ---- */
  .dock{margin:0 0 var(--s5)}
  .dock .box{background:var(--field);border:1px solid var(--rule);border-radius:var(--r-lg);
    overflow:hidden;transition:border-color .15s ease}
  .dock:focus-within .box{border-color:var(--leaf);box-shadow:0 0 0 3px color-mix(in srgb,var(--leaf) 14%,transparent)}
  .dock .top{display:flex;align-items:center;gap:var(--s2);padding:11px var(--s4);font-size:12.5px;color:var(--dim)}
  .dock .top .tag{display:inline-flex;align-items:center;gap:6px;color:var(--ink);background:var(--wash);
    border-radius:var(--r-pill);padding:3px 11px 3px 3px;max-width:52%;overflow:hidden;white-space:nowrap}
  .dock .top .tag svg{width:20px;height:20px;border-radius:var(--r-pill)}
  .dock .top .fold{margin-left:auto;border:none;background:none;color:var(--dim);cursor:pointer;
    font-size:11px;padding:6px;min-width:28px;border-radius:var(--r-pill)}
  .dock .in{padding:0 var(--s4) var(--s3)}
  .dock textarea{width:100%;min-height:52px;resize:none;font:inherit;font-size:17px;color:var(--ink);
    background:none;border:none;padding:0 0 var(--s2);transition:min-height .16s ease}
  .dock textarea:focus{outline:none}
  .dock:focus-within textarea,.dock.tall textarea{min-height:104px}
  .dock .acts{display:flex;align-items:center;gap:var(--s2)}
  .dock .acts .sp{flex:1}
  .dock .acts button{border:1px solid var(--rule);background:var(--field);border-radius:var(--r-pill);
    padding:8px 14px;cursor:pointer;font-size:13px}
  .dock .acts .save{border-color:var(--leaf);color:var(--leaf)}
  .dock .acts .save:disabled{opacity:.35;cursor:default}
  .dock .acts .save.on{background:var(--leaf);color:#fff;border-color:var(--leaf)}
  .dock.min .in{display:none}


  /* ---- narrow: a plant line cannot hold four columns on a phone, so it stacks:
         name and drawing, then how it is doing, then its year ---- */
  @container (max-width:760px){
    .row{flex-wrap:wrap;row-gap:7px;padding:11px var(--s3)}
    .row .who{flex:1 1 auto;width:auto}
    .row .now{flex:1 1 100%;order:3;padding-left:50px}
    .row .bars{flex:1 1 100%;order:4;padding-left:50px}
    .row.head,.row.axis{padding-top:0;padding-bottom:0}
    .row.head .art,.row.head .who,.row.head .now,
    .row.axis .art,.row.axis .who,.row.axis .now{display:none}
    .row.head .bars,.row.axis .bars{padding-left:50px}
    .sect{padding:var(--s3)}
    .wx{padding:var(--s3)}
  }

  /* ---- the lock ---- */
  #lock{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    padding:var(--s4);background:color-mix(in srgb,var(--paper) 80%,transparent);backdrop-filter:blur(3px)}
  #lock.on{display:flex}
  .waiting{width:min(430px,100%);background:var(--field);border-radius:var(--r-lg);
    padding:var(--s4) var(--s4) var(--s3);box-shadow:0 20px 54px rgba(16,32,22,.24)}
  .waiting .said{font-family:var(--prose);font-size:17.5px;line-height:1.45;margin:0 0 var(--s3)}
  .waiting .steps{display:flex;gap:5px;margin-bottom:var(--s2)}
  .waiting .steps i{flex:1;height:5px;background:var(--paper);border-radius:var(--r-pill);
    overflow:hidden;position:relative}
  .waiting .steps i b{position:absolute;inset:0 auto 0 0;background:var(--leaf);border-radius:var(--r-pill)}
  .waiting .stage{font-size:13px;font-weight:600;color:var(--leaf)}
  .waiting .eta{font-size:12px;color:var(--dim);margin-top:2px}
  .waiting .found{margin-top:var(--s3);display:flex;flex-direction:column;gap:5px}
  .waiting .found .read{display:flex;gap:var(--s2);align-items:flex-start;padding:9px var(--s3);
    background:var(--wash);border-radius:var(--r-sm)}
  .waiting .found .art{width:30px;height:30px;flex:none;border-radius:var(--r-sm);overflow:hidden;background:var(--field)}
  .waiting .found .art svg{width:100%;height:100%;display:block}
  .waiting .found b{font-size:13.5px;font-weight:600;display:block}
  .waiting .found span{font-size:14px;line-height:1.4;font-family:var(--prose)}
  .waiting .out{margin-top:var(--s3);border:none;background:none;color:var(--dim);cursor:pointer;
    font-size:12.5px;text-decoration:underline;padding:6px 0}
  body.locked{overflow:hidden}
  @media(prefers-reduced-motion:reduce){.row.touched{animation:none}}

  /* ---- prototype controls ---- */
  #dev{max-width:1120px;margin:0 auto;padding:var(--s4);display:flex;gap:var(--s2);align-items:center;
    flex-wrap:wrap;font-size:12px;color:var(--dim)}
  #dev .grp{display:flex;gap:3px;background:var(--field);border-radius:var(--r-pill);padding:3px;
    border:1px solid var(--rule)}
  #dev .grp button{border:none;background:none;color:var(--dim);padding:5px 11px;cursor:pointer;

const HORIZON=60;
let TASKS={};
const weeklyIco=w=>/feed/i.test(w)?'🍽️':/re-sow|sow/i.test(w)?'🌱':/harvest|lift|pull|pick/i.test(w)?'🧺'
  :/rotate/i.test(w)?'🔄':/check/i.test(w)?'🔍':/pinch|shoot|trim|tidy|prune|leaf|cane/i.test(w)?'✂️':'🌿';
function buildTasks(){
  TASKS={};
  const add=(d,t)=>{(TASKS[d]=TASKS[d]||[]).push(t);};
  PLANTS.forEach(p=>{
    const c=careOf(p);let last=p.last;
    for(let i=0;i<HORIZON;i++){
      const d=addDays(T,i),w=WX[d];
      const eff=p.area==='balcony'&&w?Math.max(1,Math.round(c.water*(w.tmax>=32?.5:w.tmax>=28?.65:w.tmax>=24?.8:1))):c.water;
      if(dBetween(last,d)>=eff){add(d,{pid:p.id,cat:'water',ico:'💧',what:'Kastele',why:c.why,key:'w|'+p.id});last=d;}
      (c.daily||[]).forEach(([cat,what,why])=>add(d,{pid:p.id,cat,ico:cat==='pollen'?'✋':'🌱',what,why,key:cat+'|'+p.id+'|'+what}));
      if(new Date(d).getDay()===0)(c.weekly||[]).forEach(([cat,what,why])=>
        add(d,{pid:p.id,cat,ico:weeklyIco(what),what,why,key:'wk|'+p.id+'|'+what}));
    }
  });
  (S.extra||[]).forEach(t=>{for(let i=0;i<t.days;i++){const d=addDays(T,i);
    if(!(TASKS[d]||[]).some(x=>x.key===t.key))add(d,{...t,added:true});}});
  (S.removed||[]).forEach(k=>{TASKS[T]=(TASKS[T]||[]).filter(x=>x.key!==k);});
}
const tasksOn=d=>TASKS[d]||[];

/* ================= the two model calls, simulated ================= */
const WORDS=[[/tomato|tigerella|noire|truss/i,['tomato-1','tomato-2']],[/chilli|lombardo|pepper/i,['chilli-1','chilli-2']],
 [/raspberr|vadelma|takala|maurin|berr/i,['rasp-maurin','rasp-takala-1','rasp-takala-2']],
 [/basil|mint/i,['basil-mint']],[/parsley/i,['parsley']],[/chive/i,['chives']],
 [/onion|sipuli/i,['spring-onion']],[/garlic|valkosipuli/i,['garlic']],
 [/monstera/i,['monstera']],[/ivy|hedera/i,['hedera']]];
const ISSUES=[[/aphid|kirva/i,'aphids','bad'],[/mite|punkki/i,'spider mites','bad'],
 [/yellow|kellast/i,'yellowing leaves','watch'],[/wilt|droop|sad|limp/i,'wilting','bad'],
 [/curl/i,'curling leaves','watch'],[/dry|kuiva/i,'dry soil','watch'],
 [/mould|mold|home/i,'mould','bad'],[/repot|potted/i,'repotted','watch'],
 [/flower|kukk/i,'flowering','good'],[/ripe|red|pick|harvest/i,'ripening','good']];
function distill(text,forced){
  let ids=forced?[forced]:[];
  if(!forced){
    WORDS.forEach(([re,list])=>{if(re.test(text))ids.push(...list);});
    if(/everything|all the|kaikki|whole balcony/i.test(text))ids=PLANTS.map(p=>p.id);
    const n=text.match(/\b(?:chilli|tomato|raspberr\w*|takala)\s*(\d)\b/i);
    if(n&&ids.length>1){const pick=ids.filter(i=>i.endsWith('-'+n[1]));if(pick.length)ids=pick;}
  }
  ids=[...new Set(ids)];
  const hit=ISSUES.find(([re])=>re.test(text));
  const label=hit?hit[1]:'noted',tone=hit?hit[2]:'watch';
  return {ids,label,tone,
    note:hit?`${hit[1][0].toUpperCase()+hit[1].slice(1)} reported. ${tone==='bad'?'Worth acting on this week.':'Keeping an eye on it.'}`
             :'Logged against this plant.'};
}
function planEffects(text,d){
  const extra=[],removed=[],changed=[];
  if(/water(ed)?|kastel/i.test(text))d.ids.forEach(id=>{
    const p=PLANTS.find(x=>x.id===id);if(p)p.last=T;
    if(tasksOn(T).some(t=>t.key==='w|'+id))removed.push('w|'+id);});
  if(/aphid|mite|curl|kirva|punkki/i.test(text)){
    d.ids.forEach(id=>extra.push({pid:id,cat:'care',ico:'🔍',what:'Tarkista lehtien alapinnat',
      why:'Rinse or soap-spray while the count is low.',key:'chk|'+id,days:4}));
    d.ids.forEach(id=>changed.push({pid:id,note:'kasteluväli tiivistetty 2 päivään toipumisen ajaksi'}));
  }
  if(/repot|potted/i.test(text))d.ids.forEach(id=>extra.push({pid:id,cat:'care',ico:'🔍',
    what:'Tarkista juurtuminen',why:'New soil dries unevenly for the first week.',key:'set|'+id,days:5}));
  if(/yellow|wilt|sad|droop|kellast/i.test(text))d.ids.forEach(id=>extra.push({pid:id,cat:'care',ico:'🌡️',
    what:'Siirrä pois suorasta auringosta',why:'Rule out heat stress before feeding.',key:'sun|'+id,days:3}));
  if(/ripe|red|pick|harvest/i.test(text))d.ids.forEach(id=>extra.push({pid:id,cat:'care',ico:'🧺',
    what:'Poimi joka toinen päivä',why:'Dead-ripe fruit spoils on the plant.',key:'pick|'+id,days:6}));
  if(!extra.length&&!removed.length&&d.ids.length)d.ids.forEach(id=>extra.push({pid:id,cat:'care',ico:'🔍',
    what:'Katso huomenna',why:'Following up on your note.',key:'fu|'+id,days:2}));
  return {extra,removed,changed};
}

const DISTILL=9500,PLAN=29000;
let ticker=null;
function save(){
  const text=S.draft.trim();if(!text||S.busy)return;
  const e={id:'e'+Date.now(),date:T,at:Date.now(),text,status:'pending',assigned:[],forced:S.plant||null};
  S.entries.push(e);S.draft='';S.diff=null;S.dockMin=false;
  S.busy={id:e.id,t0:Date.now(),stage:'distill'};
  clearInterval(ticker);ticker=setInterval(tick,250);
  render();
}
function tick(){
  const b=S.busy;if(!b)return;
  const el=(Date.now()-b.t0)*S.speed;
  const e=S.entries.find(x=>x.id===b.id);
  if(b.stage==='distill'&&el>=DISTILL){
    const d=distill(e.text,e.forced);
    if(!d.ids.length){e.status='unsorted';S.busy=null;clearInterval(ticker);render();return;}
    e.status='sorted';
    e.assigned=d.ids.map(pid=>({pid,note:d.note,tone:d.tone,label:d.label}));
    d.ids.forEach(pid=>{const p=plantOf(pid);
      p.health={tone:d.tone,label:d.label};
      if(d.tone!=='good')p.issues=[d.label];
      p.notes.unshift({date:T,text:d.note,quote:e.text});
      S.touched.add(pid);});
    b.stage='plan';render();return;
  }
  if(b.stage==='plan'&&el>=PLAN){
    const d=distill(e.text,e.forced),fx=planEffects(e.text,d);
    S.extra=[...S.extra,...fx.extra];S.removed=[...S.removed,...fx.removed];
    S.diff={added:fx.extra,removed:fx.removed,changed:fx.changed,at:Date.now()};
    S.plan={at:Date.now()};S.busy=null;clearInterval(ticker);
    buildTasks();render();
    setTimeout(()=>{S.touched.clear();render();},2600);
    return;
  }
  render();
}
const pct1=()=>{const b=S.busy;if(!b)return 0;
  return b.stage==='distill'?Math.min(100,(Date.now()-b.t0)*S.speed/DISTILL*100):100;};
const pct2=()=>{const b=S.busy;if(!b||b.stage==='distill')return 0;
  return Math.min(100,((Date.now()-b.t0)*S.speed-DISTILL)/(PLAN-DISTILL)*100);};
const secsLeft=()=>{const b=S.busy;if(!b)return 0;
  return Math.max(1,Math.round((PLAN-(Date.now()-b.t0)*S.speed)/1000));};
const stageLabel=()=>!S.busy?'':S.busy.stage==='distill'
  ?'1/2 · Luetaan merkintääsi':'2/2 · Rakennetaan suunnitelmaa';

/* ================= pieces ================= */
function taskRow(t,date){
  const done=S.done.has(date+'|'+t.key);
  const isNew=!!t.added&&S.diff&&S.diff.added.some(a=>a.key===t.key);
  const chg=S.diff&&t.key.startsWith('w|')&&S.diff.changed.find(c=>c.pid===t.pid);
  return `<div class="task ${done?'done':''} ${isNew?'added':chg?'changed':''}" style="--tint:${tintOf(t.pid)}">
    ${isNew?'<span class="flag add">+</span>':chg?'<span class="flag chg">~</span>':'<span class="flag"></span>'}
    <span class="mk">${t.ico}</span>
    <span class="body">
      <span class="what">${esc(t.what)}</span>
      <span class="whose">${esc(nameOf(t.pid))}</span>
      ${t.why?`<span class="why">${esc(t.why)}</span>`:''}
      ${chg?`<span class="why" style="color:var(--pollen)">${esc(chg.note)}</span>`:''}
    </span>
    <button class="tick" data-act="done" data-val="${date}|${esc(t.key)}">Tehty${done?' ✓':''}</button>
  </div>`;
}
function cutRows(){
  if(!S.diff||!S.diff.removed.length)return'';
  return S.diff.removed.map(k=>{const pid=k.slice(2);
    return `<div class="task cut" style="--tint:${tintOf(pid)}">
      <span class="flag cut">−</span><span class="mk">💧</span>
      <span class="body"><span class="what">Kastele</span>
        <span class="whose">${esc(nameOf(pid))}</span>
        <span class="why">kirjasit että kastelit sen</span></span></div>`;}).join('');
}
function dayList(date){
  if(date<T)return '<div class="none">Mennyt päivä.</div>';
  const isNew=x=>!!x.added&&S.diff&&S.diff.added.some(a=>a.key===x.key);
  const isChg=x=>!!S.diff&&x.key.startsWith('w|')&&S.diff.changed.some(c=>c.pid===x.pid);
  const t=tasksOn(date).slice().sort((a,b)=>(isNew(b)-isNew(a))||(isChg(b)-isChg(a)));
  const rows=(date===T?cutRows():'')+t.map(x=>taskRow(x,date)).join('');
  return rows?`<div class="list">${rows}</div>`:'<div class="none">Ei tehtäviä</div>';
}
function wxBlock(date){
  const w=WX[date];if(!w)return'';
  return `<div class="wx">
    <div class="read">
      <span class="deg ${w.tmax>=27?'hot':''}">${wxIcon(w)} ${w.tmax}°</span>
      <span>yö <span class="${w.tmin<=10?'cold':''}">${w.tmin}°</span></span>
      <span>sade ${w.pop}%</span>
      <span>${date===T?'tänään':dayLabel(date)}</span>
    </div>
    ${alertsOn(date).map(a=>`<div class="warn ${a.cold?'cold':''}">
      <b>${a.ico} ${esc(a.what)}</b><span>${esc(a.why)}</span></div>`).join('')}
  </div>`;
}
function entryCard(e,{live=false}={}){
  const shots=photosOn(e.date).filter(x=>(e.assigned||[]).some(a=>a.pid===x.pid));
  return `<article class="entry ${live?'live':''}">
    <p class="said">${esc(e.text)}</p>
    ${(e.assigned||[]).map(a=>`<div class="read" style="--tint:${tintOf(a.pid)}">
      <span class="art">${artOf(a.pid)}</span>
      <span><b>${esc(nameOf(a.pid))}</b><span>${esc(a.note)}</span></span></div>`).join('')}
    ${e.status==='unsorted'?'<div class="none">AI ei tunnistanut kasvia — valitse se yltä.</div>':''}
    ${shots.length?`<div class="shots" style="margin-top:var(--s2)">${shots.map(x=>
      `<button data-act="plant" data-val="${x.pid}">${artOf(x.pid)}
        <span class="when">${shortDate(x.date)}</span></button>`).join('')}</div>`:''}
  </article>`;
}
function journalSpine(){
  let last='';
  return [...S.entries].reverse().map(e=>{
    const hd=e.date!==last?`<div class="day"><span>${dayLabel(e.date)}</span><i></i>
      <span${e.date===T?' style="color:var(--pine)"':''}>${e.date===T?'tänään':relTime(e.at)}</span></div>`:'';
    last=e.date;return hd+entryCard(e);}).join('')||'<div class="none">Ei merkintöjä</div>';
}
function photoGroups(list){
  const g=[];
  list.forEach(x=>{const k=x.date.slice(0,7),l=g[g.length-1];
    if(l&&l.k===k)l.items.push(x);else g.push({k,items:[x]});});
  return g.map(grp=>`<div class="sub"><span>${KUUT[+grp.k.slice(5,7)-1]}</span>
      <span class="n">${grp.items.length}</span></div>
    <div class="shots">${grp.items.map(x=>`<button data-act="plant" data-val="${x.pid}">
      ${artOf(x.pid)}<span class="when">${shortDate(x.date)}</span></button>`).join('')}</div>`).join('');
}
/* what the line says about a plant now: the model's read if there is one, else
   the fact that matters at this stage */
function stateOf(p){
  const since=dBetween(p.last,T);
  const meta=since<=0?'kasteltu tänään':`kasteltu ${since} pv sitten`;
  const iss=(p.issues||[])[0];
  if(p.health&&p.health.tone==='bad')return {mk:'⚠️',tone:'bad',text:iss||p.health.label,meta};
  if(p.health&&p.health.tone==='watch')return {mk:'👀',tone:'watch',text:iss||p.health.label,meta};
  const w=WX[T],c=careOf(p);
  const eff=p.area==='balcony'&&w?Math.max(1,Math.round(c.water*(w.tmax>=32?.5:w.tmax>=28?.65:w.tmax>=24?.8:1))):c.water;
  if(since>eff)return {mk:'💧',tone:'watch',text:'maa kuivunut',meta};
  if(p.health)return {mk:'🌿',tone:'good',text:p.health.label,meta};
  return {mk:'🌿',tone:'good',text:p.stage,meta};
}
function lifeOf(p){
  return [{date:addDays(T,-6),kind:'stage',text:'Vaihe → '+p.stage},
    {date:p.last,kind:'water',text:'Kasteltu'},
    ...p.notes.map(n=>({date:n.date,kind:'note',text:n.text}))]
    .sort((a,b)=>b.date.localeCompare(a.date));
}
const LIFE_MK={stage:'🪴',water:'💧',note:'✨'};
const lifeList=p=>`<ul class="life">${lifeOf(p).map(l=>`<li>
  <span class="when">${dayLabel(l.date)}</span>
  <span class="what">${LIFE_MK[l.kind]} ${esc(l.text)}</span></li>`).join('')}</ul>`;

function chartRow(p){
  const s=stateOf(p),ph=SEASON[keyOf(p.id)]||[];
  return `<div class="row ${S.touched.has(p.id)?'touched':''}" style="--tint:${tintOf(p.id)}">
    <span class="art">${artOf(p.id)}</span>
    <span class="who"><b>${esc(p.name)}</b><em>${esc(phaseNow(p.id))}</em></span>
    <span class="bars"><span class="track">${ph.map(([c,f,t])=>
      `<i class="bar ${c}" style="left:${spos(f)}%;width:${Math.max(spos(t)-spos(f),1.5)}%"></i>`).join('')}</span></span>
    <span class="now ${s.tone}"><span class="mk">${s.mk}</span>
      <span class="txt">${esc(s.text)}<em>${esc(s.meta)}</em></span></span>
  </div>`;
}
/* The nav is the page's primary control, so it lives above everything and
   answers for the whole page: whole balcony, or one plant. */
function navBar(){
  const sel=S.plant;
  return `<nav class="nav" aria-label="Kasvit">
    <div class="strip">
      <button class="chip all" data-act="all" aria-pressed="${!sel}">Koko parveke</button>
      ${PLANTS.map(p=>`<button class="chip" data-act="plant" data-val="${p.id}"
        aria-pressed="${sel===p.id}" title="${esc(p.name)}">
        <span class="av">${artOf(p.id)}</span>${esc(shortName(p.name))}</button>`).join('')}
    </div>
  </nav>`;
}
function chart(){
  const scaleRow=(inner,cls)=>`<div class="row ${cls}">
    <span class="art"></span><span class="who"></span>
    <span class="bars"><span class="scale">${inner}</span></span><span class="now"></span></div>`;
  const need=PLANTS.filter(p=>p.health&&p.health.tone!=='good').length;
  return `<section class="sect">
    <div class="hd"><h2>Kasvit</h2>
      <span class="meta">${need?`<b>${need} vaatii huomiota</b> · `:''}${PLANTS.length} kasvia</span></div>
    ${scaleRow([['Kesä','2026-07-01'],['Elo','2026-08-01'],['Syys','2026-09-01'],['Loka','2026-10-01']]
      .map(([l,d])=>`<b style="left:${spos(d)}%">${l}</b>`).join(''),'head')}
    ${PLANTS.map(chartRow).join('')}
    ${scaleRow(`<b class="today" style="left:${spos(T)}%">▏tänään</b>`,'axis')}
    <div class="legend">
      <span><i style="background:var(--ph-grow)"></i>kasvaa</span>
      <span><i style="background:var(--ph-flower)"></i>kukkii</span>
      <span><i style="background:var(--ph-fruit)"></i>raakile</span>
      <span><i style="background:var(--ph-harvest)"></i>sato</span></div>
  </section>`;
}
function monthGrid(){
  const {y,m}=S.view;
  const first=new Date(y,m,1),daysIn=new Date(y,m+1,0).getDate(),lead=(first.getDay()+6)%7;
  const pd=new Set(PHOTOS.map(x=>x.date)),nd=new Set(S.entries.map(e=>e.date));
  let h='<div class="dow"><span>Ma</span><span>Ti</span><span>Ke</span><span>To</span><span>Pe</span><span>La</span><span>Su</span></div><div class="grid">';
  for(let i=0;i<lead;i++)h+='<div class="cell out"></div>';
  for(let d=1;d<=daysIn;d++){
    const date=iso(new Date(y,m,d)),w=WX[date],list=tasksOn(date),al=alertsOn(date);
    h+=`<button class="cell ${date===T?'today':''} ${date<T?'past':''} ${
      al.some(a=>!a.cold)?'hot':al.some(a=>a.cold)?'cold':''}" data-act="day" data-val="${date}"
      aria-label="${dayLabel(date)}, ${list.length} tehtävää">
      <span class="d">${d}</span>${w?`<span class="t ${w.tmax>=27?'warm':''}">${w.tmax}°</span>`:''}
      <span class="dots">${list.slice(0,5).map(x=>
        `<i class="dot ${x.cat==='water'?'water':x.cat==='pollen'?'pollen':'care'}"></i>`).join('')}${
        nd.has(date)?'<i class="dot note"></i>':''}${pd.has(date)?'<i class="dot photo"></i>':''}</span></button>`;
  }
  return h+'</div>';
}

/* ================= the plant, in full ================= */
function plantView(p){
  const key=keyOf(p.id),pr=PROFILE[key]||{t:p.name,body:[],src:''};
  const s=stateOf(p),mine=photosFor(p.id);
  const notes=p.notes.slice().sort((a,b)=>b.date.localeCompare(a.date));
  const ph=SEASON[keyOf(p.id)]||[];
  return `<section class="sect">
    <div class="hd"><h2>${esc(pr.t)}</h2>
      <span class="meta">${p.area==='balcony'?'Parvekkeella':'Sisällä'} · ${esc(p.stage)}</span></div>
    <p class="lede ${s.tone}"><span class="mk">${s.mk}</span>${esc(s.text)}<em>${esc(s.meta)}</em></p>
    ${p.note?`<p class="prose dimmed">${esc(p.note)}</p>`:''}

    <div class="sub"><span>Kausi</span><span class="n">${esc(phaseNow(p.id))}</span></div>
    <div class="seasonstrip">
      <span class="scale">${[['Kesä','2026-07-01'],['Elo','2026-08-01'],['Syys','2026-09-01'],['Loka','2026-10-01']]
        .map(([l,d])=>`<b style="left:${spos(d)}%">${l}</b>`).join('')}</span>
      <span class="track">${ph.map(([c,f,t])=>
        `<i class="bar ${c}" style="left:${spos(f)}%;width:${Math.max(spos(t)-spos(f),1.5)}%"></i>`).join('')}</span>
      <span class="scale"><b class="today" style="left:${spos(T)}%">▏tänään</b></span>
    </div>
    ${lifeList(p)}

    <div class="sub"><span>Päiväkirja</span><span class="n">${notes.length}</span></div>
    ${notes.length?notes.map(n=>`<div class="note">
      <div class="data">${dayLabel(n.date)} ✨</div>
      <p class="prose">${esc(n.text)}</p>
      ${n.quote?`<p class="prose quote">“${esc(n.quote)}”</p>`:''}</div>`).join('')
      :'<div class="none">Ei merkintöjä</div>'}

    ${mine.length?`<div class="sub"><span>Kuvat</span>
      <span class="n">${mine.length} kuvaa · ${dBetween(mine[mine.length-1].date,T)} pv</span></div>
      ${photoGroups(mine)}`:''}

    <div class="sub"><span>Hoito</span><span class="n">${esc(pr.src||'')}</span></div>
    ${(pr.body||[]).map(b=>`<p class="prose">${esc(b)}</p>`).join('')}
    ${REAL[key]?`<figure class="ref"><img src="${REAL[key][0]}" alt="${esc(REAL[key][1])}" loading="lazy"
      onerror="this.parentElement.style.display='none'"><figcaption>${esc(REAL[key][1])}</figcaption></figure>`:''}
  </section>`;
}

/* ================= the balcony ================= */
function balconyView(){
  const seg=(k,l)=>`<button data-act="mode" data-val="${k}" aria-selected="${S.mode===k}">${l}</button>`;
  if(S.day){
    return `<section class="sect">
      <div class="hd"><h2>${dayLabel(S.day)}</h2>
        <span class="meta"><button class="tick" data-act="mode" data-val="month">‹ ${KUUT[S.view.m]}</button></span></div>
      ${wxBlock(S.day)}${dayList(S.day)}
      <div class="sub"><span>Päiväkirja</span></div>
      ${S.entries.filter(e=>e.date===S.day).map(e=>entryCard(e)).join('')||'<div class="none">Ei merkintöjä</div>'}
      ${photosOn(S.day).length?`<div class="shots">${photosOn(S.day).map(x=>
        `<button data-act="plant" data-val="${x.pid}">${artOf(x.pid)}
          <span class="when">${esc(shortName(nameOf(x.pid)))}</span></button>`).join('')}</div>`:''}
    </section>`;
  }
  const body=S.mode==='today'?wxBlock(T)+dayList(T)
    :S.mode==='month'?`<div class="navrow">
        <button data-act="step" data-val="-1" aria-label="Edellinen kuukausi">‹</button>
        <span class="lab">${KUUT[S.view.m]} ${S.view.y}</span>
        <button data-act="step" data-val="1" aria-label="Seuraava kuukausi">›</button></div>${monthGrid()}`
    :journalSpine();
  const meta=S.mode==='today'?`${tasksOn(T).length} tehtävää`
    :S.mode==='journal'?`${S.entries.length} merkintää`:'';
  return `<section class="sect">
    <div class="hd"><h2>Koko parveke</h2>
      <div class="segs">${seg('today','Tänään')}${seg('month','Kuukausi')}${seg('journal','Päiväkirja')}</div>
      <span class="meta">${meta}</span></div>
    ${body}</section>`;
}

/* ================= composer ================= */
function dock(){
  const p=S.plant?plantOf(S.plant):null;
  const can=!!S.draft.trim();
  return `<div class="dock ${S.dockMin?'min':''} ${can?'tall':''}">
    <div class="box">
      <div class="top">
        <span>Uusi merkintä · ${shortDate(T)}</span>
        ${p?`<span class="tag">${artOf(p.id)} ${esc(shortName(p.name))}</span>`:''}
        <button class="fold" data-act="fold" aria-expanded="${!S.dockMin}"
          aria-label="${S.dockMin?'Avaa kirjoituskenttä':'Pienennä kirjoituskenttä'}">${S.dockMin?'▲':'▼'}</button>
      </div>
      <div class="in">
        <label class="vhid" for="ta">Uusi merkintä</label>
        <textarea id="ta" data-ta="1"
          placeholder="${p?`Mitä ${esc(shortName(p.name))} tekee?`:'Mitä parvekkeella tapahtuu?'}">${esc(S.draft)}</textarea>
        <div class="acts">
          <button data-act="photo" aria-label="Lisää kuva">📷</button>
          <span class="sp"></span>
          <button class="save ${can?'on':''}" data-act="save" ${can?'':'disabled'}>Tallenna</button>
        </div>
      </div>
    </div></div>`;
}

/* ================= the lock ================= */
/* While the two calls run the whole page is inert: the plan on screen is about
   to be replaced, so ticking or editing against it would write to a plan that
   no longer exists. The card is the note itself, filling in as the calls land. */
function lockView(){
  const el=$('#lock'),b=S.busy;
  if(!b){el.className='';el.innerHTML='';document.body.classList.remove('locked');return;}
  const e=S.entries.find(x=>x.id===b.id);
  el.className='on';document.body.classList.add('locked');
  el.innerHTML=`<div class="waiting">
    <p class="said">${esc(e.text)}</p>
    <div class="steps"><i><b style="width:${pct1()}%"></b></i><i><b style="width:${pct2()}%"></b></i></div>
    <div class="stage">${stageLabel()}</div>
    <div class="eta">noin ${secsLeft()} s · muu käyttöliittymä odottaa</div>
    ${(e.assigned||[]).length?`<div class="found">${e.assigned.map(a=>`
      <div class="read" style="--tint:${tintOf(a.pid)}"><span class="art">${artOf(a.pid)}</span>
      <span><b>${esc(nameOf(a.pid))}</b><span>${esc(a.note)}</span></span></div>`).join('')}</div>`:''}
    ${(Date.now()-b.t0)*S.speed>45000?'<button class="out" data-act="escape">Päästä minut takaisin</button>':''}
  </div>`;
}

/* ================= render ================= */
function render(){
  const a=document.activeElement,keep=a&&a.dataset&&a.dataset.ta?a.selectionStart:null;
  $('#root').className=S.frame==='phone'?'phone':'';
  $('#page').innerHTML=
    `<header class="mast">
       <h1>Daran parvekepuutarha</h1>
       <span class="where">Tampere · lasitettu parveke</span>
       <span class="fresh">Suunnitelma ${relTime(S.plan.at)}</span>
     </header>
     ${navBar()}
     ${dock()}
     ${S.plant?plantView(plantOf(S.plant)):chart()+balconyView()}`;
  lockView();
  document.querySelectorAll('#frames button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.frame===S.frame)));
  document.querySelectorAll('#speeds button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.speed===S.speed)));
  if(keep!=null){const t=$('#ta');if(t){t.focus();t.setSelectionRange(keep,keep);}}
}

/* ================= actions ================= */
const ACT={
  plant:v=>{S.plant=v;S.day=null;render();},
  all:()=>{S.plant=null;render();},
  mode:v=>{S.mode=v;S.day=null;render();},
  day:v=>{S.day=v;S.plant=null;render();},
  step:v=>{S.view.m+=+v;
    if(S.view.m<0){S.view.m=11;S.view.y--;} if(S.view.m>11){S.view.m=0;S.view.y++;}
    render();},
  done:v=>{S.done.has(v)?S.done.delete(v):S.done.add(v);render();},
  fold:()=>{S.dockMin=!S.dockMin;render();if(!S.dockMin)setTimeout(()=>$('#ta')&&$('#ta').focus(),30);},
  save:()=>save(),
  photo:()=>alert('Prototyypissä kuvat ovat piirroksia. Oikeassa sovelluksessa tähän tulee kameran valinta.'),
  escape:()=>{S.busy=null;clearInterval(ticker);render();},
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(S.busy&&el.dataset.act!=='escape')return;    /* the lock answers, nothing else */
  const fn=ACT[el.dataset.act];if(!fn)return;
  e.preventDefault();fn(el.dataset.val,el);
});
document.addEventListener('input',e=>{
  if(!e.target.dataset.ta)return;
  S.draft=e.target.value;
  const b=document.querySelector('[data-act="save"]');
  if(b){b.disabled=!S.draft.trim();b.classList.toggle('on',!!S.draft.trim());}
  const d=document.querySelector('.dock');if(d)d.classList.toggle('tall',!!S.draft.trim());
});
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter')save();
  if(e.key==='Escape'&&!S.busy&&S.plant){S.plant=null;render();}
});

/* prototype controls */
$('#frames').onclick=e=>{const b=e.target.closest('[data-frame]');if(!b)return;
  S.frame=b.dataset.frame;LS.set('protoFrame',S.frame);render();};
$('#speeds').onclick=e=>{const b=e.target.closest('[data-speed]');if(!b)return;
  S.speed=+b.dataset.speed;LS.set('protoSpeed',S.speed);render();};
$('#demo').onclick=()=>{S.draft='aphids on chilli 2, the new leaves are curling';S.dockMin=false;
  render();if($('#ta'))$('#ta').focus();};
$('#reset').onclick=()=>{clearInterval(ticker);const f=S.frame,sp=S.speed;fresh();S.frame=f;S.speed=sp;buildTasks();render();};

fresh();buildTasks();render();
if(new URLSearchParams(location.search).get('sim')){S.draft='aphids on chilli 2, the new leaves are curling';save();}
</script>
</body>
</html>
