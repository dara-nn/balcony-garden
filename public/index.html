<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dara's Balcony Garden, Tampere</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231E4D3B'/%3E%3Cpath d='M32 52V30' stroke='%23EAF0E9' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M32 36c-11 0-17-6-17-15 10 0 17 6 17 15z' fill='%237FBFA0'/%3E%3Cpath d='M32 32c0-10 6-17 16-17 0 10-6 17-16 17z' fill='%23EAF0E9'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231E4D3B'/%3E%3Cpath d='M32 52V30' stroke='%23EAF0E9' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M32 36c-11 0-17-6-17-15 10 0 17 6 17 15z' fill='%237FBFA0'/%3E%3Cpath d='M32 32c0-10 6-17 16-17 0 10-6 17-16 17z' fill='%23EAF0E9'/%3E%3C/svg%3E">
<meta name="theme-color" content="#1E4D3B">
<script>try{var _t=JSON.parse(localStorage.getItem('theme')||'null');if(_t)document.documentElement.dataset.theme=_t;}catch(e){}</script>
<style>
  /* ============================================================
     Daran parvekepuutarha, the chart direction.

     Soft, rounded, and organised by colour rather than by rules. Every plant
     owns the background colour of its own illustration, and that colour washes
     the whole row, chip and tile that belong to it, so the page is legible as a
     garden before it is read as an interface. Nothing shouts in capitals.

     UI     Avenir Next , the site's own voice
     Prose  Charter     , what the model writes, in something you read
     ============================================================ */
  :root{
    --paper:#EFF2EA; --field:#FFFFFF; --ink:#17211B; --dim:#6C7A70; --rule:#E1E7DA;
    --pine:#1E4D3B; --leaf:#3E7D5C; --tomato:#C4462C; --water:#2F6E8F; --pollen:#B0810F;
    --ph-grow:#9BC7AA; --ph-flower:#DDA0B4; --ph-fruit:#E79A4E; --ph-harvest:#CC5438;
    --ui:"Avenir Next","Avenir","Segoe UI",system-ui,sans-serif;
    --prose:"Charter","Iowan Old Style","Georgia",serif;
    --s1:4px; --s2:8px; --s3:12px; --s4:18px; --s5:28px; --s6:44px;
    --r-lg:20px; --r-md:14px; --r-sm:10px; --r-pill:999px;
    --tint:#9BC7AA;
    --wash:color-mix(in srgb,var(--tint) 16%,var(--field));
    --shadow:0 2px 10px rgba(22,40,28,.05);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0F140F; --field:#19201A; --ink:#E7EEE4; --dim:#8B9A8C; --rule:#27302A;
      --pine:#8FCBA9; --leaf:#7FBFA0; --tomato:#EF7355; --water:#7BB9DB; --pollen:#DDB059;
      --shadow:0 2px 12px rgba(0,0,0,.3);
      --wash:color-mix(in srgb,var(--tint) 20%,var(--field));
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F140F; --field:#19201A; --ink:#E7EEE4; --dim:#8B9A8C; --rule:#27302A;
    --pine:#8FCBA9; --leaf:#7FBFA0; --tomato:#EF7355; --water:#7BB9DB; --pollen:#DDB059;
    --shadow:0 2px 12px rgba(0,0,0,.3);
    --wash:color-mix(in srgb,var(--tint) 20%,var(--field));
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--ui);-webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
  .vhid{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}

  #root{container-type:inline-size;position:relative;margin:0 auto;background:var(--paper)}
  #root.phone{max-width:392px;box-shadow:0 0 0 1px var(--rule)}
  .page{max-width:1120px;margin:0 auto;padding:var(--s4) var(--s4) var(--s5)}
  @container (max-width:899px){ .page{padding:var(--s3) var(--s3) var(--s4)} }

  /* ---- masthead ---- */
  .mast{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s4)}
  .mast h1{font-size:clamp(20px,3vw,25px);font-weight:600}
  .mast .where{font-size:13px;color:var(--dim)}
  .mast .fresh{margin-left:auto;font-size:12px;color:var(--dim);background:var(--field);
    border-radius:var(--r-pill);padding:5px 11px;border:1px solid var(--rule)}

  /* ---- a section is a card ---- */
  .sect{background:var(--field);border:1px solid var(--rule);border-radius:var(--r-lg);
    padding:var(--s4) var(--s4) var(--s5);margin-bottom:var(--s6);box-shadow:var(--shadow)}
  .sect:last-child{margin-bottom:0}
  .sect > .hd{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;
    padding-bottom:var(--s3);margin-bottom:var(--s4);border-bottom:2px solid var(--ink)}
  .sect > .hd h2{font-size:21px;letter-spacing:-.02em}
  .sect > .hd .meta{margin-left:auto;font-size:13px;color:var(--dim)}
  .sect > .hd .meta b{font-weight:600;color:var(--tomato)}
  /* the plant list: one row per plant, health in words, season bar, guidance */
  /* One column for the names, so every bar starts and ends at the same x and
     the month scale above them lines up with all of them. */
  .sect{--namecol:300px}
  .prow{padding:10px 0;border-bottom:1px solid var(--rule)}
  .phead{display:grid;grid-template-columns:var(--namecol) 1fr;align-items:center;gap:var(--s2)}
  .pname{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px var(--s2);background:none;
    border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;min-width:0}
  .pname .art{align-self:center;width:34px;height:34px;flex:none;overflow:hidden;
    border-radius:var(--r-sm)}
  .pname .art svg{width:100%;height:100%;display:block}
  .pname em{font-style:normal;color:var(--dim);font-size:.85em}
  .water{font-size:.85em;color:var(--dim)}
  .wline{display:flex;align-items:center;gap:var(--s1);margin:2px 0 4px}
  /* Two paragraphs that read differently: what it is doing, then what to do.
     A label each, on one shared column so the prose lines up. */
  .status,.guide{display:grid;grid-template-columns:58px 1fr;gap:var(--s2);
    margin:3px 0 0;font-size:.92em;line-height:1.45}
  .lbl{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:600;
    color:var(--dim);padding-top:.32em}
  .status{color:var(--dim)}
  .status>span{color:var(--ink)}
  .guide{color:var(--ink)}
  .legend{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
    margin:var(--s2) 0 var(--s4);font-size:12.5px;color:var(--dim)}
  .legend span{display:flex;align-items:center;gap:5px}
  .legend .sep{width:1px;height:12px;background:var(--rule);padding:0}
  .sw{width:14px;height:6px;border-radius:3px;display:inline-block}
  .sw.grow{background:var(--ph-grow)} .sw.flower{background:var(--ph-flower)}
  .sw.fruit{background:var(--ph-fruit)} .sw.harvest{background:var(--ph-harvest)}
  .sw.future{background:var(--dim);opacity:.4}
  .drop{background:none;border:0;padding:2px 4px;cursor:pointer;opacity:.35;font-size:.95em}
  .drop:hover,.drop:focus-visible{opacity:1}
  .chart{min-width:0}
  .monthscale{position:relative;height:.95em;margin:0 0 3px;font-size:11px;color:var(--dim);opacity:.75}
  .monthscale b{position:absolute;font-weight:400;transform:translateX(-50%)}
  .prow .track{position:relative;height:6px;border-radius:3px;
    background:var(--rule);overflow:hidden}
  .prow .track .bar.future{opacity:.4}
  .sect>.prow:first-of-type{padding-top:0}
  .prow .track .bar{position:absolute;top:0;height:100%;border-radius:3px}
  .prow .track .bar.grow{background:var(--ph-grow)} .prow .track .bar.flower{background:var(--ph-flower)}
  .prow .track .bar.fruit{background:var(--ph-fruit)} .prow .track .bar.harvest{background:var(--ph-harvest)}
  .prow .track .tline{position:absolute;top:-2px;width:2px;height:10px;background:var(--ink)}
  .hrow{padding:var(--s2) 0;border-bottom:1px solid var(--rule)}
  .striplabel{align-self:center;padding:0 var(--s2);font-size:12px;color:var(--dim)}
  .wchk{display:flex;align-items:center;gap:6px;font-size:.85em;color:var(--dim)}
  @media (max-width:760px){
    .sect{--namecol:1fr}
    .phead{grid-template-columns:1fr;gap:6px}
    .status,.guide{grid-template-columns:48px 1fr;gap:6px}
  }

  /* a sub-heading inside a section: smaller, its own rule, its own air */
  .sub{display:flex;align-items:baseline;gap:var(--s2);margin:var(--s5) 0 var(--s2);font-size:15px;
    font-weight:600;color:var(--ink);padding-bottom:6px;border-bottom:1px solid var(--rule)}
  .sub:first-of-type{margin-top:var(--s4)}
  .sub .n{margin-left:auto;font-weight:400;font-size:12.5px;color:var(--dim)}

  /* ---- the nav: it governs the whole page, so it sits above the whole page ---- */
  .nav{position:sticky;top:0;z-index:15;background:var(--paper);margin:0 0 var(--s4);
    padding:var(--s2) 0;border-bottom:1px solid var(--rule)}
  .strip{display:flex;gap:6px;overflow-x:auto;padding:2px;scrollbar-width:thin}
  .chip{display:inline-flex;align-items:center;gap:8px;flex:none;border:1px solid var(--rule);
    background:var(--field);border-radius:var(--r-pill);padding:5px 15px 5px 5px;cursor:pointer;
    font-size:14px;white-space:nowrap}
  .chip .av{width:30px;height:30px;flex:none;overflow:hidden;border-radius:var(--r-pill)}
  .chip .av svg{width:100%;height:100%;display:block}
  .chip:hover{border-color:var(--leaf)}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
  .chip.all{padding:5px 17px}

  /* ---- the chart: one soft row per plant ---- */
  .row{display:flex;align-items:center;gap:var(--s3);padding:11px 2px;width:100%;text-align:left;
    border-top:1px solid var(--rule)}
  .row.head,.row.axis{border-top:none;padding:2px}
  .row.axis{border-top:1px solid var(--rule);padding-top:8px}
  .row .art{width:40px;height:40px;flex:none;overflow:hidden;border-radius:var(--r-sm)}
  .row .art svg{width:100%;height:100%;display:block}
  .row .who{width:136px;flex:none;min-width:0}
  .row .who b{display:block;font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;letter-spacing:-.01em}
  .row .who em{display:block;font-style:normal;font-size:12px;color:var(--dim);margin-top:2px}
  .row .bars{flex:1 1 auto;min-width:88px}
  .row .now{flex:0 0 clamp(168px,26%,280px);min-width:0;display:flex;gap:7px;align-items:flex-start}
  .row .now .mk{flex:none;font-size:13px;line-height:1.35}
  .row .now .txt{min-width:0;font-size:14px;line-height:1.35}
  .row .now .txt em{display:block;font-style:normal;font-size:11.5px;color:var(--dim);margin-top:1px}
  .row .now.bad .txt{color:var(--tomato);font-weight:600}
  .row .now.watch .txt{color:var(--water)}
  @keyframes settle{0%{transform:scale(1.01)}100%{transform:none}}
  .row.touched{animation:settle .7s ease-out;background:color-mix(in srgb,var(--leaf) 10%,transparent)}

  .track{position:relative;display:block;height:10px;background:color-mix(in srgb,var(--ink) 8%,transparent);
    border-radius:var(--r-pill);overflow:hidden}
  .bar{position:absolute;top:0;height:100%}
  .bar.grow{background:var(--ph-grow)} .bar.flower{background:var(--ph-flower)}
  .bar.fruit{background:var(--ph-fruit)} .bar.harvest{background:var(--ph-harvest)}
  .scale{position:relative;display:block;height:14px;font-size:11px;color:var(--dim)}
  .scale b{position:absolute;transform:translateX(-50%);font-weight:400}
  .scale b.today{color:var(--leaf);font-weight:600;transform:translateX(-4px)}
  .legend{display:flex;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s3);font-size:12px;color:var(--dim)}
  .legend i{display:inline-block;width:18px;height:8px;border-radius:var(--r-pill);margin-right:6px;vertical-align:0}

  /* ---- prose the model wrote ---- */
  .lede{font-family:var(--prose);font-size:21px;line-height:1.35;margin:0 0 var(--s3);font-weight:400}
  .lede .mk{margin-right:7px}
  .lede.bad{color:var(--tomato)} .lede.watch{color:var(--water)}
  p.prose{font-family:var(--prose);font-size:15.5px;line-height:1.6;margin:0 0 var(--s3);max-width:62ch}
  .quote{font-style:italic;color:var(--dim);font-size:14.5px;line-height:1.5}
  .data{font-size:12px;color:var(--dim)}

  /* ---- lists you act on ---- */
  .list{display:flex;flex-direction:column}
  .task{display:flex;gap:var(--s2);align-items:flex-start;padding:13px 2px;
    border-top:1px solid var(--rule)}
  .task:first-child{border-top:none}
  .task .mk{width:22px;flex:none;text-align:center;font-size:15px}
  .task .body{flex:1;min-width:0}
  .task .what{font-size:14.5px;font-weight:600}
  .task .whose{font-size:12px;color:var(--dim);display:block;margin-top:1px}
  .task .why{display:block;font-size:13.5px;color:var(--dim);line-height:1.45;margin-top:4px;
    font-family:var(--prose)}
  .task.done{opacity:.45}
  .task.added{background:color-mix(in srgb,var(--leaf) 9%,transparent);border-radius:var(--r-sm)}
  .task.changed{background:color-mix(in srgb,var(--pollen) 12%,transparent);border-radius:var(--r-sm)}
  .task.cut{opacity:.55}
  .task.cut .what{text-decoration:line-through;text-decoration-color:var(--tomato)}
  .flag{font-size:13px;font-weight:700;width:12px;flex:none;padding-top:1px}
  .flag.add{color:var(--leaf)} .flag.chg{color:var(--pollen)} .flag.cut{color:var(--tomato)}
  .tick{border:1px solid var(--leaf);color:var(--leaf);background:var(--field);border-radius:var(--r-pill);
    font-size:12.5px;padding:7px 13px;cursor:pointer;white-space:nowrap;flex:none}
  .task.done .tick{background:var(--leaf);color:var(--field);border-color:var(--leaf)}

  /* ---- weather ---- */
  .wx{padding:0 0 var(--s3);margin-bottom:var(--s3);border-bottom:1px solid var(--rule)}
  .wx .read{display:flex;gap:var(--s3);align-items:baseline;flex-wrap:wrap;font-size:13px;color:var(--dim)}
  .wx .read .deg{font-size:28px;font-weight:600;color:var(--ink);letter-spacing:-.02em}
  .wx .read .deg.hot{color:var(--tomato)} .wx .read .cold{color:var(--water)}
  .wx .warn{margin-top:var(--s2);background:color-mix(in srgb,var(--tomato) 10%,transparent);
    border-radius:var(--r-sm);padding:10px var(--s3)}
  .wx .warn.cold{background:color-mix(in srgb,var(--water) 12%,transparent)}
  .wx .warn b{display:block;font-size:14px;font-weight:600;color:var(--tomato);margin-bottom:2px}
  .wx .warn.cold b{color:var(--water)}
  .wx .warn span{font-size:13.5px;color:var(--dim);line-height:1.45;font-family:var(--prose)}

  /* ---- segmented control ---- */
  .segs{display:flex;gap:3px;background:var(--paper);border-radius:var(--r-pill);padding:3px}
  .segs button{border:none;background:none;color:var(--dim);font-size:13px;border-radius:var(--r-pill);
    padding:6px 14px;cursor:pointer;min-height:32px}
  .segs button[aria-selected="true"]{background:var(--field);color:var(--ink);font-weight:600;
    box-shadow:var(--shadow)}

  /* ---- month ---- */
  .navrow{display:flex;align-items:center;gap:var(--s1);margin-bottom:var(--s3)}
  .navrow button{border:1px solid var(--rule);background:var(--field);border-radius:var(--r-pill);
    min-width:34px;height:34px;cursor:pointer;font-size:15px}
  .navrow .lab{min-width:160px;text-align:center;font-size:15px;font-weight:600}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:11.5px;color:var(--dim);
    text-align:center;padding-bottom:6px}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .cell{min-height:58px;background:var(--paper);border:1px solid transparent;border-radius:var(--r-sm);
    padding:5px 6px;cursor:pointer;position:relative;text-align:left}
  .cell:hover{border-color:var(--leaf)}
  .cell.out{background:none;cursor:default}
  .cell.past{opacity:.45}
  .cell.today{background:color-mix(in srgb,var(--leaf) 14%,transparent);border-color:var(--leaf)}
  .cell.hot{border-color:color-mix(in srgb,var(--tomato) 55%,transparent)}
  .cell.cold{border-color:color-mix(in srgb,var(--water) 55%,transparent)}
  .cell .d{font-size:12.5px;font-weight:600}
  .cell .t{position:absolute;top:5px;right:6px;font-size:10.5px;color:var(--dim)}
  .cell .t.warm{color:var(--tomato)}
  .dots{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
  .dot{width:6px;height:6px;border-radius:var(--r-pill);display:inline-block}
  .dot.water{background:var(--water)} .dot.pollen{background:var(--pollen)} .dot.care{background:var(--leaf)}
  .dot.note{background:var(--ink)}
  .dot.photo{background:none;box-shadow:inset 0 0 0 1.5px var(--dim)}

  /* ---- journal ---- */
  .day{display:flex;align-items:center;gap:var(--s2);margin:var(--s4) 0 var(--s2);font-size:13px;
    font-weight:600;color:var(--dim)}
  .day i{flex:1;height:1px;background:var(--rule)}
  .day span:last-child{font-weight:400;font-size:12px}
  .entry{padding:var(--s3) 0;border-top:1px solid var(--rule)}
  .entry .said{font-family:var(--prose);font-size:16.5px;line-height:1.45;margin:0 0 var(--s2)}
  .entry .read{display:flex;gap:var(--s2);align-items:flex-start;padding:8px 0 0;margin-top:6px}
  .entry .read .art{width:32px;height:32px;flex:none;border-radius:var(--r-sm);overflow:hidden;background:var(--field)}
  .entry .read .art svg{width:100%;height:100%;display:block}
  .entry .read b{font-size:13.5px;font-weight:600;display:block}
  .entry .read span{font-size:14px;line-height:1.45;font-family:var(--prose)}
  .entry.live{border-left:3px solid var(--leaf);padding-left:var(--s3)}

  /* ---- photos ---- */
  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
  .shots button{padding:0;border:none;border-radius:var(--r-md);overflow:hidden;background:var(--wash);
    cursor:pointer;aspect-ratio:1;position:relative;display:block}
  .shots svg{width:100%;height:100%;display:block}
  .shots .when{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,rgba(8,14,10,.62),transparent);
    color:#fff;font-size:11px;padding:14px 5px 5px;text-align:center}
  figure.ref{margin:var(--s3) 0 0}
  figure.ref img{width:100%;max-height:210px;object-fit:cover;border-radius:var(--r-md);display:block}
  figure.ref figcaption{font-size:12px;color:var(--dim);margin-top:6px}

  /* ---- life ---- */
  ul.life{list-style:none;margin:0;padding:0}
  ul.life li{display:flex;gap:var(--s3);padding:9px 2px;border-top:1px solid var(--rule)}
  ul.life li:first-child{border-top:none}
  ul.life .when{flex:none;width:76px;font-size:12px;color:var(--dim);padding-top:2px}
  ul.life .what{flex:1;min-width:0;font-size:14.5px;line-height:1.45}

  .seasonstrip{padding:var(--s1) 0 var(--s3)}
  .seasonstrip .track{margin:5px 0}
  .note{padding:var(--s3) 0;border-top:1px solid var(--rule)}
  .note .prose{margin-bottom:6px}
  .note .prose:last-child{margin-bottom:0}
  .dimmed{color:var(--dim)}
  .lede em{display:block;font-style:normal;font-family:var(--ui);font-size:13px;color:var(--dim);margin-top:5px}
  .none{color:var(--dim);font-size:14.5px;font-family:var(--prose);font-style:italic;padding:var(--s2) 0}

  /* ---- the composer ---- */
  .dock{margin:0 0 var(--s5)}
  .dock .box{background:var(--field);border:1px solid var(--rule);border-radius:var(--r-lg);
    overflow:hidden;transition:border-color .15s ease}
  .dock:focus-within .box{border-color:var(--leaf);box-shadow:0 0 0 3px color-mix(in srgb,var(--leaf) 14%,transparent)}
  .dock .top{display:flex;align-items:center;gap:var(--s2);padding:11px var(--s4);font-size:12.5px;color:var(--dim)}
  .dock .top .tag{display:inline-flex;align-items:center;gap:6px;color:var(--ink);background:var(--wash);
    border-radius:var(--r-pill);padding:3px 11px 3px 3px;max-width:52%;overflow:hidden;white-space:nowrap}
  .dock .top .tag svg{width:20px;height:20px;border-radius:var(--r-pill)}
  .dock .top .fold{margin-left:auto;border:none;background:none;color:var(--dim);cursor:pointer;

<script type="module">
import { weatherAlerts, normalizeHealth } from './care-rules.js';
import { groupByArea, waterLabel, historyStream, seasonSpans, photosInView, chartWindow, monthTicks } from './garden-view.js';

/* ================= basics ================= */
const $=s=>document.querySelector(s);
const store={get:k=>JSON.parse(localStorage.getItem(k)||'null'),set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const TAMPERE={la:61.4981,lo:23.7610};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayISO=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s);d.setDate(d.getDate()+n);return iso(d);};
const dBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEKDAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shortDate=s=>{const d=new Date(s);return d.getDate()+'.'+(d.getMonth()+1)+'.';};

/* ================= care knowledge ================= */
const CARE={
 basilmint:{care:{
   growing:{water:2,why:'Bed dries fast behind glass',
     weekly:[['care','Pinch basil tips','Above a leaf pair, bushy, no flowers. Trim mint back.'],
             ['care','Feed basil & mint','Liquid feed, every 2nd week is enough.']]},
   harvesting:{water:2,why:'Keep harvest coming',
     weekly:[['care','Harvest basil & mint','Basil from the top, mint outer stems. Pinch any flower buds.']]}}},
 chilli:{care:{
   seedling:{water:3,why:'Light water only, damping-off kills sprouts',
     weekly:[['care','Rotate pots','Stops leggy lean toward the glass. Pot up at 4-6 true leaves.']]},
   vegetative:{water:2,why:'Steady moisture while bulking up',
     weekly:[['care','Feed','Half-strength liquid feed weekly.']]},
   flowering:{water:2,why:'Even water so flowers hold',
     daily:[['pollen','Tap the flowers','Midday, no bees behind glass.']],
     weekly:[['care','Feed high-K','Tomato feed works.']]},
   fruiting:{water:1,why:'Dry spells make fruit drop',
     weekly:[['care','Feed','High-K weekly while fruiting.']]}}},
 tomato:{care:{
   seedling:{water:2,why:'Even moisture',weekly:[]},
   vegetative:{water:2,why:'Big leaves, big thirst',
     weekly:[['care','Side shoots + ties','Snap armpit shoots, tie main stem higher.']]},
   flowering:{water:1,why:'Uneven water now = blossom end rot later',
     daily:[['pollen','Shake the flower trusses','Midday. No bees, no wind behind glass, no shake, no fruit. Vent hard: pollen sterile over ~32°C.']],
     weekly:[['care','Feed high-K','Weekly from first flowers.'],
             ['care','Side shoots + ties','Keep the 1 m stem supported.']]},
   fruiting:{water:1,why:'Never bone-dry, fruit splits',
     weekly:[['care','Feed high-K','Weekly.'],
             ['care','Tidy lower leaves','Below lowest truss, airflow against mildew.']]}}},
 chives:{care:{
   growing:{water:3,why:'Easy, top 2 cm dry, then water',weekly:[]},
   harvesting:{water:3,why:'Cut & come again',
     weekly:[['care','Harvest','Cut whole leaves 2 cm above soil, regrows fast.']]}}},
 springonion:{care:{
   growing:{water:2,why:'Shallow roots, dry fast in glazed heat',
     weekly:[['care','Re-sow','A pinch every ~3 weeks keeps supply steady.']]},
   harvesting:{water:2,why:'Keep moist to the end',
     weekly:[['care','Pull the thickest','Or cut 3 cm above base to regrow.']]}}},
 parsley:{care:{
   growing:{water:3,why:'Even moisture; bolts in heat, shade on 30°C days',weekly:[]},
   harvesting:{water:3,why:'Outer stems only',
     weekly:[['care','Harvest outer stems','Cut at the base, centre keeps producing.']]}}},
 monstera:{care:{
   settling:{water:7,why:'Newly bought, let top 3-4 cm dry first; no feed or repot yet',
     weekly:[['care','Check the spot','Bright indirect light, away from draughts/radiators. Wipe dust off leaves.']]},
   established:{water:7,why:'Top 3-4 cm dry before watering',
     weekly:[['care','Feed','Balanced feed monthly in season; give the aerial roots something to climb.']]}}},
 hedera:{care:{
   settling:{water:5,why:'Steady (not heavy) water while roots establish; top 2-3 cm dry first',
     weekly:[['care','Check the leaves','Happy in the shady corner. Watch under leaves, spider mites love dry glazed air.']]},
   established:{water:6,why:'Let surface dry between waterings',
     weekly:[['care','Trim','Cut wandering vines to shape, regrows from any node. Hardy to −10°C.']]}}},
 raspberry:{care:{
   settling:{water:2,why:'New pot behind glass dries fast, keep evenly moist, top 2-3 cm dry, never waterlogged',
     weekly:[['care','Tie in the canes','Loosely tie new canes to a support so wind and glass heat do not snap them.'],
             ['care','Feed','Half-strength liquid feed weekly while establishing. Watch leaf undersides for spider mites.']]},
   fruiting:{water:1,why:'Even water while berries swell, dry spells shrink fruit',
     daily:[['pollen','Tap the flowers','Midday, few bees behind glass. Berries drop free when dead-ripe.']],
     weekly:[['care','Pick the berries','Every 2-3 days, ripe ones spoil fast. High-K feed weekly.']]},
   dormant:{water:7,why:'Barely water over winter, hardy, stays out on the balcony',
     weekly:[['care','Cut the fruited canes','After fruiting, cut spent (2nd-year) canes to the ground; keep this year\'s new canes.']]}}},
 garlic:{care:{
   sprouting:{water:5,why:'Sparse, wet rots the clove',weekly:[]},
   bulbing:{water:5,why:'Too wet rots the bulb; keep it in the coolest corner',
     weekly:[['care','Check the leaves','Half the leaves yellow → stop watering, nearly ready.']]},
   ready:{water:99,why:'Done drinking',
     weekly:[['care','Lift the bulb?','Half+ leaves brown → lift, dry 2 weeks somewhere airy.']]}}}
};

/* ================= server docs ================= */

/* ================= server docs ================= */
let statusDoc=store.get('statusDoc')||{updatedAt:0,plants:{}};
let careDoc=store.get('careDoc')||null;
let entriesDoc=store.get('entriesDoc')||{updatedAt:0,entries:[]};

async function loadStatus(){
  try{const r=await fetch('/api/status',{cache:'no-store'});
    if(r.ok){statusDoc=await r.json();store.set('statusDoc',statusDoc);}}catch(e){}
}
async function loadPlan(){
  try{const r=await fetch('/api/care',{cache:'no-store'});
    if(r.ok){const d=await r.json();careDoc=(d&&d.plants)?d:null;store.set('careDoc',careDoc);}}catch(e){}
}
async function loadEntries(){
  try{const r=await fetch('/api/entries',{cache:'no-store'});
    if(r.ok){entriesDoc=await r.json();store.set('entriesDoc',entriesDoc);}}catch(e){}
}
function relTime(ms){if(!ms)return'';
  const s=Math.round((Date.now()-ms)/1000);
  if(s<90)return'just now';if(s<3600)return Math.round(s/60)+' min ago';
  if(s<86400)return Math.round(s/3600)+' h ago';return Math.round(s/86400)+' d ago';}

/* The distiller takes a few seconds; poll until the entry stops being pending.
   Redraw the open sheet too, that is where the entry the user just wrote is shown. */
const typing=()=>{const a=document.activeElement;
  return !!a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT');};
function flashPlant(pid){touched.add(pid);setTimeout(()=>{touched.delete(pid);renderAll();},2600);}
function refreshUI(){renderAll();}
let _poll=null,busy='';
/* Saving kicks off two model calls back to back: the distiller sorts the note,
   then the planner rebuilds the schedule. Watch for BOTH, or the task list stops
   refreshing seconds before the new plan actually arrives. */
function refreshSoon(){
  clearTimeout(_poll);
  const planBefore=careDoc&&careDoc.generatedAt;
  let n=0;
  setBusy('read');
  const tick=async()=>{
    const wasPending=entriesDoc.entries.filter(e=>e.status==='pending').map(e=>e.id);
    await Promise.all([loadStatus(),loadPlan(),loadEntries()]);
    refreshUI();
    const landed=entriesDoc.entries.filter(e=>wasPending.includes(e.id)&&e.status==='sorted');
    landed.forEach(e=>(e.assigned||[]).forEach(a=>flashPlant(a.plantId)));

    const pending=entriesDoc.entries.some(e=>e.status==='pending');
    const planFresh=(careDoc&&careDoc.generatedAt)!==planBefore;
    const stuck=entriesDoc.entries.some(e=>wasPending.includes(e.id)&&e.status==='unsorted');
    if((!pending&&planFresh)||stuck||++n>=20){setBusy('');renderAll();return;}   // ~60s ceiling
    setBusy(pending?'read':'plan');
    _poll=setTimeout(tick,3000);
  };
  _poll=setTimeout(tick,2500);
}
/* One state for the whole page while the two model calls run: everything on
   screen is about to be replaced, so nothing may be touched until it is. */
function setBusy(label){
  busy=label;
  if(label&&!busyAt)busyAt=Date.now();
  if(!label)busyAt=0;
  renderLock();
}
/* Give the server a record for any plant it has never seen. Place is not sent:
   the Worker reads garden-data.js itself, so it is right without a browser. */
async function seedStatus(){
  const seed=window.GARDEN_SEED;if(!seed)return;
  if(store.get('statusSeedVersion')===seed.version)return;
  if(!store.get('uploadPass'))return;                       // visitors never write
  for(const sp of seed.plants){
    await api('/api/status/'+encodeURIComponent(sp.id)+'?seed=1',{
      method:'PUT',headers:{'content-type':'application/json'},
      body:JSON.stringify({name:sp.name,species:sp.species,
        ...(statusDoc.plants[sp.id]?.stage?{}:{stage:sp.stage,lastWatered:sp.water||todayISO()})}),
    });
  }
  store.set('statusSeedVersion',seed.version);
  await loadStatus();
}

/* ================= weather ================= */
let forecast=store.get('forecastT3');
async function loadWx(){
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${TAMPERE.la}&longitude=${TAMPERE.lo}`+
      `&current=temperature_2m,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,relative_humidity_2m_mean`+
      `&forecast_days=14&timezone=auto`;
    const d=await(await fetch(u)).json();
    forecast={fetched:todayISO(),nowT:d.current.temperature_2m,rh:d.current.relative_humidity_2m,
      days:Object.fromEntries(d.daily.time.map((t,i)=>[t,{tmax:d.daily.temperature_2m_max[i],tmin:d.daily.temperature_2m_min[i],pop:d.daily.precipitation_probability_max[i],rh:d.daily.relative_humidity_2m_mean?.[i]}]))};
    store.set('forecastT3',forecast);
  }catch(e){}
  renderAll();

let PHOTOS=[];
const photoURL=id=>'/api/photos/'+id;
const shown=list=>list.filter(x=>!_hidden.has(x.id));
function applyPhotos(){
  PHOTOS.forEach(p=>{if(p.plant==='takala')p.plant='takala-1';});
  renderAll();
}
async function loadPhotos(){
  try{const r=await fetch('/api/photos');if(r.ok)PHOTOS=await r.json();}catch(e){}
  applyPhotos();
}
async function uploadOne(blob,date,plant){
  const r=await apiWrite('POST','/api/photos?date='+encodeURIComponent(date)+'&plant='+encodeURIComponent(plant||''),blob,blob.type||'image/jpeg');
  if(r&&r.ok){const rec=await r.json();PHOTOS.push(rec);return rec;}
  toast('Could not upload that photo.');
  return null;
}
function shrink(file){return new Promise(res=>{
  const img=new Image();img.onload=()=>{
    const s=Math.min(1,1000/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');cv.width=img.width*s;cv.height=img.height*s;
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(b=>res(b||file),'image/jpeg',.82);};
  img.src=URL.createObjectURL(file);});}

/* ---- viewer ---- */
let viewerList=[],viewerIdx=-1,viewerKey=null,viewerFocus=null;
function currentPhotoList(){
  const have=new Set(PHOTOS.map(p=>p.id));
  return [...document.querySelectorAll('#page [data-act="view"]')].map(i=>i.dataset.val).filter(id=>have.has(id));
}
function showViewerAt(i){
  if(i<0||i>=viewerList.length)return;
  viewerIdx=i;viewerKey=viewerList[i];
  const rec=PHOTOS.find(p=>p.id===viewerKey);
  $('#viewer-img').src=photoURL(viewerKey);
  const p=rec&&rec.plant?plantById(rec.plant):null;
  $('#viewer-cap').textContent=rec?`${p?p.name:'All plants'} · ${shortDate(rec.date)}`:'';
  $('#viewer-prev').disabled=i<=0;
  $('#viewer-next').disabled=i>=viewerList.length-1;
}
function viewPhoto(id){
  viewerFocus=document.activeElement;
  viewerList=currentPhotoList();viewerIdx=viewerList.indexOf(id);
  if(viewerIdx<0){viewerList=[id];viewerIdx=0;}
  showViewerAt(viewerIdx);
  $('#viewer').classList.add('on');document.body.classList.add('noscroll');
  $('#ph-close').focus();
}
function closeViewer(){
  $('#viewer').classList.remove('on');
  document.body.classList.remove('noscroll');
  if(viewerFocus&&viewerFocus.isConnected)viewerFocus.focus();
}
$('#viewer-prev').onclick=()=>showViewerAt(viewerIdx-1);
$('#viewer-next').onclick=()=>showViewerAt(viewerIdx+1);
$('#viewer').onclick=e=>{if(e.target.id==='viewer')closeViewer();};
$('#ph-close').onclick=closeViewer;
$('#ph-tag').onclick=async()=>{
  if(!viewerKey)return;
  const id=viewerKey;
  const pid=await pickPlant('Which plant is this photo of?');
  if(pid===null)return;
  const r=await apiWrite('PATCH','/api/photos/'+id+'?plant='+encodeURIComponent(pid));
  if(r&&r.ok){const p=PHOTOS.find(x=>x.id===id);if(p)p.plant=pid;applyPhotos();fillSheet();}
};
$('#ph-del').onclick=()=>{
  const id=viewerKey;
  closeViewer();
  hold('Photo deleted',async()=>{
    const r=await apiWrite('DELETE','/api/photos/'+id);
    if(r&&(r.ok||r.status===204)){
      PHOTOS=PHOTOS.filter(x=>x.id!==id);
      if(id===coverId)setCover('');
      applyPhotos();fillSheet();
    }
  },()=>{_hidden.delete(id);applyPhotos();fillSheet();});
  _hidden.add(id);applyPhotos();fillSheet();
};

/* ---- plant picker (a promise, so callers just await it) ---- */
let _pickResolve=null,_pickFocus=null;
function pickPlant(title){
  _pickFocus=document.activeElement;
  $('#pk-title').textContent=title||'Which plant?';
  $('#pk-grid').innerHTML=plants().map(p=>
    `<button data-pick="${esc(p.id)}"><span class="av">${avatarFor(p.id)}</span>${esc(p.name)}</button>`).join('')
    +`<button class="gen" data-pick=""><span class="av">🪴</span>All plants</button>`;
  $('#picker').classList.add('open');
  setTimeout(()=>$('#pk-grid button')?.focus(),40);
  return new Promise(res=>{_pickResolve=res;});
}
function closePicker(v){
  $('#picker').classList.remove('open');
  const r=_pickResolve;_pickResolve=null;
  if(_pickFocus&&_pickFocus.isConnected)_pickFocus.focus();
  if(r)r(v);
}
$('#pk-grid').addEventListener('click',e=>{
  const b=e.target.closest('[data-pick]');if(!b)return;
  closePicker(b.dataset.pick);
});
$('#pk-cancel').onclick=()=>closePicker(null);
$('#picker').addEventListener('click',e=>{if(e.target.id==='picker')closePicker(null);});

let coverId='';
async function loadCover(){
  try{const r=await fetch('/api/cover');if(r.ok)coverId=(await r.json()).id||'';}catch(e){}
}
function openCover(){
  const imgs=PHOTOS.slice().sort((a,b)=>(b.created||0)-(a.created||0));
  $('#cp-grid').innerHTML=
    `<button class="cp-new" id="cp-new">📷<span>Add</span></button>`+
    `<button class="cp-def${coverId?'':' sel'}" data-cover=""><span class="cp-green"></span><span>Green</span></button>`+
    imgs.map(x=>`<button class="cp-photo${x.id===coverId?' sel':''}" data-cover="${esc(x.id)}" aria-label="${esc(shortDate(x.date))}"><img src="${photoURL(x.id)}" alt="" loading="lazy" decoding="async"></button>`).join('');
  $('#coverpick').classList.add('open');
  $('#cp-new').onclick=()=>{fileMode='cover';$('#ph-input').click();};
}
function closeCover(){$('#coverpick').classList.remove('open');}
async function setCover(id){
  const r=await apiWrite('PUT','/api/cover?id='+encodeURIComponent(id||''));
  if(r&&r.ok){coverId=id;}
  closeCover();
}
$('#cp-grid').addEventListener('click',e=>{
  const b=e.target.closest('[data-cover]');if(b)setCover(b.dataset.cover);
});
$('#cp-cancel').onclick=closeCover;
$('#coverpick').addEventListener('click',e=>{if(e.target.id==='coverpick')closeCover();});

function deleteEntry(id){
  hold('Entry deleted',async()=>{
    const r=await apiWrite('DELETE','/api/entries/'+encodeURIComponent(id));
    if(r&&(r.ok||r.status===204)){await loadEntries();await loadStatus();renderAll();fillSheet();}
  },()=>{_hidden.delete(id);renderAll();fillSheet();});
  _hidden.add(id);renderAll();fillSheet();
}
function deleteNote(pid,noteId){
  hold('Entry deleted',async()=>{
    const r=await apiWrite('POST','/api/notes',JSON.stringify({plantId:pid,op:'delete',id:noteId}),'application/json');
    if(r&&r.ok){await loadStatus();renderAll();fillSheet();}
  },()=>{_hidden.delete(noteId);renderAll();fillSheet();});
  _hidden.add(noteId);renderAll();fillSheet();
}
function focusEdit(){const t=$('#etext');if(t){t.focus();t.setSelectionRange(t.value.length,t.value.length);}}
async function saveEdit(kind,id,plantId){
  const text=($('#etext')?.value||'').trim();
  if(!text){editing=null;fillSheet();return;}
  const r=kind==='note'
    ? await apiWrite('POST','/api/notes',JSON.stringify({plantId,op:'edit',id,text}),'application/json')
    : await apiWrite('PATCH','/api/entries/'+encodeURIComponent(id),JSON.stringify({text}),'application/json');
  if(!r||!r.ok){toast('Could not save. Try again.');return;}
  editing=null;
  await Promise.all([loadStatus(),loadEntries()]);
  refreshUI();
  if(kind==='entry')refreshSoon();          // the reworded entry is sorted again
}
/* Re-sorting is just the entry sent back unchanged: the server re-runs the distiller. */
async function retryEntry(id){
  const e=entriesDoc.entries.find(x=>x.id===id);if(!e)return;
  const r=await apiWrite('PATCH','/api/entries/'+encodeURIComponent(id),
    JSON.stringify({text:e.text}),'application/json');
  if(!r||!r.ok){toast('Could not save. Try again.');return;}
  await loadEntries();refreshUI();refreshSoon();
}
async function assignEntry(id,plantIds,el){
  if(el){el.disabled=true;el.textContent='Filing…';}
  setBusy('Filing your note…');
  const r=await apiWrite('PATCH','/api/entries/'+encodeURIComponent(id),JSON.stringify({plantIds}),'application/json');
  if(!r||!r.ok){setBusy('');if(el){el.disabled=false;}toast('Could not save. Try again.');return;}
  await Promise.all([loadEntries(),loadStatus()]);
  refreshUI();
  refreshSoon();          // the plan rebuilds behind this; keep watching until it lands
}

/* ================= toasts + undo hold ================= */
const _hidden=new Set();     // ids removed from view while their undo window runs
function toast(msg,undoLabel,onUndo){
  const el=document.createElement('div');
  el.className='toast';
  el.innerHTML=`<span>${esc(msg)}</span>`;
  if(onUndo){
    const b=document.createElement('button');b.textContent=undoLabel;b.onclick=()=>{onUndo();el.remove();};
    el.appendChild(b);
  }
  $('#toasts').appendChild(el);
  setTimeout(()=>el.remove(),onUndo?5200:3200);
  return el;
}
/* Destructive acts wait 5s before they actually fire, so one mis-tap costs nothing. */
function hold(msg,commit,undo){
  let cancelled=false;
  const el=toast(msg,'Undo',()=>{cancelled=true;undo();});
  setTimeout(()=>{if(!cancelled){el.remove();commit();}},5000);
}

/* ================= auth ================= */
let _unlockResolve=null;
function askPass(){
  return new Promise(res=>{
    _unlockResolve=res;
    $('#unlock').classList.add('open');
    $('#unlock-input').value='';
    setTimeout(()=>$('#unlock-input').focus(),40);
  });
}
function closeUnlock(v){
  $('#unlock').classList.remove('open');
  const r=_unlockResolve;_unlockResolve=null;
  if(r)r(v);
}
$('#unlock-go').onclick=()=>closeUnlock($('#unlock-input').value.trim()||null);
$('#unlock-cancel').onclick=()=>closeUnlock(null);
$('#unlock-input').addEventListener('keydown',e=>{if(e.key==='Enter')closeUnlock($('#unlock-input').value.trim()||null);});
$('#unlock').addEventListener('click',e=>{if(e.target.id==='unlock')closeUnlock(null);});

async function apiWrite(method,path,body,ct){
  let pass=store.get('uploadPass');
  if(!pass){pass=await askPass();if(!pass)return null;store.set('uploadPass',pass);syncLock();}
  const r=await fetch(path,{method,headers:{'authorization':'Bearer '+pass,...(ct?{'content-type':ct}:{})},body});
  if(r.status===401){store.set('uploadPass',null);syncLock();toast('Wrong passphrase. Try again.');return null;}
  return r;
}
async function api(path,opts={}){          // silent: used where a visitor must not be prompted
  const pass=store.get('uploadPass');
  if(!pass)return null;
  const r=await fetch(path,{...opts,headers:{...(opts.headers||{}),authorization:'Bearer '+pass}});
  if(r.status===401){store.set('uploadPass',null);syncLock();}
  return r;
}
function syncLock(){
  const b=$('#lockbtn');if(!b)return;
  const on=!!store.get('uploadPass');
  b.hidden=!on;b.textContent='🔓 Lock';
}

/* ---- the chart ---- */
/* One window for the whole chart, recomputed each render so every bar and the
   scale above them share the same axis. */
let WIN={start:todayISO(),end:todayISO()};
const upcomingFor=id=>((careDoc&&careDoc.plants&&careDoc.plants[id])||{}).upcoming||[];
function refreshWindow(){
  const list=plants();
  WIN=chartWindow({
    spans:list.map(p=>(SEASON.find(r=>r.key===KEY_BY_ID[p.id])||{}).ph||[]),
    histories:list.map(p=>(statusDoc.plants[p.id]||{}).history||[]),
    upcomings:list.map(p=>upcomingFor(p.id)),
    today:todayISO(),monthsAhead:3});
}
/* Position on the shared axis, 0 to 100. */
const wpos=d=>{
  const a=Date.parse(WIN.start+'T00:00:00Z'),b=Date.parse(WIN.end+'T00:00:00Z');
  if(!(b>a))return 0;
  return Math.max(0,Math.min(100,(Date.parse(d+'T00:00:00Z')-a)/(b-a)*100));
};

const PHASE_LABEL={grow:'Growing',flower:'Flowering',fruit:'Green fruit',harvest:'Harvest'};
const niceDate=d=>{const x=new Date(d+'T00:00:00Z');
  return `${x.getUTCDate()} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][x.getUTCMonth()]}`;};

/* The legend sits once at the top of the section, not under every chart. */
function legendHTML(){
  return `<div class="legend">${Object.entries(PHASE_LABEL).map(([k,l])=>
    `<span><i class="sw ${k}"></i>${l}</span>`).join('')}
    <span class="sep"></span><span><i class="sw future"></i>Expected</span></div>`;
}

function monthScaleHTML(){
  return `<div class="monthscale">${monthTicks(WIN.start,WIN.end).map(t=>
    `<b style="left:${wpos(t.date)}%">${t.label}</b>`).join('')}</div>`;
}

/* Everything up to today is what happened, everything after it is expectation,
   so each span is drawn twice when it straddles today: solid, then faded. */
function seasonBarHTML(p){
  const row=SEASON.find(r=>r.key===KEY_BY_ID[p.id]);
  const spans=seasonSpans(row?row.ph:[],(statusDoc.plants[p.id]||{}).history||[],
    upcomingFor(p.id),WIN.end);
  const T=todayISO(),t=wpos(T);
  const piece=(c,f,to,future)=>{
    const l=wpos(f),w=wpos(to)-l;
    if(w<=0)return '';
    return `<i class="bar ${c}${future?' future':''}" style="left:${l}%;width:${Math.max(w,1.2)}%"
      title="${esc(PHASE_LABEL[c]||c)}, ${esc(niceDate(f))} to ${esc(niceDate(to))}${future?' (expected)':''}"></i>`;
  };
  return `<span class="track">${spans.map(([c,f,to])=>{
      if(to<=T)return piece(c,f,to,false);
      if(f>=T)return piece(c,f,to,true);
      return piece(c,f,T,false)+piece(c,T,to,true);
    }).join('')}
    ${t>=0&&t<=100?`<i class="tline" style="left:${t}%" title="Today"></i>`:''}</span>`;
}

/* Notes and photos, one record, newest first.
   An entry the distiller could not place belongs to no plant, so it is carried
   on the all-plants stream under "Unsorted" rather than disappearing. */
function historyHTML(list,allPlants){
  const ids=list.map(p=>p.id);
  const notes=list.flatMap(p=>shown(p.notes).map(n=>({...n,plantId:p.id})));
  const loose=allPlants?shown(entriesDoc.entries)
    .filter(e=>!(e.assigned||[]).length)
    .map(e=>({id:e.id,date:e.date,text:e.text,plantId:null,entry:true,pending:e.status==='pending'})):[];
  const stream=historyStream([...notes,...loose],photosInView(shown(PHOTOS),ids,allPlants));
  const nameOf=id=>id?((list.find(p=>p.id===id)||{}).name||'Unsorted'):'Unsorted';
  const noteHTML=n=>editing&&editing.kind===(n.entry?'entry':'note')&&editing.id===n.id
    ? editBoxHTML(n.entry?'entry':'note',n.id,n.plantId,n.text)
    : `<p class="prose">${esc(n.text)}${n.ai?' ✨':''}${n.pending?' <em class="dimmed">reading...</em>':''}</p>
       <div class="entry-acts">
         <button class="lnk" data-act="${n.entry?'entry-edit':'note-edit'}" data-val="${esc(n.id)}"
           data-plant="${esc(n.plantId||'')}">Edit</button>
         <button class="lnk" data-act="${n.entry?'entry-del':'note-del'}"
           data-val="${esc(n.entry?n.id:n.plantId)}" data-note="${esc(n.id)}">Delete</button>
         ${n.entry?`<button class="lnk" data-act="assign-pick" data-val="${esc(n.id)}">Assign to a plant</button>`:''}
       </div>`;
  return `<div class="sub"><span>History</span><span class="n">${stream.length}</span></div>
    ${stream.length?stream.map(e=>`<div class="hrow">
      <div class="data">${dayLabel(e.date)} · ${esc(nameOf(e.plantId))}</div>
      ${e.notes.map(noteHTML).join('')}
      ${e.photoIds.length?`<div class="shots">${e.photoIds.map(id=>
        `<button data-act="view" data-val="${esc(id)}"><img src="${photoURL(id)}" alt="" loading="lazy"></button>`
      ).join('')}</div>`:''}
    </div>`).join('')
    :'<div class="none">Nothing recorded yet.</div>'}`;
}

/* ---- the lock ---- */
function renderLock(){
  const el=$('#lock');
  if(!busy){el.className='';el.innerHTML='';document.body.classList.remove('locked');return;}
  const secs=Math.round((Date.now()-busyAt)/1000);
  const e=shown(entriesDoc.entries).slice().sort((a,b)=>(a.createdAt||0)-(b.createdAt||0)).at(-1)||{text:''};
  const who=(e.assigned||[]).map(a=>plantById(a.plantId)).filter(Boolean);
  el.className='on';document.body.classList.add('locked');
  el.innerHTML=`<div class="waiting">
    <p class="said">${esc(e.text)}</p>
    <div class="steps"><i><b style="width:${busy==='read'?Math.min(95,secs*9):100}%"></b></i>
      <i><b style="width:${busy==='plan'?Math.min(95,(secs-10)*5):0}%"></b></i></div>
    <div class="stage">${busy==='read'?'1/2 · Reading your note':'2/2 · Writing the guidance'}</div>
    <div class="eta">${secs} s · the rest of the page is waiting</div>
    ${who.length?`<div class="found">${who.map(p=>{
      const note=(p.notes||[]).find(n=>(e.assigned||[]).some(a=>a.noteId===n.id));
      return `<div class="read"><span class="art">${avatarFor(p.id)}</span>
        <span><b>${esc(p.name)}</b><span>${esc(note?note.text:'')}</span></span></div>`;}).join('')}</div>`:''}
    ${secs>45?'<button class="out" data-act="escape">Let me back in</button>':''}
  </div>`;
}

/* ---- put the page together ---- */
function renderAll(){
  refreshWindow();
  const a=document.activeElement,keep=a&&a.dataset&&a.dataset.ta?a.selectionStart:null;
  $('#page').innerHTML=
    `<header class="mast">
      <h1>Dara's Balcony Garden</h1>
      <span class="where">Tampere, glazed balcony</span>
      <span class="fresh">${careDoc&&careDoc.generatedAt?'Guidance updated '+relTime(careDoc.generatedAt):'No guidance yet'}</span>
     </header>
     ${navBar()}
     ${dockHTML()}
     ${V.plant?plantHTML(plantById(V.plant)||plants()[0]):allPlantsHTML()}
     <footer class="foot">
       <label class="theme-switch">
         <span class="tl" data-for="light">Light</span>
         <input type="checkbox" id="theme-toggle" role="switch" aria-label="Light or dark theme">
         <span class="track2" aria-hidden="true"><span class="knob"></span></span>
         <span class="tl" data-for="dark">Dark</span>
       </label>
       <button id="lockbtn" hidden></button>
       <button class="lnk" data-act="cover">Cover photo</button>
     </footer>`;
  wireFooter();
  renderLock();
  if(keep!=null){const t=$('#ctext');if(t){t.focus();t.setSelectionRange(keep,keep);}}
}
const fillSheet=()=>{};       /* the plant is a page now, not a sheet */
function wireFooter(){
  syncThemeBtn();syncLock();
  const t=$('#theme-toggle');
  if(t)t.onchange=e=>{
    const next=e.target.checked?'dark':'light';
    document.documentElement.dataset.theme=next;store.set('theme',next);
    const tc=document.querySelector('meta[name=theme-color]');
    if(tc)tc.setAttribute('content',next==='dark'?'#0F140F':'#1E4D3B');
    syncThemeBtn();
  };
  const l=$('#lockbtn');
  if(l)l.onclick=()=>{store.set('uploadPass',null);syncLock();toast('Locked. You can read, but not change anything.');};
}


/* ================= the note ================= */
/* One composer, at the top of the page. A note carries the plant the nav has
   selected, so the distiller is told the subject instead of guessing it. */
const staged={top:[],watered:false};
let draft='';
let lastEntryId=null;
function clearDraft(){staged.top.forEach(s=>URL.revokeObjectURL(s.url));staged.top=[];staged.watered=false;draft='';}
async function saveEntry(){
  const text=draft.trim();
  if(!text&&!staged.top.length)return;
  const date=todayISO(),plantId=V.plant||null;
  const btn=document.querySelector('[data-act="save"]');if(btn)btn.disabled=true;
  /* The watering is written BEFORE the entry. Posting the entry kicks off a
     re-plan that reads status:garden and writes it back, so a watering saved
     after the post is read stale and overwritten. */
  if(staged.watered&&plantId){
    const rw=await apiWrite('PUT','/api/status/'+encodeURIComponent(plantId),
      JSON.stringify({lastWatered:date}),'application/json');
    if(!rw||!rw.ok){toast('Could not save. Try again.');if(btn)btn.disabled=false;return;}
    await loadStatus();
  }
  const photoIds=[];
  for(const s of staged.top){
    const rec=await uploadOne(s.blob,date,s.plantId||plantId||'');
    if(!rec){if(btn)btn.disabled=false;return;}
    photoIds.push(rec.id);
  }
  const r=await apiWrite('POST','/api/entries',
    JSON.stringify({date,text,photoIds,...(plantId?{plantId}:{})}),'application/json');
  if(!r||!r.ok){toast('Could not save. Try again.');if(btn)btn.disabled=false;return;}
  const entry=await r.json();
  entriesDoc={...entriesDoc,entries:[...entriesDoc.entries,entry]};
  store.set('entriesDoc',entriesDoc);
  lastEntryId=entry.id;
  clearDraft();renderAll();refreshSoon();
}

/* ================= actions ================= */
let fileMode=null;
const ACTIONS={
  plant:pid=>{V.plant=pid;staged.watered=false;renderAll();window.scrollTo({top:0,behavior:'smooth'});},
  all:()=>{V.plant=null;staged.watered=false;renderAll();},
  month:v=>{view.m+=+v;
    if(view.m<0){view.m=11;view.y--;} if(view.m>11){view.m=0;view.y++;}
    renderAll();},
  fold:()=>{V.dockMin=!V.dockMin;renderAll();if(!V.dockMin)setTimeout(()=>$('#ctext')?.focus(),30);},
  save:()=>saveEntry(),
  attach:()=>{$('#ph-input').click();},
  unstage:i=>{URL.revokeObjectURL(staged.top[i].url);staged.top.splice(i,1);renderAll();},
  filter:v=>{V.feedFilter=v;renderAll();},
  view:id=>viewPhoto(id),
  water:async id=>{
    const r=await apiWrite('PUT','/api/status/'+encodeURIComponent(id),
      JSON.stringify({lastWatered:todayISO()}),'application/json');
    if(!r||!r.ok){toast('Could not save. Try again.');return;}
    await loadStatus();renderAll();
  },
  'watered-chk':(_,el)=>{staged.watered=el.checked;},
  'entry-del':id=>deleteEntry(id),
  'entry-edit':id=>{editing={kind:'entry',id};renderAll();focusEdit();},
  'note-del':(pid,el)=>deleteNote(pid,el.dataset.note),
  'note-edit':(id,el)=>{editing={kind:'note',id,plantId:el.dataset.plant};renderAll();focusEdit();},
  'edit-cancel':()=>{editing=null;renderAll();},
  'edit-save':(id,el)=>saveEdit(el.dataset.kind,id,el.dataset.plant),
  assign:(id,el)=>assignEntry(id,[el.dataset.plant],el),
  'assign-pick':async id=>{const pid=await pickPlant('Which plant is this note about?');if(pid)assignEntry(id,[pid]);},
  'entry-retry':id=>retryEntry(id),
  cover:()=>openCover(),
  escape:()=>{setBusy('');renderAll();},
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(busy&&el.dataset.act!=='escape')return;      /* the lock answers, nothing else */
  const fn=ACTIONS[el.dataset.act];if(!fn)return;
  /* A checkbox needs its own default: preventDefault would revert the tick
     after the handler runs. Everything else is a button or a link. */
  if(el.type!=='checkbox')e.preventDefault();
  fn(el.dataset.val,el,e);
});
document.addEventListener('input',e=>{
  if(!e.target.dataset.ta)return;
  draft=e.target.value;
  const b=document.querySelector('[data-act="save"]');
  if(b){b.disabled=!draft.trim()&&!staged.top.length;b.classList.toggle('on',!!draft.trim());}
  const d=document.querySelector('.dock');if(d)d.classList.toggle('tall',!!draft.trim());
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($('#unlock').classList.contains('open'))closeUnlock(null);
    else if($('#coverpick').classList.contains('open'))closeCover();
    else if($('#picker').classList.contains('open'))closePicker(null);
    else if($('#viewer').classList.contains('on'))closeViewer();
    else if(!busy&&V.plant){V.plant=null;renderAll();}
    return;
  }
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&!busy)saveEntry();
  if($('#viewer').classList.contains('on')){
    if(e.key==='ArrowLeft')showViewerAt(viewerIdx-1);
    else if(e.key==='ArrowRight')showViewerAt(viewerIdx+1);
  }
});
$('#ph-input').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';
  if(!files.length)return;
  if(fileMode==='cover'){
    fileMode=null;closeCover();
    const blob=await shrink(files[0]);
    const rec=await uploadOne(blob,todayISO(),'');
    if(rec){applyPhotos();await setCover(rec.id);}
    return;
  }
  for(const f of files){
    const blob=await shrink(f);
    staged.top.push({blob,url:URL.createObjectURL(blob),plantId:V.plant||''});
  }
  renderAll();
};

/* ================= go ================= */
renderAll();
if(!forecast||forecast.fetched!==todayISO())loadWx();
loadStatus().then(async()=>{await seedStatus();renderAll();});
loadPlan().then(renderAll);
loadEntries().then(renderAll);
loadPhotos();loadCover();
addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  Promise.all([loadEntries(),loadStatus()]).then(refreshUI);
});
setInterval(()=>{if(busy)renderLock();},1000);

</script>
</body>
