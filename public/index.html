<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dara's Balcony Garden, Tampere</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231E4D3B'/%3E%3Cpath d='M32 52V30' stroke='%23EAF0E9' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M32 36c-11 0-17-6-17-15 10 0 17 6 17 15z' fill='%237FBFA0'/%3E%3Cpath d='M32 32c0-10 6-17 16-17 0 10-6 17-16 17z' fill='%23EAF0E9'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231E4D3B'/%3E%3Cpath d='M32 52V30' stroke='%23EAF0E9' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M32 36c-11 0-17-6-17-15 10 0 17 6 17 15z' fill='%237FBFA0'/%3E%3Cpath d='M32 32c0-10 6-17 16-17 0 10-6 17-16 17z' fill='%23EAF0E9'/%3E%3C/svg%3E">
<meta name="theme-color" content="#1E4D3B">
<!-- Two faces from Google Fonts in one request. Young Serif is the display
     face for titles and highlights, single weight, 400 only. Shantell Sans is
     the hand the journal entries are set in, also 400 only. Preconnect so the
     woff2 is not stuck behind a cold DNS and TLS handshake after the
     stylesheet lands. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400&family=Young+Serif&display=swap">
<script>try{var _t=JSON.parse(localStorage.getItem('theme')||'null');if(_t)document.documentElement.dataset.theme=_t;}catch(e){}</script>
<style>
  /* ============================================================
     Daran parvekepuutarha, the chart direction.

     Soft, rounded, and organised by colour rather than by rules. Every plant
     owns the background colour of its own illustration, and that colour washes
     the whole row, chip and tile that belong to it, so the page is legible as a
     garden before it is read as an interface. Nothing shouts in capitals.

     UI       Avenir Next  , the site's own voice
     Prose    Charter      , what the model writes, in something you read
     Display  Young Serif  , titles and the one number worth looking at
     Hand     Shantell Sans, the journal, because those words are mine
     ============================================================ */
  :root{
    --paper:#EFF2EA; --field:#FFFFFF; --ink:#17211B; --dim:#6C7A70; --rule:#E1E7DA;
    --pine:#1E4D3B; --leaf:#3E7D5C; --tomato:#C4462C; --water:#2F6E8F; --pollen:#B0810F;
    --ph-grow:#9BC7AA; --ph-flower:#DDA0B4; --ph-fruit:#E79A4E; --ph-harvest:#CC5438;
    --ui:"Avenir Next","Avenir","Segoe UI",system-ui,sans-serif;
    --prose:"Charter","Iowan Old Style","Georgia",serif;
    --display:"Young Serif","Charter","Iowan Old Style","Georgia",serif;
    --hand:"Shantell Sans","Avenir Next",system-ui,sans-serif;
    /* One ladder for every size on the site. 1.125, a major second, stepped
       off a 16px reading base and rounded to whole pixels, because half
       pixels were how 15.5 and 14.5 and 13.5 got here in the first place.
       Two rungs rounded onto 13 and 14, which are the same size to a reader,
       so the lower one is pulled down to 12 and the ladder stays countable.
       t1 eyebrows and ticks, t2 meta and captions, t3 the UI default,
       t4 reading prose, t5 sub-heads, t6 area heads, t7 section titles and
       the one number worth looking at, t8 the masthead. Nothing off it. */
    --t1:11px; --t2:12px; --t3:14px; --t4:16px;
    --t5:18px; --t6:20px; --t7:23px; --t8:29px;
    --s1:4px; --s2:8px; --s3:12px; --s4:18px; --s5:28px; --s6:44px;
    --r-lg:20px; --r-md:14px; --r-sm:10px; --r-pill:999px;
    --tint:#9BC7AA;
    --wash:color-mix(in srgb,var(--tint) 16%,var(--field));
    --shadow:0 2px 10px rgba(22,40,28,.05);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0F140F; --field:#19201A; --ink:#E7EEE4; --dim:#8B9A8C; --rule:#27302A;
      --pine:#8FCBA9; --leaf:#7FBFA0; --tomato:#EF7355; --water:#7BB9DB; --pollen:#DDB059;
      --shadow:0 2px 12px rgba(0,0,0,.3);
      --wash:color-mix(in srgb,var(--tint) 20%,var(--field));
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F140F; --field:#19201A; --ink:#E7EEE4; --dim:#8B9A8C; --rule:#27302A;
    --pine:#8FCBA9; --leaf:#7FBFA0; --tomato:#EF7355; --water:#7BB9DB; --pollen:#DDB059;
    --shadow:0 2px 12px rgba(0,0,0,.3);
    --wash:color-mix(in srgb,var(--tint) 20%,var(--field));
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font:var(--t3)/1.5 var(--ui);-webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
  .vhid{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}

  #root{container-type:inline-size;position:relative;margin:0 auto;background:var(--paper)}
  #root.phone{max-width:392px;box-shadow:0 0 0 1px var(--rule)}
  .page{max-width:1120px;margin:0 auto;padding:var(--s5) var(--s6) var(--s6)}
  @container (max-width:899px){ .page{padding:var(--s4) var(--s4) var(--s5)} }
  @container (max-width:560px){ .page{padding:var(--s3) var(--s3) var(--s4)} }

  /* ---- masthead ---- */
  .mast{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s4)}
  /* The display face at its own size. Young Serif is single weight, so 400 is
     stated to stop a faux bold, the sans tracking is zeroed because it was cut
     for a different face, and the leading closes to the 1.11 of the specimen. */
  .mast h1{font-family:var(--display);font-size:clamp(var(--t7),3vw,var(--t8));
    font-weight:400;line-height:1.12;letter-spacing:0}
  /* The title and the sentence under it are one block, so the freshness note
     still sits at the far end of the row rather than under the paragraph. */
  .mast .mtitle{flex:1 1 32ch;min-width:0}
  .mast .blurb{margin:var(--s2) 0 0;max-width:58ch;font-size:var(--t3);
    line-height:1.5;color:var(--dim)}
  .mast .fresh{margin-left:auto;font-size:var(--t2);color:var(--dim)}

  /* ---- a section is a card ---- */
  .sect{background:var(--field);border:1px solid var(--rule);border-radius:var(--r-lg);
    padding:var(--s4) var(--s4) var(--s5);margin-bottom:var(--s6);box-shadow:var(--shadow)}
  .sect:last-child{margin-bottom:0}
  .sect > .hd{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;
    padding-bottom:var(--s3);margin-bottom:var(--s4);border-bottom:2px solid var(--ink)}
  /* Same face one step down. A point smaller than the sans it replaces, since
     the large x-height already reads bigger at the same nominal size. */
  .sect > .hd h2{font-family:var(--display);font-size:var(--t7);
    font-weight:400;line-height:1.18;letter-spacing:0}
  .sect > .hd .meta{margin-left:auto;font-size:var(--t2);color:var(--dim)}
  .sect > .hd .meta b{font-weight:600;color:var(--tomato)}
  /* the plant list: one row per plant, health in words, season bar, guidance */
  /* One column for the names, so every bar starts and ends at the same x and
     the month scale above them lines up with all of them. */
  .sect{--namecol:300px}
  .prow{padding:var(--s2) 0;border-bottom:1px solid var(--rule)}
  .phead{display:grid;grid-template-columns:var(--namecol) 1fr;align-items:center;gap:var(--s2)}
  .pname{display:flex;align-items:baseline;flex-wrap:wrap;gap:var(--s1) var(--s2);background:none;
    border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;min-width:0}
  /* The drawing identifies the plant, it does not rank it, so it is sized to
     sit beside the name rather than to outweigh it. */
  .pname .art{align-self:center;width:26px;height:26px;flex:none;overflow:hidden;
    border-radius:var(--r-pill)}
  .pname .art svg{width:100%;height:100%;display:block}
  /* The plant name is the card's title, and now the heaviest thing in it. The
     b was carrying a browser bold the single-weight face cannot serve, so
     weight is pinned to 400. */
  .pname b{font-family:var(--display);font-size:var(--t5);font-weight:400;
    line-height:1.25;letter-spacing:0}
  .pname em{font-style:normal;color:var(--dim);font-size:var(--t2)}
  .water{color:var(--dim)}
  .wline>span{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
  .waterbtn{display:inline-flex;align-items:center;gap:var(--s1);border:1px solid var(--rule);
    background:var(--paper);border-radius:var(--r-pill);padding:var(--s1) var(--s3);cursor:pointer;
    font:inherit;font-size:var(--t2);color:var(--ink)}
  .waterbtn:hover,.waterbtn:focus-visible{border-color:var(--water);color:var(--water)}
  .photobtn{display:inline-flex;align-items:center;gap:var(--s2);border:1px solid var(--rule);
    background:var(--paper);border-radius:var(--r-pill);padding:var(--s2) var(--s4);cursor:pointer;
    font:inherit;font-size:var(--t3);color:var(--ink)}
  .photobtn:hover,.photobtn:focus-visible{border-color:var(--leaf);color:var(--pine)}
  /* Two paragraphs that read differently: what it is doing, then what to do.
     The label sits above its text rather than in a column beside it, so both
     paragraphs start at the same x AND wrap at the same measure, and neither
     one can look indented next to the other. */
  .status,.guide,.wline{display:grid;grid-template-columns:1fr;gap:var(--s1);
    margin:0;font-size:var(--t3);line-height:1.5}
  .wline{margin-top:var(--s3)}
  /* .32em, not a spacing step: it is what drops a 11px eyebrow onto the same
     baseline as the sentence beside it when the two do share a line. */
  .lbl{font-size:var(--t1);letter-spacing:.09em;text-transform:uppercase;font-weight:600;
    color:var(--dim);padding-top:0}
  .status,.guide,.wline{grid-template-rows:auto auto}
  .status{color:var(--dim)}
  .status>span{color:var(--ink)}
  .guide{color:var(--ink)}
  .legend{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
    margin:0 0 var(--s3);padding:0 var(--s4);font-size:var(--t2);color:var(--dim)}
  .legend span{display:flex;align-items:center;gap:var(--s1)}
  .legend .sep{width:1px;height:var(--s3);background:var(--rule);padding:0}
  .sw{width:14px;height:6px;border-radius:3px;display:inline-block}
  .sw.grow{background:var(--ph-grow)} .sw.flower{background:var(--ph-flower)}
  .sw.fruit{background:var(--ph-fruit)} .sw.harvest{background:var(--ph-harvest)}
  .sw.future{background:var(--dim);opacity:.4}
  .chart{min-width:0}
  .prow.solo .phead{grid-template-columns:1fr}
  /* Two plants to a row. A plant needs a name, a bar and two short paragraphs,
     so a whole page width each wastes half of it and doubles the scroll. The
     page is 1120px less its gutters, which is room for exactly two columns and
     never three, so every bar keeps the same width. In the narrower cell the
     name sits above the chart instead of beside it. */
  .plist{display:grid;gap:var(--s4);margin:0 0 var(--s6);
    grid-template-columns:repeat(auto-fill,minmax(min(430px,100%),1fr))}
  /* ---- the plant card ----
     Four bands, and the gaps do the grouping. The name and the year belong to
     each other, so s3 between them and nothing else inside that block. The
     two sentences the model wrote are a pair of their own, s4 below the year.
     The water row is the only thing here you can press, so a rule fences it
     off from everything you only read.

     Five treatments, not one: the name in the display face, the year as a
     ribbon, the status in the UI face at UI size, the care in the reading
     face one step up on a tinted band, and the water line small and quiet.
     A card you can scan rather than a card you have to read. */
  .plist .phead{grid-template-columns:1fr;gap:var(--s3)}
  /* The plant is the card now. Nothing wraps the grid any more, so the card
     takes the field colour and the lift the old section card used to have,
     and it sits straight on the paper. overflow so the care band can run to
     the card's own edge. */
  .plist .prow{display:flex;flex-direction:column;padding:var(--s4);background:var(--field);
    overflow:hidden;border:1px solid var(--rule);border-radius:var(--r-lg);box-shadow:var(--shadow)}
  .plist .status{margin-top:var(--s4)}
  /* Care is the sentence to act on. It takes the tint, the reading face and
     the full width of the card: a band of the card rather than a box wedged
     between two loose lines, which is what an inset panel looked like. */
  .plist .guide{margin:var(--s3) 0 0;padding:0 0 0 var(--s3);
    border-left:2px solid color-mix(in srgb,var(--leaf) 55%,transparent)}
  .plist .guide > span{font-family:var(--prose);font-size:var(--t3);line-height:1.55}
  .plist .guide .lbl{color:var(--pine)}
  /* The action, fenced off from the reading. auto on the top so that in a
     row of two the shorter card puts its water line on the same bottom edge
     as the taller one, instead of leaving the card empty underneath it. */
  .plist .wline{display:flex;align-items:center;gap:var(--s3);
    margin:auto calc(-1 * var(--s4)) calc(-1 * var(--s1));
    padding:var(--s3) var(--s4) 0;border-top:1px solid var(--rule);font-size:var(--t2)}
  .plist .wline .lbl{display:none}
  .plist .wline > span{flex:1}
  .plist .waterbtn{margin-left:auto}
  /* The water row's top margin is auto, which collapses to nothing once the
     card is full, so the last paragraph was landing on the rule. This is the
     floor under it, whether care or status is the one that ends the card. */
  .plist .prow > p:last-of-type{margin-bottom:var(--s4)}
  /* The area name labels the grid under it from the page itself: no box, no
     rule, nothing that would read as a second card around the plants. */
  .areahd{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;
    margin:0 0 var(--s3)}
  .areahd h2{font-family:var(--display);font-size:var(--t6);
    font-weight:400;line-height:1.2;letter-spacing:0}
  /* The count is a label, not a title, so it goes back to the UI face. */
  .areahd > span{font-family:var(--ui);font-size:var(--t3);font-weight:400;letter-spacing:0;color:var(--dim)}
  /* The reading takes the empty end of the area heading row. It wraps to its
     own line before it would squeeze the area name. */
  .wxnow{margin-left:auto;display:flex;align-items:baseline;gap:var(--s3);
    flex-wrap:wrap;font-size:var(--t3);color:var(--dim)}
  .wxnow .deg{font-family:var(--display);font-size:var(--t7);font-weight:400;
    line-height:1.1;letter-spacing:0;color:var(--ink)}
  .wxnow .deg.hot{color:var(--tomato)} .wxnow .cold{color:var(--water)}
  /* The forecast reads for the balcony only, so it stands on its own above
     the balcony plants instead of boxing them in. */
  /* Only as wide as it needs to be, so a one line warning does not draw a
     band across the page. */
  /* The warning hangs off the reading it came from: right aligned under it,
     with a tail up into it, so it reads as the forecast speaking rather than
     as a banner that turned up on its own. */
  .wxalerts{display:flex;flex-direction:column;align-items:flex-end;
    gap:var(--s2);margin:10px 0 var(--s4)}
  .wxalerts .warn{position:relative;max-width:min(100%,68ch);margin:0}
  .wxalerts .warn::before{content:'';position:absolute;top:-7px;right:var(--s5);
    border-left:9px solid transparent;border-right:9px solid transparent;
    border-bottom:7px solid var(--bub)}
  @container (max-width:640px){
    .wxnow{margin-left:0;width:100%}
    .wxalerts{align-items:stretch}
    .wxalerts .warn::before{right:auto;left:var(--s4)}
  }
  /* The legend is reference, not content: once at the top, flush with the
     cards now that no card padding is left to line it up with. */
  .lgd-row .legend{margin:0 0 var(--s3);padding:0}
  /* A tooltip that answers straight away, rather than the browser's slow one. */
  #tip{position:fixed;z-index:60;pointer-events:none;opacity:0;transition:opacity .08s;
    background:var(--ink);color:var(--paper);font-size:var(--t2);line-height:1.3;
    padding:var(--s1) var(--s2);border-radius:var(--r-sm);white-space:nowrap;
    box-shadow:0 4px 14px rgba(0,0,0,.18)}
  #tip.on{opacity:1}
  .prow .track .bar{cursor:default}
  /* The scale is the chart's label, so it is read at full strength rather
     than ghosted under it. */
  .monthscale{position:relative;height:1.05em;margin:0 0 var(--s1);font-size:var(--t1);color:var(--dim)}
  .monthscale b{position:absolute;font-weight:400;transform:translateX(-50%)}
  /* 6px read as a divider rule rather than as data. Nine is a ribbon: still
     one line of the card, but unmistakably a measured thing. The segments
     stay square and the track clips them, so the year is one continuous band
     instead of a row of separate lozenges. */
  .prow .track{position:relative;height:9px;border-radius:var(--r-pill);
    background:var(--rule);overflow:hidden}
  .prow .track .bar.future{opacity:.4}
  .sect>.prow:first-of-type{padding-top:0}
  .prow .track .bar{position:absolute;top:0;height:100%}
  .prow .track .bar.grow{background:var(--ph-grow)} .prow .track .bar.flower{background:var(--ph-flower)}
  .prow .track .bar.fruit{background:var(--ph-fruit)} .prow .track .bar.harvest{background:var(--ph-harvest)}
  /* Today overshoots the track top and bottom by 2px so it is readable
     against a pale phase as well as a dark one. */
  .prow .track .tline{position:absolute;top:-2px;width:2px;height:13px;background:var(--ink)}
  .hrow{padding:var(--s2) 0;border-bottom:1px solid var(--rule)}
  .striplabel{align-self:center;padding:0 var(--s2);font-size:var(--t2);color:var(--dim)}
  .wchk{display:flex;align-items:center;gap:var(--s2);font-size:var(--t2);color:var(--dim)}
  /* Every other breakpoint in here asks the page container, not the window,
     so these do too: the phone preview is then the same page a phone gets. */
  @container (max-width:760px){
    .sect{--namecol:1fr}
    .phead{grid-template-columns:1fr;gap:var(--s3)}
  }

  /* ---- the journal ----
     A spine down the left carries the season: each entry's dot takes the colour
     of the phase the plant was in that day, the same colours as the charts.

     The entry text is the one thing on this site I wrote myself, so it is set
     in a hand. Shantell Sans, not a script: it keeps a sans skeleton and its
     figures stay crisp, which matters because these notes carry volumes,
     times and temperatures. Only the sentence gets it. Dates, tags, month
     headings and controls stay in the UI face, or the page turns into a
     scrapbook and nothing is findable. */
  .jmonth{font-size:var(--t2);letter-spacing:.02em;color:var(--dim);
    margin:var(--s4) 0 var(--s2);padding-left:calc(var(--jrail) + var(--s3))}
  .jmonth:first-of-type{margin-top:var(--s2)}
  .jlist{--jrail:88px;list-style:none;margin:0;padding:0}
  .sect{--jrail:88px}
  .jent{position:relative;display:grid;grid-template-columns:var(--jrail) 1fr;
    gap:var(--s3);padding:0 0 var(--s4)}
  .jent::before{content:"";position:absolute;left:calc(var(--jrail) + 5px);top:.75em;bottom:0;
    width:2px;background:var(--rule)}
  /* Under the last entry the spine is a tail, not a line to nowhere, and
     with a single entry there is nothing to hang off it at all. */
  .jent:last-child::before{bottom:auto;height:var(--s5)}
  .jent:only-child::before{display:none}
  .jent::after{content:"";position:absolute;left:var(--jrail);top:calc(.75em - 5px);
    width:12px;height:12px;border-radius:50%;background:var(--dim);
    box-shadow:0 0 0 3px var(--field)}
  .jent.ph-grow::after{background:var(--ph-grow)}
  .jent.ph-flower::after{background:var(--ph-flower)}
  .jent.ph-fruit::after{background:var(--ph-fruit)}
  .jent.ph-harvest::after{background:var(--ph-harvest)}
  /* .15em, not a spacing step: it drops the date onto the first baseline of
     the entry beside it, which is a type measurement, not a gap. */
  .jdate{text-align:right;font-size:var(--t2);color:var(--dim);padding-top:.15em;white-space:nowrap}
  .jbody{padding-left:var(--s3);min-width:0}
  .jbody .prose{margin:0;max-width:60ch;font-family:var(--hand);
    font-size:var(--t4);line-height:1.7;letter-spacing:.005em}
  .aside{margin:var(--s1) 0 0;font-size:var(--t2);color:var(--dim);font-style:italic;max-width:60ch}
  .jgap{margin:var(--s3) 0 0;font-size:var(--t2);color:var(--dim)}
  .jgap::before{content:"";display:inline-block;width:18px;height:1px;
    background:var(--rule);vertical-align:middle;margin-right:var(--s2)}
  /* controls stay out of the way until you reach for them */
  .jbody .entry-acts{opacity:0;transition:opacity .12s;margin-top:var(--s1)}
  .jent:hover .entry-acts,.jbody:focus-within .entry-acts{opacity:1}
  @media (hover:none){.jbody .entry-acts{opacity:1}}
  /* a plant named in an entry, standing in for its name */
  /* A tag stands in for a plant's name mid-sentence, so it has to sit on the
     line like a word, not float above it like a button. */
  .ptag{display:inline-flex;align-items:center;gap:var(--s1);vertical-align:-.18em;
    border:1px solid var(--rule);background:var(--paper);border-radius:var(--r-pill);
    /* The pill's own padding is optical, it hugs a 15px avatar and a word,
     and its size rides the sentence it is sitting in. */
    padding:0 7px 0 2px;margin:0 1px;line-height:1.35;font:inherit;font-size:.82em;
    cursor:pointer;color:inherit;font-family:var(--ui)}
  .ptag .av{width:15px;height:15px;flex:none;overflow:hidden;border-radius:var(--r-pill)}
  .ptag .av svg{width:100%;height:100%;display:block}
  .ptag:hover,.ptag:focus-visible{border-color:var(--leaf);background:var(--field)}
  @container (max-width:560px){
    .jlist,.sect{--jrail:0px}
    .jent{grid-template-columns:1fr;gap:var(--s1)}
    .jent::before,.jent::after{display:none}
    .jdate{text-align:left}
    .jbody{padding-left:0;border-left:2px solid var(--rule);padding-left:var(--s3)}
    .jmonth{padding-left:0}
    .jbody .entry-acts{opacity:1}   /* never strand the controls on a small screen */
  }

  /* ---- the variety page: text left, pictures in a narrow column ---- */
  .wiki{display:grid;grid-template-columns:1fr 260px;gap:var(--s5)}
  .wtext .prose{max-width:62ch}
  .facts{display:grid;grid-template-columns:auto 1fr;gap:var(--s2) var(--s4);margin:var(--s4) 0 0;
    font-size:var(--t3);border-top:1px solid var(--rule);padding-top:var(--s3)}
  .facts dt{color:var(--dim)}
  .facts dd{margin:0}
  .facts dd a{color:var(--ink);text-decoration:underline;text-underline-offset:2px;
    text-decoration-color:var(--rule)}
  .facts dd a:hover{text-decoration-color:var(--leaf)}
  .wpics{display:flex;flex-direction:column;gap:var(--s3)}
  .wpics figure{margin:0}
  .wpics img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r-md);
    border:1px solid var(--rule);display:block}
  .wpics figcaption{margin-top:var(--s1);font-size:var(--t2);color:var(--dim)}
  .wpics figcaption i{font-style:normal;opacity:.65;white-space:nowrap}
  @container (max-width:760px){
    .wiki{grid-template-columns:1fr;gap:var(--s4)}
    .wpics{flex-direction:row}
    .wpics figure{flex:1 1 0;min-width:0}
  }

  /* a sub-heading inside a section: smaller, its own rule, its own air */
  .sub{display:flex;align-items:baseline;gap:var(--s2);margin:var(--s5) 0 var(--s2);font-size:var(--t5);
    font-weight:600;color:var(--ink);padding-bottom:var(--s2);border-bottom:1px solid var(--rule)}
  .sub:first-of-type{margin-top:var(--s4)}
  .sub .n{margin-left:auto;font-weight:400;font-size:var(--t2);color:var(--dim)}

  /* ---- the nav: it governs the whole page, so it sits above the whole page ---- */
  /* Every plant is reachable without scrolling sideways, so the strip wraps.
     It gives up stickiness once it is more than a couple of rows tall, rather
     than eating the screen on a phone. */
  .nav{position:sticky;top:0;z-index:15;background:var(--paper);margin:0 0 var(--s4);
    padding:var(--s2) 0;border-bottom:1px solid var(--rule)}
  @container (max-width:760px){.nav{position:static}}
  /* The 4px of padding is room for a focus ring, not a gap. */
  .strip{display:flex;flex-wrap:wrap;gap:var(--s2);padding:var(--s1)}
  .chip{display:inline-flex;align-items:center;gap:var(--s2);flex:none;border:1px solid var(--rule);
    background:var(--field);border-radius:var(--r-pill);padding:var(--s1) var(--s3) var(--s1) var(--s1);
    cursor:pointer;min-height:32px;font-size:var(--t3);white-space:nowrap}
  .chip .av{width:24px;height:24px;flex:none;overflow:hidden;border-radius:var(--r-pill)}
  .chip .av svg{width:100%;height:100%;display:block}
  .chip:hover{border-color:var(--leaf)}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
  .chip.all{padding:var(--s1) var(--s4)}

  /* ---- the chart: one soft row per plant ---- */
  .row{display:flex;align-items:center;gap:var(--s3);padding:var(--s3) var(--s1);width:100%;text-align:left;
    border-top:1px solid var(--rule)}
  .row.head,.row.axis{border-top:none;padding:var(--s1)}
  .row.axis{border-top:1px solid var(--rule);padding-top:var(--s2)}
  .row .art{width:40px;height:40px;flex:none;overflow:hidden;border-radius:var(--r-sm)}
  .row .art svg{width:100%;height:100%;display:block}
  .row .who{width:136px;flex:none;min-width:0}
  .row .who b{display:block;font-size:var(--t3);font-weight:600;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis;letter-spacing:-.01em}
  .row .who em{display:block;font-style:normal;font-size:var(--t2);color:var(--dim);margin-top:2px}
  .row .bars{flex:1 1 auto;min-width:88px}
  .row .now{flex:0 0 clamp(168px,26%,280px);min-width:0;display:flex;gap:var(--s2);align-items:flex-start}
  .row .now .mk{flex:none;font-size:var(--t3);line-height:1.35}
  .row .now .txt{min-width:0;font-size:var(--t3);line-height:1.35}
  .row .now .txt em{display:block;font-style:normal;font-size:var(--t1);color:var(--dim);margin-top:1px}
  .row .now.bad .txt{color:var(--tomato);font-weight:600}
  .row .now.watch .txt{color:var(--water)}
  @keyframes settle{0%{transform:scale(1.01)}100%{transform:none}}
  .row.touched{animation:settle .7s ease-out;background:color-mix(in srgb,var(--leaf) 10%,transparent)}

  .track{position:relative;display:block;height:10px;background:color-mix(in srgb,var(--ink) 8%,transparent);
    border-radius:var(--r-pill);overflow:hidden}
  .bar{position:absolute;top:0;height:100%}
  .bar.grow{background:var(--ph-grow)} .bar.flower{background:var(--ph-flower)}
  .bar.fruit{background:var(--ph-fruit)} .bar.harvest{background:var(--ph-harvest)}
  .scale{position:relative;display:block;height:14px;font-size:var(--t1);color:var(--dim)}
  .scale b{position:absolute;transform:translateX(-50%);font-weight:400}
  .scale b.today{color:var(--leaf);font-weight:600;transform:translateX(-4px)}
  .legend{display:flex;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s3);font-size:var(--t2);color:var(--dim)}
  .legend i{display:inline-block;width:18px;height:8px;border-radius:var(--r-pill);margin-right:var(--s2);vertical-align:0}

  /* ---- prose the model wrote ---- */
  .lede{font-family:var(--prose);font-size:var(--t7);line-height:1.35;margin:0 0 var(--s3);font-weight:400}
  .lede .mk{margin-right:var(--s2)}
  .lede.bad{color:var(--tomato)} .lede.watch{color:var(--water)}
  p.prose{font-family:var(--prose);font-size:var(--t4);line-height:1.6;margin:0 0 var(--s3);max-width:62ch}
  .quote{font-style:italic;color:var(--dim);font-size:var(--t3);line-height:1.5}
  .data{font-size:var(--t2);color:var(--dim)}

  /* ---- lists you act on ----
     The 1px and 2px nudges below are optical: they drop a small line onto the
     baseline of the bigger one beside it. They are type, not spacing. */
  .list{display:flex;flex-direction:column}
  .task{display:flex;gap:var(--s2);align-items:flex-start;padding:var(--s3) var(--s1);
    border-top:1px solid var(--rule)}
  .task:first-child{border-top:none}
  .task .mk{width:22px;flex:none;text-align:center;font-size:var(--t4)}
  .task .body{flex:1;min-width:0}
  .task .what{font-size:var(--t3);font-weight:600}
  .task .whose{font-size:var(--t2);color:var(--dim);display:block;margin-top:1px}
  .task .why{display:block;font-size:var(--t3);color:var(--dim);line-height:1.45;margin-top:var(--s1);
    font-family:var(--prose)}
  .task.done{opacity:.45}
  .task.added{background:color-mix(in srgb,var(--leaf) 9%,transparent);border-radius:var(--r-sm)}
  .task.changed{background:color-mix(in srgb,var(--pollen) 12%,transparent);border-radius:var(--r-sm)}
  .task.cut{opacity:.55}
  .task.cut .what{text-decoration:line-through;text-decoration-color:var(--tomato)}
  .flag{font-size:var(--t3);font-weight:700;width:12px;flex:none;padding-top:1px}
  .flag.add{color:var(--leaf)} .flag.chg{color:var(--pollen)} .flag.cut{color:var(--tomato)}
  .tick{border:1px solid var(--leaf);color:var(--leaf);background:var(--field);border-radius:var(--r-pill);
    font-size:var(--t2);padding:var(--s2) var(--s3);cursor:pointer;white-space:nowrap;flex:none}
  .task.done .tick{background:var(--leaf);color:var(--field);border-color:var(--leaf)}

  /* ---- weather ----
     The reading rides the area heading (see .wxnow). All that is left here is
     the alert: a line, not a card. The warning and the reason sit on the same
     line and wrap together, so a cold night costs one row instead of a block. */
  .warn{--bub:color-mix(in srgb,var(--tomato) 10%,transparent);background:var(--bub);
    border-radius:var(--r-md);padding:var(--s2) var(--s3);font-size:var(--t3);line-height:1.4}
  .warn.cold{--bub:color-mix(in srgb,var(--water) 12%,transparent)}
  .warn b{font-weight:600;color:var(--tomato)}
  .warn.cold b{color:var(--water)}
  .warn span{color:var(--dim)}
  .warn span::before{content:' '}

  /* ---- segmented control ---- */
  .segs{display:flex;gap:var(--s1);background:var(--paper);border-radius:var(--r-pill);padding:var(--s1)}
  .segs button{border:none;background:none;color:var(--dim);font-size:var(--t3);border-radius:var(--r-pill);
    padding:var(--s2) var(--s4);cursor:pointer;min-height:32px}
  .segs button[aria-selected="true"]{background:var(--field);color:var(--ink);font-weight:600;
    box-shadow:var(--shadow)}

  /* ---- month ---- */
  .navrow{display:flex;align-items:center;gap:var(--s1);margin-bottom:var(--s3)}
  .navrow button{border:1px solid var(--rule);background:var(--field);border-radius:var(--r-pill);
    min-width:34px;height:34px;cursor:pointer;font-size:var(--t4)}
  .navrow .lab{min-width:160px;text-align:center;font-size:var(--t4);font-weight:600}
  .dow{display:grid;grid-template-columns:repeat(7,1fr);font-size:var(--t1);color:var(--dim);
    text-align:center;padding-bottom:var(--s2)}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:var(--s1)}
  .cell{min-height:58px;background:var(--paper);border:1px solid transparent;border-radius:var(--r-sm);
    padding:var(--s1) var(--s2);cursor:pointer;position:relative;text-align:left}
  .cell:hover{border-color:var(--leaf)}
  .cell.out{background:none;cursor:default}
  .cell.past{opacity:.45}
  .cell.today{background:color-mix(in srgb,var(--leaf) 14%,transparent);border-color:var(--leaf)}
  .cell.hot{border-color:color-mix(in srgb,var(--tomato) 55%,transparent)}
  .cell.cold{border-color:color-mix(in srgb,var(--water) 55%,transparent)}
  .cell .d{font-size:var(--t2);font-weight:600}
  .cell .t{position:absolute;top:var(--s1);right:var(--s2);font-size:var(--t1);color:var(--dim)}
  .cell .t.warm{color:var(--tomato)}
  .dots{display:flex;flex-wrap:wrap;gap:var(--s1);margin-top:var(--s2)}
  .dot{width:6px;height:6px;border-radius:var(--r-pill);display:inline-block}
  .dot.water{background:var(--water)} .dot.pollen{background:var(--pollen)} .dot.care{background:var(--leaf)}
  .dot.note{background:var(--ink)}
  .dot.photo{background:none;box-shadow:inset 0 0 0 1.5px var(--dim)}

  /* ---- journal ---- */
  .day{display:flex;align-items:center;gap:var(--s2);margin:var(--s4) 0 var(--s2);font-size:var(--t3);
    font-weight:600;color:var(--dim)}
  .day i{flex:1;height:1px;background:var(--rule)}
  .day span:last-child{font-weight:400;font-size:var(--t2)}
  .entry{padding:var(--s3) 0;border-top:1px solid var(--rule)}
  .entry .said{font-family:var(--prose);font-size:var(--t4);line-height:1.45;margin:0 0 var(--s2)}
  .entry .read{display:flex;gap:var(--s2);align-items:flex-start;padding:var(--s2) 0 0;margin-top:var(--s2)}
  .entry .read .art{width:32px;height:32px;flex:none;border-radius:var(--r-sm);overflow:hidden;background:var(--field)}
  .entry .read .art svg{width:100%;height:100%;display:block}
  .entry .read b{font-size:var(--t3);font-weight:600;display:block}
  .entry .read span{font-size:var(--t3);line-height:1.45;font-family:var(--prose)}
  .entry.live{border-left:3px solid var(--leaf);padding-left:var(--s3)}

  /* ---- photos ---- */
  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:var(--s2)}
  .shots button{padding:0;border:none;border-radius:var(--r-md);overflow:hidden;background:var(--wash);
    cursor:pointer;aspect-ratio:1;position:relative;display:block}
  .shots svg{width:100%;height:100%;display:block}
  .shots .when{position:absolute;left:0;right:0;bottom:0;background:linear-gradient(to top,rgba(8,14,10,.62),transparent);
    color:#fff;font-size:var(--t1);padding:var(--s4) var(--s1) var(--s1);text-align:center}
  figure.ref{margin:var(--s3) 0 0}
  figure.ref img{width:100%;max-height:210px;object-fit:cover;border-radius:var(--r-md);display:block}
  figure.ref figcaption{font-size:var(--t2);color:var(--dim);margin-top:var(--s2)}

  /* ---- life ---- */
  ul.life{list-style:none;margin:0;padding:0}
  ul.life li{display:flex;gap:var(--s3);padding:var(--s2) var(--s1);border-top:1px solid var(--rule)}
  ul.life li:first-child{border-top:none}
  ul.life .when{flex:none;width:76px;font-size:var(--t2);color:var(--dim);padding-top:2px}
  ul.life .what{flex:1;min-width:0;font-size:var(--t3);line-height:1.45}

  .seasonstrip{padding:var(--s1) 0 var(--s3)}
  .seasonstrip .track{margin:var(--s1) 0}
  .note{padding:var(--s3) 0;border-top:1px solid var(--rule)}
  .note .prose{margin-bottom:var(--s2)}
  .note .prose:last-child{margin-bottom:0}
  .dimmed{color:var(--dim)}
  .lede em{display:block;font-style:normal;font-family:var(--ui);font-size:var(--t2);color:var(--dim);margin-top:var(--s1)}
  .none{color:var(--dim);font-size:var(--t3);font-family:var(--prose);font-style:italic;padding:var(--s2) 0}

  /* ---- the composer ---- */
  .dock{margin:0 0 var(--s5)}
  .dock .box{background:var(--field);border:1px solid var(--rule);border-radius:var(--r-lg);
    overflow:hidden;transition:border-color .15s ease}
  .dock:focus-within .box{border-color:var(--leaf);box-shadow:0 0 0 3px color-mix(in srgb,var(--leaf) 14%,transparent)}
  .dock .top{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);font-size:var(--t2);color:var(--dim)}
  .dock .top .tag{display:inline-flex;align-items:center;gap:var(--s2);color:var(--ink);background:var(--wash);
    border-radius:var(--r-pill);padding:var(--s1) var(--s3) var(--s1) var(--s1);max-width:52%;
    overflow:hidden;white-space:nowrap}
  .dock .top .tag svg{width:20px;height:20px;border-radius:var(--r-pill)}
  .dock .top .fold{margin-left:auto;border:none;background:none;color:var(--dim);cursor:pointer;
    font-size:var(--t1);padding:var(--s2);min-width:28px;border-radius:var(--r-pill)}
  .dock .in{padding:0 var(--s4) var(--s3)}
  .dock textarea{width:100%;min-height:52px;resize:none;font:inherit;
    font-family:var(--hand);font-size:var(--t4);line-height:1.6;color:var(--ink);
    background:none;border:none;padding:0 0 var(--s2);transition:min-height .16s ease}
  .dock textarea:focus{outline:none}
  .dock:focus-within textarea,.dock.tall textarea{min-height:104px}
  .dock .acts{display:flex;align-items:center;gap:var(--s2)}
  .dock .acts .sp{flex:1}
  .dock .acts button{border:1px solid var(--rule);background:var(--field);border-radius:var(--r-pill);
    padding:var(--s2) var(--s4);cursor:pointer;font-size:var(--t3)}
  .dock .acts .save{border-color:var(--leaf);color:var(--leaf)}
  .dock .acts .save:disabled{opacity:.35;cursor:default}
  .dock .acts .save.on{background:var(--leaf);color:#fff;border-color:var(--leaf)}
  .dock.min .in{display:none}


  /* ---- narrow: a plant line cannot hold four columns on a phone, so it stacks:
         name and drawing, then how it is doing, then its year ---- */
  /* 50px is not a gap, it is the width of the drawing plus the gap after it,
     so the stacked rows line up under the name instead of under the picture. */
  @container (max-width:760px){
    .row{flex-wrap:wrap;row-gap:var(--s2);padding:var(--s3)}
    .row .who{flex:1 1 auto;width:auto}
    .row .now{flex:1 1 100%;order:3;padding-left:50px}
    .row .bars{flex:1 1 100%;order:4;padding-left:50px}
    .row.head,.row.axis{padding-top:0;padding-bottom:0}
    .row.head .art,.row.head .who,.row.head .now,
    .row.axis .art,.row.axis .who,.row.axis .now{display:none}
    .row.head .bars,.row.axis .bars{padding-left:50px}
    .sect{padding:var(--s3)}
  }

  /* ---- the lock ---- */
  #lock{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    padding:var(--s4);background:color-mix(in srgb,var(--paper) 80%,transparent);backdrop-filter:blur(3px)}
  #lock.on{display:flex}
  .waiting{width:min(430px,100%);background:var(--field);border-radius:var(--r-lg);
    padding:var(--s4) var(--s4) var(--s3);box-shadow:0 20px 54px rgba(16,32,22,.24)}
  .waiting .said{font-family:var(--prose);font-size:var(--t5);line-height:1.45;margin:0 0 var(--s3)}
  .waiting .steps{display:flex;gap:var(--s1);margin-bottom:var(--s2)}
  .waiting .steps i{flex:1;height:5px;background:var(--paper);border-radius:var(--r-pill);
    overflow:hidden;position:relative}
  .waiting .steps i b{position:absolute;inset:0 auto 0 0;background:var(--leaf);border-radius:var(--r-pill)}
  .waiting .stage{font-size:var(--t3);font-weight:600;color:var(--leaf)}
  .waiting .eta{font-size:var(--t2);color:var(--dim);margin-top:2px}
  .waiting .found{margin-top:var(--s3);display:flex;flex-direction:column;gap:var(--s1)}
  .waiting .found .read{display:flex;gap:var(--s2);align-items:flex-start;padding:var(--s2) var(--s3);
    background:var(--wash);border-radius:var(--r-sm)}
  .waiting .found .art{width:30px;height:30px;flex:none;border-radius:var(--r-sm);overflow:hidden;background:var(--field)}
  .waiting .found .art svg{width:100%;height:100%;display:block}
  .waiting .found b{font-size:var(--t3);font-weight:600;display:block}
  .waiting .found span{font-size:var(--t3);line-height:1.4;font-family:var(--prose)}
  .waiting .out{margin-top:var(--s3);border:none;background:none;color:var(--dim);cursor:pointer;
    font-size:var(--t2);text-decoration:underline;padding:var(--s2) 0}
  body.locked{overflow:hidden}
  @media(prefers-reduced-motion:reduce){.row.touched{animation:none}}


  /* ---- pieces the live site needs on top of the prototype's system ---- */
  .chip.small{padding:var(--s2) var(--s3)}
  .chip.small .av{display:none}
  .cshots{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s2)}
  .cshot{position:relative}
  .cshot img{width:74px;height:74px;object-fit:cover;border-radius:var(--r-sm);display:block}
  .cshot .rm{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:var(--r-pill);
    border:1px solid var(--rule);background:var(--field);cursor:pointer;font-size:var(--t3);line-height:1;padding:0}
  .shots button img{width:100%;height:100%;object-fit:cover;display:block}
  .entry-acts{display:flex;gap:var(--s3);margin-top:var(--s2)}
  .lnk{border:none;background:none;color:var(--dim);cursor:pointer;font-size:var(--t2);
    text-decoration:underline;padding:var(--s1) 0}
  .lnk:hover{color:var(--leaf)}
  .chips-row{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;margin-top:var(--s2)}
  .note textarea{width:100%;min-height:74px;resize:vertical;font:inherit;
    font-family:var(--hand);font-size:var(--t4);line-height:1.6;color:var(--ink);
    background:var(--paper);border:1px solid var(--leaf);border-radius:var(--r-sm);padding:var(--s3)}
  .foot{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;padding:var(--s4) var(--s1) 0;
    border-top:1px solid var(--rule);margin-top:var(--s6)}
  .theme-switch{display:inline-flex;align-items:center;gap:var(--s3);cursor:pointer;font-size:var(--t2);color:var(--dim)}
  .theme-switch input{position:absolute;opacity:0;width:0;height:0}
  .theme-switch .track2{width:42px;height:24px;border-radius:var(--r-pill);background:var(--rule);
    position:relative;flex:none;transition:background .15s ease}
  .theme-switch .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
    background:var(--field);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s ease}
  .theme-switch input:checked + .track2{background:var(--leaf)}
  .theme-switch input:checked + .track2 .knob{transform:translateX(18px)}
  .theme-switch .tl.act{color:var(--ink)}
  #lockbtn{border:1px solid var(--rule);background:var(--field);color:var(--dim);border-radius:var(--r-pill);
    padding:var(--s2) var(--s4);font-size:var(--t2);cursor:pointer}

  /* ---- overlays kept from the live site, restyled ---- */
  #viewer{position:fixed;inset:0;background:rgba(10,14,11,.92);display:none;z-index:30;
    align-items:center;justify-content:center;flex-direction:column;gap:var(--s3);padding:var(--s4)}
  #viewer.on{display:flex}
  #viewer img{max-width:94vw;max-height:72vh;border-radius:var(--r-md)}

  /* ---- one plant, in full ----
     The list is twenty plants at a glance. This is one plant at reading size,

    background:var(--rule);overflow:hidden}

  }

  .pfull-seg.fruit{background:var(--ph-fruit)} .pfull-seg.harvest{background:var(--ph-harvest)}
  /* The name sits on a wash of the card colour so it stays readable on every
     phase, from the palest green to the darkest harvest red. */
  .pfull-seg b{position:relative;z-index:1;margin:0 var(--s2) var(--s2);padding:var(--s1) var(--s2);

  /* Two different kinds of sentence, so two different treatments. Status is

  .pfull-say{margin:var(--s5) 0 0;max-width:66ch}

  .ago{font-style:normal;font-weight:400;letter-spacing:0;text-transform:none;

  .pfull .wline{display:flex;align-items:center;gap:var(--s3);

    .pfull-stage{gap:var(--s1) var(--s2)}
    .pfull-name{min-width:0}
    .pfull-mark{padding:var(--s1) var(--s2);letter-spacing:.05em}
    .pfull .status,.pfull .guide{padding:0 0 0 var(--s3)}
  }
</style>

<script type="module">
import { weatherAlerts, normalizeHealth } from '/care-rules.js';
import { groupByArea, waterLabel, seasonSpans, phaseOfStage, chartWindow, monthTicks, tagEntryText, journalGroups } from '/garden-view.js';

/* ================= basics ================= */
const $=s=>document.querySelector(s);
const store={get:k=>JSON.parse(localStorage.getItem(k)||'null'),set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const TAMPERE={la:61.4981,lo:23.7610};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayISO=()=>iso(new Date());
const addDays=(s,n)=>{const d=new Date(s);d.setDate(d.getDate()+n);return iso(d);};
const dBetween=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const WEEKDAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shortDate=s=>{const d=new Date(s);return d.getDate()+'.'+(d.getMonth()+1)+'.';};

/* ================= care knowledge ================= */
const CARE={
 basil:{care:{
   growing:{water:2,why:'Pot dries fast behind glass',
     weekly:[['care','Pinch the tips','Above a leaf pair, bushy, no flowers.'],
             ['care','Feed','Liquid feed, every 2nd week is enough.']]},
   harvesting:{water:2,why:'Keep harvest coming',
     weekly:[['care','Harvest from the top','Pinch any flower buds while you are there.']]}}},
 mint:{care:{
   growing:{water:2,why:'Thirsty, likes the soil damp',
     weekly:[['care','Trim it back','Keeps it leafy and stops it sprawling.']]},
   harvesting:{water:2,why:'Keep moist while you keep cutting',

 chilli:{care:{
   seedling:{water:3,why:'Light water only, damping-off kills sprouts',
     weekly:[['care','Rotate pots','Stops leggy lean toward the glass. Pot up at 4-6 true leaves.']]},
   vegetative:{water:2,why:'Steady moisture while bulking up',
     weekly:[['care','Feed','Half-strength liquid feed weekly.']]},
   flowering:{water:2,why:'Even water so flowers hold',
     daily:[['pollen','Tap the flowers','Midday, no bees behind glass.']],
     weekly:[['care','Feed high-K','Tomato feed works.']]},
   fruiting:{water:1,why:'Dry spells make fruit drop',
     weekly:[['care','Feed','High-K weekly while fruiting.']]}}},
 tomato:{care:{
   seedling:{water:2,why:'Even moisture',weekly:[]},
   vegetative:{water:2,why:'Big leaves, big thirst',
     weekly:[['care','Side shoots + ties','Snap armpit shoots, tie main stem higher.']]},
   flowering:{water:1,why:'Uneven water now = blossom end rot later',
     daily:[['pollen','Shake the flower trusses','Midday. No bees, no wind behind glass, no shake, no fruit. Vent hard: pollen sterile over ~32°C.']],
     weekly:[['care','Feed high-K','Weekly from first flowers.'],
             ['care','Side shoots + ties','Keep the 1 m stem supported.']]},
   fruiting:{water:1,why:'Never bone-dry, fruit splits',
     weekly:[['care','Feed high-K','Weekly.'],
             ['care','Tidy lower leaves','Below lowest truss, airflow against mildew.']]}}},
 parsley:{care:{
   growing:{water:3,why:'Even moisture; bolts in heat, shade on 30°C days',weekly:[]},
   harvesting:{water:3,why:'Outer stems only',
     weekly:[['care','Harvest outer stems','Cut at the base, centre keeps producing.']]}}},
 monstera:{care:{
   settling:{water:7,why:'Newly bought, let top 3-4 cm dry first; no feed or repot yet',
     weekly:[['care','Check the spot','Bright indirect light, away from draughts/radiators. Wipe dust off leaves.']]},
   established:{water:7,why:'Top 3-4 cm dry before watering',
     weekly:[['care','Feed','Balanced feed monthly in season; give the aerial roots something to climb.']]}}},
 hedera:{care:{
   settling:{water:5,why:'Steady (not heavy) water while roots establish; top 2-3 cm dry first',
     weekly:[['care','Check the leaves','Happy in the shady corner. Watch under leaves, spider mites love dry glazed air.']]},
   established:{water:6,why:'Let surface dry between waterings',
     weekly:[['care','Trim','Cut wandering vines to shape, regrows from any node. Hardy to −10°C.']]}}},
 raspberry:{care:{
   settling:{water:2,why:'New pot behind glass dries fast, keep evenly moist, top 2-3 cm dry, never waterlogged',
     weekly:[['care','Tie in the canes','Loosely tie new canes to a support so wind and glass heat do not snap them.'],
             ['care','Feed','Half-strength liquid feed weekly while establishing. Watch leaf undersides for spider mites.']]},
   fruiting:{water:1,why:'Even water while berries swell, dry spells shrink fruit',
     daily:[['pollen','Tap the flowers','Midday, few bees behind glass. Berries drop free when dead-ripe.']],
     weekly:[['care','Pick the berries','Every 2-3 days, ripe ones spoil fast. High-K feed weekly.']]},
   dormant:{water:7,why:'Barely water over winter, hardy, stays out on the balcony',
     weekly:[['care','Cut the fruited canes','After fruiting, cut spent (2nd-year) canes to the ground; keep this year\'s new canes.']]}}}
};

/* ================= server docs ================= */

/* ================= server docs ================= */
let statusDoc=store.get('statusDoc')||{updatedAt:0,plants:{}};
let careDoc=store.get('careDoc')||null;
let entriesDoc=store.get('entriesDoc')||{updatedAt:0,entries:[]};

async function loadStatus(){
  try{const r=await fetch('/api/status',{cache:'no-store'});
    if(r.ok){statusDoc=await r.json();store.set('statusDoc',statusDoc);}}catch(e){}
}
async function loadPlan(){
  try{const r=await fetch('/api/care',{cache:'no-store'});
    if(r.ok){const d=await r.json();careDoc=(d&&d.plants)?d:null;store.set('careDoc',careDoc);}}catch(e){}
}
async function loadEntries(){
  try{const r=await fetch('/api/entries',{cache:'no-store'});
    if(r.ok){entriesDoc=await r.json();store.set('entriesDoc',entriesDoc);}}catch(e){}
}
function relTime(ms){if(!ms)return'';
  const s=Math.round((Date.now()-ms)/1000);
  if(s<90)return'just now';if(s<3600)return Math.round(s/60)+' min ago';
  if(s<86400)return Math.round(s/3600)+' h ago';return Math.round(s/86400)+' d ago';}

/* The distiller takes a few seconds; poll until the entry stops being pending.
   Redraw the open sheet too, that is where the entry the user just wrote is shown. */
const typing=()=>{const a=document.activeElement;
  return !!a&&(a.tagName==='TEXTAREA'||a.tagName==='INPUT');};
function flashPlant(pid){touched.add(pid);setTimeout(()=>{touched.delete(pid);renderAll();},2600);}
function refreshUI(){renderAll();}
let _poll=null,busy='';
/* Saving kicks off two model calls back to back: the distiller sorts the note,
   then the planner rebuilds the schedule. Watch for BOTH, or the task list stops
   refreshing seconds before the new plan actually arrives. */
function refreshSoon(){
  clearTimeout(_poll);
  const planBefore=careDoc&&careDoc.generatedAt;
  let n=0;
  setBusy('read');
  const tick=async()=>{
    const wasPending=entriesDoc.entries.filter(e=>e.status==='pending').map(e=>e.id);
    await Promise.all([loadStatus(),loadPlan(),loadEntries()]);
    refreshUI();
    const landed=entriesDoc.entries.filter(e=>wasPending.includes(e.id)&&e.status==='sorted');
    landed.forEach(e=>(e.assigned||[]).forEach(a=>flashPlant(a.plantId)));

    const pending=entriesDoc.entries.some(e=>e.status==='pending');
    const planFresh=(careDoc&&careDoc.generatedAt)!==planBefore;
    const stuck=entriesDoc.entries.some(e=>wasPending.includes(e.id)&&e.status==='unsorted');
    if((!pending&&planFresh)||stuck||++n>=20){setBusy('');renderAll();return;}   // ~60s ceiling
    setBusy(pending?'read':'plan');
    _poll=setTimeout(tick,3000);
  };
  _poll=setTimeout(tick,2500);
}
/* One state for the whole page while the two model calls run: everything on
   screen is about to be replaced, so nothing may be touched until it is. */
function setBusy(label){
  busy=label;
  if(label&&!busyAt)busyAt=Date.now();
  if(!label)busyAt=0;
  renderLock();
}
/* Give the server a record for any plant it has never seen. Place is not sent:
   the Worker reads garden-data.js itself, so it is right without a browser. */
async function seedStatus(){
  const seed=window.GARDEN_SEED;if(!seed)return;
  if(store.get('statusSeedVersion')===seed.version)return;
  if(!store.get('uploadPass'))return;                       // visitors never write
  for(const sp of seed.plants){
    await api('/api/status/'+encodeURIComponent(sp.id)+'?seed=1',{
      method:'PUT',headers:{'content-type':'application/json'},
      body:JSON.stringify({name:sp.name,species:sp.species,
        ...(statusDoc.plants[sp.id]?.stage?{}:{stage:sp.stage,lastWatered:sp.water||todayISO()})}),
    });
  }
  store.set('statusSeedVersion',seed.version);
  await loadStatus();
}

/* ================= weather ================= */
let forecast=store.get('forecastT3');
async function loadWx(){
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${TAMPERE.la}&longitude=${TAMPERE.lo}`+
      `&current=temperature_2m,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,relative_humidity_2m_mean`+
      `&forecast_days=14&timezone=auto`;

  });
}

function shrink(file){return new Promise(res=>{
  const img=new Image();img.onload=()=>{
    const s=Math.min(1,1000/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');cv.width=img.width*s;cv.height=img.height*s;
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(b=>res(b||file),'image/jpeg',.82);};
  img.src=URL.createObjectURL(file);});}

/* ================= toasts + undo hold ================= */
const _hidden=new Set();     // ids removed from view while their undo window runs
function toast(msg,undoLabel,onUndo){
  const el=document.createElement('div');
  el.className='toast';
  el.innerHTML=`<span>${esc(msg)}</span>`;
  if(onUndo){
    const b=document.createElement('button');b.textContent=undoLabel;b.onclick=()=>{onUndo();el.remove();};
    el.appendChild(b);
  }
  $('#toasts').appendChild(el);
  setTimeout(()=>el.remove(),onUndo?5200:3200);
  return el;
}
/* Destructive acts wait 5s before they actually fire, so one mis-tap costs nothing. */
function hold(msg,commit,undo){
  let cancelled=false;
  const el=toast(msg,'Undo',()=>{cancelled=true;undo();});
  setTimeout(()=>{if(!cancelled){el.remove();commit();}},5000);
}

async function apiWrite(method,path,body,ct){
  let pass=store.get('uploadPass');
  if(!pass){pass=await askPass();if(!pass)return null;store.set('uploadPass',pass);syncLock();}
  const r=await fetch(path,{method,headers:{'authorization':'Bearer '+pass,...(ct?{'content-type':ct}:{})},body});
  if(r.status===401){store.set('uploadPass',null);syncLock();toast('Wrong passphrase. Try again.');return null;}
  return r;
}
async function api(path,opts={}){          // silent: used where a visitor must not be prompted
  const pass=store.get('uploadPass');
  if(!pass)return null;
  const r=await fetch(path,{...opts,headers:{...(opts.headers||{}),authorization:'Bearer '+pass}});
  if(r.status===401){store.set('uploadPass',null);syncLock();}
  return r;
}
function syncLock(){
  const b=$('#lockbtn');if(!b)return;
  const on=!!store.get('uploadPass');

}

/* ---- the chart ---- */
/* One window for the whole chart, recomputed each render so every bar and the
   scale above them share the same axis. */
let WIN={start:todayISO(),end:todayISO()};
const upcomingFor=id=>((careDoc&&careDoc.plants&&careDoc.plants[id])||{}).upcoming||[];
function refreshWindow(){
  const list=plants();
  WIN=chartWindow({
    spans:list.map(p=>seasonSpans((SEASON.find(r=>r.key===KEY_BY_ID[p.id])||{}).ph||[],
      (statusDoc.plants[p.id]||{}).history||[],upcomingFor(p.id),null,
      {stage:p.stage,date:todayISO()})),
    histories:list.map(p=>(statusDoc.plants[p.id]||{}).history||[]),
    upcomings:list.map(p=>upcomingFor(p.id)),
    today:todayISO(),monthsAhead:3});
}
/* Position on the shared axis, 0 to 100. */
const wpos=d=>{
  const a=Date.parse(WIN.start+'T00:00:00Z'),b=Date.parse(WIN.end+'T00:00:00Z');
  if(!(b>a))return 0;
  return Math.max(0,Math.min(100,(Date.parse(d+'T00:00:00Z')-a)/(b-a)*100));
};

const PHASE_LABEL={grow:'Growing',flower:'Flowering',fruit:'Green fruit',harvest:'Harvest'};
/* What a narrow segment says instead, so a short phase is still named. */
const PHASE_SHORT={grow:'Grow',flower:'Flower',fruit:'Fruit',harvest:'Crop'};
const niceDate=d=>{const x=new Date(d+'T00:00:00Z');
  return `${x.getUTCDate()} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][x.getUTCMonth()]}`;};

/* The legend sits once at the top of the section, not under every chart. */
function legendHTML(){

}

function monthScaleHTML(){
  return `<div class="monthscale">${monthTicks(WIN.start,WIN.end).map(t=>
    `<b style="left:${wpos(t.date)}%">${t.label}</b>`).join('')}</div>`;
}

/* Everything up to today is what happened, everything after it is expectation,
   so each span is drawn twice when it straddles today: solid, then faded. */
function seasonBarHTML(p){
  const row=SEASON.find(r=>r.key===KEY_BY_ID[p.id]);
  const spans=seasonSpans(row?row.ph:[],(statusDoc.plants[p.id]||{}).history||[],
    upcomingFor(p.id),WIN.end,{stage:p.stage,date:todayISO()});
  const T=todayISO(),t=wpos(T);
  const piece=(c,f,to,future)=>{
    const l=wpos(f),w=wpos(to)-l;
    if(w<=0)return '';
    const tip=`${PHASE_LABEL[c]||c}, ${niceDate(f)} to ${niceDate(to)}${future?' (expected)':''}`;
    return `<i class="bar ${c}${future?' future':''}" style="left:${l}%;width:${Math.max(w,1.2)}%"
      data-tip="${esc(tip)}" title="${esc(tip)}"></i>`;
  };
  return `<span class="track">${spans.map(([c,f,to])=>{
      if(to<=T)return piece(c,f,to,false);
      if(f>=T)return piece(c,f,to,true);
      return piece(c,f,T,false)+piece(c,T,to,true);
    }).join('')}
    ${t>=0&&t<=100?`<i class="tline" style="left:${t}%" title="Today"></i>`:''}</span>`;
}

/* The journal. On the garden page it is what was actually written, once per
   entry, with every plant the distiller recognised turned into a tag. On a
   plant page it is that plant's own record. Either way it hangs off a spine
   tinted with the phase the plant was in, so the season reads down the page. */
function phaseAt(pid,date){
  const row=SEASON.find(r=>r.key===KEY_BY_ID[pid]);
  const st=statusDoc.plants[pid]||{};
  const spans=seasonSpans(row?row.ph:[],st.history||[],upcomingFor(pid),WIN.end,
    {stage:st.stage,date:todayISO()});
  const hit=spans.find(([,f,t])=>date>=f&&date<=t);
  return hit?hit[0]:'';
}

function shotsHTML(ids){

/* A plant's journal: what the model filed under it, and its photos. */
function plantJournalHTML(p){
  const notes=shown(p.notes).map(n=>({
    kind:'note',id:n.id,plantId:p.id,date:n.date,raw:n.text,html:esc(n.text),
    aside:n.quote?`from your note: “${n.quote}”`:'',

/* The page works out the plant's season once and hands the same spans to the
   chart and to the dated list under it, so the two can never disagree. Same
   call, same arguments, as the small bar on the list page. */
function pfullSpans(p){
  const row=SEASON.find(r=>r.key===KEY_BY_ID[p.id]);
  return seasonSpans(row?row.ph:[],(statusDoc.plants[p.id]||{}).history||[],
    upcomingFor(p.id),WIN.end,{stage:p.stage,date:todayISO()});
}

/* Which phases actually happened. A stage change I wrote down dates its phase,
   and the stage the plant carries today is a recorded fact as well, since a
   plant that never changed stage has no history at all. Everything else on the
   chart is a guess: the variety table's, or tonight's guidance. */
function pfullRecordedPhases(p){
  const T=todayISO(),done=new Set();
  for(const h of (statusDoc.plants[p.id]||{}).history||[]){
    const ph=phaseOfStage(h.stage);
    if(ph&&h.date&&h.date<=T)done.add(ph);
  }
  const now=phaseOfStage(p.stage);
  if(now)done.add(now);
  return done;
}

/* Dates read as they do everywhere else, with the year added only when it is
   not this one, because a bar can run over new year. */
const pfullDate=d=>niceDate(d)+(d.slice(0,4)===todayISO().slice(0,4)?'':' '+d.slice(0,4));

/* The list bar is 6px because twenty of them share a page. There is one here,
   so it gets the height to carry its own phase names, and the part of a phase
   that has not happened yet is hatched as well as faded: colour on its own
   never says "expected". */
const readAgo=()=>careDoc&&careDoc.generatedAt
  ? `<i class="ago">read ${esc(relTime(careDoc.generatedAt))}</i>` : '';

function pfullChartHTML(spans){
  const T=todayISO(),t=wpos(T);
  const seg=([c,f,to])=>{
    const l=wpos(f),w=wpos(to)-l;
    if(w<=0)return '';
    const fl=f>=T?0:(wpos(T)-l)/w*100;
    const tip=`${PHASE_LABEL[c]||c}, ${pfullDate(f)} to ${pfullDate(to)}`;
    return `<i class="pfull-seg ${c}" style="left:${l}%;width:${w}%"
      data-tip="${esc(tip)}" title="${esc(tip)}">${to>T?
      `<i class="pfull-fut" style="left:${fl}%;width:${100-fl}%"></i>`:''}${w>=3?
      `<b data-s="${esc(PHASE_SHORT[c]||c)}">${esc(PHASE_LABEL[c]||c)}</b>`:''}</i>`;
  };
  const on=t>=0&&t<=100;
  return `<div class="pfull-chart">${monthScaleHTML()}
    <div class="pfull-track">${spans.map(seg).join('')}${on?
      `<i class="pfull-today" style="left:${t}%"></i>`:''}</div>
    <div class="pfull-axis">${on?
      `<b class="pfull-todaylbl" style="left:${Math.min(Math.max(t,4),96)}%">Today</b>`:''}</div></div>`;
}

/* The same phases again, this time with their dates spelled out and each one
   said to be recorded or expected, because a hatch is not a sentence. */
function pfullStagesHTML(p,spans){
  if(!spans.length)return '<p class="pfull-none">No season worked out for this one yet.</p>';
  const T=todayISO(),done=pfullRecordedPhases(p);
  /* One phase is now, never two. Where one span ends the day the next begins,
     the plant's own stage settles which of them today belongs to. */
  const nowPh=phaseOfStage(p.stage);
  let at=spans.findIndex(([c,f,to])=>f<=T&&to>=T&&c===nowPh);
  if(at<0)at=spans.findIndex(([,f,to])=>f<=T&&to>=T);
  return `<ol class="pfull-stages">${spans.map(([c,f,to],i)=>{
    const rec=f<=T&&done.has(c);
    return `<li class="pfull-stage">
      <i class="sw ${c}"></i>
      <span class="pfull-name">${esc(PHASE_LABEL[c]||c)}</span>
      ${i===at?'<em class="pfull-nowtag">now</em>':''}
      <span class="pfull-when">${esc(pfullDate(f))} to ${esc(pfullDate(to))}</span>
      <em class="pfull-mark ${rec?'recorded':'expected'}">${rec?'Recorded':'Expected'}</em>
    </li>`;}).join('')}</ol>`;
}

      const note=(p.notes||[]).find(n=>(e.assigned||[]).some(a=>a.noteId===n.id));

/* ================= the note ================= */
/* One composer, at the top of the page. A note carries the plant the nav has
   selected, so the distiller is told the subject instead of guessing it. */
const staged={top:[],watered:false};
let draft='';
let lastEntryId=null;
function clearDraft(){staged.top.forEach(s=>URL.revokeObjectURL(s.url));staged.top=[];staged.watered=false;draft='';}
async function saveEntry(){
  const text=draft.trim();
  if(!text&&!staged.top.length)return;
  const date=todayISO(),plantId=V.plant||null;
  const btn=document.querySelector('[data-act="save"]');if(btn)btn.disabled=true;
  /* The watering is written BEFORE the entry. Posting the entry kicks off a
     re-plan that reads status:garden and writes it back, so a watering saved
     after the post is read stale and overwritten. */
  if(staged.watered&&plantId){
    const rw=await apiWrite('PUT','/api/status/'+encodeURIComponent(plantId),
      JSON.stringify({lastWatered:date}),'application/json');
    if(!rw||!rw.ok){toast('Could not save. Try again.');if(btn)btn.disabled=false;return;}
    await loadStatus();
  }
  const photoIds=[];
  for(const s of staged.top){
    const rec=await uploadOne(s.blob,date,s.plantId||plantId||'');
    if(!rec){if(btn)btn.disabled=false;return;}
    photoIds.push(rec.id);
  }
  const r=await apiWrite('POST','/api/entries',
    JSON.stringify({date,text,photoIds,...(plantId?{plantId}:{})}),'application/json');
  if(!r||!r.ok){toast('Could not save. Try again.');if(btn)btn.disabled=false;return;}
  const entry=await r.json();
  entriesDoc={...entriesDoc,entries:[...entriesDoc.entries,entry]};
  store.set('entriesDoc',entriesDoc);
  lastEntryId=entry.id;
  clearDraft();renderAll();refreshSoon();
}

  plant:pid=>{goTo(pid,true);window.scrollTo({top:0,behavior:'smooth'});},

  month:v=>{view.m+=+v;
    if(view.m<0){view.m=11;view.y--;} if(view.m>11){view.m=0;view.y++;}

  fold:()=>{V.dockMin=!V.dockMin;renderAll();if(!V.dockMin)setTimeout(()=>$('#ctext')?.focus(),30);},
  save:()=>saveEntry(),
  attach:()=>{$('#ph-input').click();},
  unstage:i=>{URL.revokeObjectURL(staged.top[i].url);staged.top.splice(i,1);renderAll();},
  filter:v=>{V.feedFilter=v;renderAll();},
  view:id=>viewPhoto(id),
  water:async id=>{

      JSON.stringify({lastWatered:todayISO()}),'application/json');

  assign:(id,el)=>assignEntry(id,[el.dataset.plant],el),
  'assign-pick':async id=>{const pid=await pickPlant('Which plant is this note about?');if(pid)assignEntry(id,[pid]);},
  'entry-retry':id=>retryEntry(id),
  cover:()=>openCover(),
  escape:()=>{setBusy('');renderAll();},

/* One tooltip element follows the pointer over any bar that carries a tip. */
const tipEl=()=>document.getElementById('tip');
document.addEventListener('pointerover',e=>{
  const b=e.target.closest('[data-tip]');const el=tipEl();if(!el)return;
  if(!b){el.classList.remove('on');return;}
  el.textContent=b.dataset.tip;el.classList.add('on');
  placeTip(e.clientX,e.clientY);
});
document.addEventListener('pointermove',e=>{
  const el=tipEl();if(el&&el.classList.contains('on'))placeTip(e.clientX,e.clientY);
});
document.addEventListener('pointerout',e=>{
  if(e.target.closest('[data-tip]'))tipEl()?.classList.remove('on');
});
function placeTip(x,y){
  const el=tipEl();if(!el)return;
  const w=el.offsetWidth,h=el.offsetHeight;
  el.style.left=Math.max(6,Math.min(x+14,innerWidth-w-6))+'px';
  el.style.top=Math.max(6,y-h-12)+'px';
}
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(busy&&el.dataset.act!=='escape')return;      /* the lock answers, nothing else */
  const fn=ACTIONS[el.dataset.act];if(!fn)return;
  /* A checkbox needs its own default: preventDefault would revert the tick
     after the handler runs. Everything else is a button or a link. */
  if(el.type!=='checkbox')e.preventDefault();
  fn(el.dataset.val,el,e);
});
document.addEventListener('input',e=>{
  if(!e.target.dataset.ta)return;
  draft=e.target.value;
  const b=document.querySelector('[data-act="save"]');
  if(b){b.disabled=!draft.trim()&&!staged.top.length;b.classList.toggle('on',!!draft.trim());}
  const d=document.querySelector('.dock');if(d)d.classList.toggle('tall',!!draft.trim());
});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'){
    if($('#unlock').classList.contains('open'))closeUnlock(null);
    else if($('#coverpick').classList.contains('open'))closeCover();
    else if($('#picker').classList.contains('open'))closePicker(null);
    else if($('#viewer').classList.contains('on'))closeViewer();
    else if(!busy&&V.plant){goTo(null,true);}
    return;
  }
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&!busy)saveEntry();
  if($('#viewer').classList.contains('on')){
    if(e.key==='ArrowLeft')showViewerAt(viewerIdx-1);
    else if(e.key==='ArrowRight')showViewerAt(viewerIdx+1);
  }
});
$('#ph-input').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';
  if(!files.length)return;
  if(fileMode==='cover'){
    fileMode=null;closeCover();
    const blob=await shrink(files[0]);
    const rec=await uploadOne(blob,todayISO(),'');
    if(rec){applyPhotos();await setCover(rec.id);}
    return;
  }
  for(const f of files){
    const blob=await shrink(f);
    staged.top.push({blob,url:URL.createObjectURL(blob),plantId:V.plant||''});
  }
  renderAll();
};

/* ================= go ================= */
V.plant=plantFromPath();
renderAll();
if(!forecast||forecast.fetched!==todayISO())loadWx();
loadStatus().then(async()=>{
  await seedStatus();
  if(V.plant&&!plantById(V.plant)){V.plant=null;history.replaceState({},'','/');}
  syncTitle();renderAll();
});
loadPlan().then(renderAll);
loadEntries().then(renderAll);
loadPhotos();loadCover();
addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  Promise.all([loadEntries(),loadStatus()]).then(refreshUI);
});
setInterval(()=>{if(busy)renderLock();},1000);

</script>
</body>
</html>
