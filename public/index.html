function shrink(file){return new Promise(res=>{
  const img=new Image();img.onload=()=>{
    const s=Math.min(1,1000/Math.max(img.width,img.height));
    const cv=document.createElement('canvas');cv.width=img.width*s;cv.height=img.height*s;
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    cv.toBlob(b=>res(b||file),'image/jpeg',.82);};
  img.src=URL.createObjectURL(file);});}

/* ---- viewer ---- */
let viewerList=[],viewerIdx=-1,viewerKey=null,viewerFocus=null;
function currentPhotoList(){
  const have=new Set(PHOTOS.map(p=>p.id));
  /* The card and the stack repeat a photo the journal also shows, so each id counts once. */
  return [...new Set([...document.querySelectorAll('#page [data-act="view"]')].map(i=>i.dataset.val))].filter(id=>have.has(id));
}
function showViewerAt(i){
  if(i<0||i>=viewerList.length)return;
  const dir=viewerIdx<0||!viewerOn()?0:Math.sign(i-viewerIdx);
  viewerIdx=i;viewerKey=viewerList[i];
  if(!calm.matches)$('#viewer-img').animate([{opacity:0,transform:`translateX(${dir*28}px) scale(${dir?1:.97})`},
    {opacity:1,transform:'none'}],{duration:dir?260:220,easing:'cubic-bezier(.2,.8,.2,1)'});
  const rec=PHOTOS.find(p=>p.id===viewerKey);
  $('#viewer-img').src=photoURL(viewerKey);
  const p=rec&&rec.plant?plantById(rec.plant):null;
  const when=rec&&rec.date?niceDate(rec.date)+' '+rec.date.slice(0,4):'';
  const pos=viewerList.length>1?`${i+1} of ${viewerList.length}`:'';
  $('#viewer-cap').innerHTML=rec?`<b>${esc(p?p.name:'Whole garden')}</b>${
    when||pos?`<span>${esc([when,pos].filter(Boolean).join(' · '))}</span>`:''}`:'';
  /* Already on top of the grid, the back arrow is the way to it. */
  $('#viewer-back').hidden=!p||!!galPlant;
  $('#viewer-prev').disabled=i<=0;
  $('#viewer-next').disabled=i>=viewerList.length-1;
}
/* The photo views are a stack over the plant page: all photos, then one
   photo. Each layer is a history entry, so the back button and the phone's
   back swipe step down it one layer at a time, the same as the ← in the bar.
   history.state holds {ov:'gal'|'photo', gal:plantId, depth}; the screen is
   always redrawn from it, never the other way round. */
let ovDepth=0;
const viewerOn=()=>$('#viewer').classList.contains('on');
function pushLayer(st){ovDepth++;history.pushState({...(history.state||{}),...st,depth:ovDepth},'',location.href);}
const stepBack=()=>history.back();
function syncLayers(st){
  st=st||{};ovDepth=st.depth||0;
  if(st.gal){if(galPlant!==st.gal)showGallery(st.gal);}else if(galPlant)hideGallery();
  if(st.ov!=='photo'&&viewerOn())hideViewer();
  /* Forward into a photo that is no longer open has nothing to show. */
  if(st.ov==='photo'&&!viewerOn())history.back();
}
addEventListener('popstate',e=>syncLayers(e.state));
/* A reload lands with the layers shut, so the entry it lands on must say so. */
if(history.state&&(history.state.ov||history.state.gal)){
  const {ov,gal,depth,...rest}=history.state;history.replaceState(rest,'',location.href);
}

/* list: the photos the arrows walk. Without one, whatever the page shows. */
function viewPhoto(id,list){
  viewerFocus=document.activeElement;
  viewerList=list||currentPhotoList();viewerIdx=viewerList.indexOf(id);
  if(viewerIdx<0){viewerList=[id];viewerIdx=0;}
  showViewerAt(viewerIdx);
  $('#viewer').classList.add('on');document.body.classList.add('noscroll');
  pushLayer({ov:'photo'});
  $('#ph-close').focus();
}
function hideViewer(){
  const key=viewerKey;
  $('#viewer').classList.remove('on');
  if(!galPlant)document.body.classList.remove('noscroll');
  const inGal=galPlant&&document.querySelector(`#gallery [data-val="${CSS.escape(key||'')}"]`);
  const f=inGal||viewerFocus;if(f&&f.isConnected)f.focus();
}
const closeViewer=stepBack;
/* One layer down, to the photos of this plant. Opened from the journal there
   is no such layer under it yet, so this one turns into it. */
function viewerBack(){
  const rec=PHOTOS.find(p=>p.id===viewerKey);
  if(galPlant||!rec||!rec.plant){stepBack();return;}
  history.replaceState({...(history.state||{}),ov:'gal',gal:rec.plant},'',location.href);
  hideViewer();showGallery(rec.plant);
}

let galPlant=null,galFocus=null;

  const p=plantById(galPlant);if(!p){hideGallery();return;}
  const list=plantPhotos(shown(PHOTOS),p.id);
  $('#gal-art').innerHTML=avatarFor(p.id);
  $('#gal-title').textContent=p.name;
  $('#gal-n').textContent=count(list.length,'photo');
  $('#gal-body').innerHTML=list.length?journalGroups(list).map(g=>`<div class="gal-month">${esc(g.label)}</div>
    <div class="gal-grid">${g.entries.map(x=>snapHTML(x,p.name,'','gview',x.id)).join('')}</div>`).join('')
    :'<div class="none">No photos of this plant yet.</div>';
}
function showGallery(pid){
  if(!galPlant)galFocus=document.activeElement;
  galPlant=pid;renderGallery();
  document.querySelectorAll('#gallery .gal-grid .snap').forEach((b,i)=>b.style.setProperty('--i',Math.min(i,14)));
  $('#gallery').classList.add('on');$('.gal-in').scrollTop=0;
  document.body.classList.add('noscroll');
  $('#gal-close').focus();
}
function openGallery(pid){showGallery(pid);pushLayer({ov:'gal',gal:pid});}
function hideGallery(){
  galPlant=null;$('#gallery').classList.remove('on');

}

/* ================= toasts + undo hold ================= */
const _hidden=new Set();     // ids removed from view while their undo window runs
function toast(msg,undoLabel,onUndo){
  const el=document.createElement('div');
  el.className='toast';
  el.innerHTML=`<span>${esc(msg)}</span>`;
  if(onUndo){
    const b=document.createElement('button');b.textContent=undoLabel;b.onclick=()=>{onUndo();el.remove();};
    el.appendChild(b);
  }
  $('#toasts').appendChild(el);
  setTimeout(()=>el.remove(),onUndo?5200:3200);
  return el;
}
/* Destructive acts wait 5s before they actually fire, so one mis-tap costs nothing. */
function hold(msg,commit,undo){
  let cancelled=false;
  const el=toast(msg,'Undo',()=>{cancelled=true;undo();});
  setTimeout(()=>{if(!cancelled){el.remove();commit();}},5000);
}

/* ---- the note ---- */
/* A plant is tagged by writing @ and its name, and the tags in the words are
   the whole truth: on a plant page its own tag is written in for you when the
   box opens, so it can be seen and taken out like any other. Only a note of
   photos alone, with no words to carry a tag, falls back to the page's plant. */
const mentionLabels=()=>plants().map(p=>({id:p.id,label:shortName(p.name)}));
const noteMentions=text=>findMentions(text,mentionLabels());
const noteTags=()=>{
  const named=noteMentions(draft).map(m=>m.plantId).filter(id=>plantById(id));
  if(named.length)return [...new Set(named)];
  return V.plant&&!noteWords(draft)&&plantById(V.plant)?[V.plant]:[];
};
/* The words of a note with its tags taken out: a box holding only tags has
   nothing to say yet. */
const noteWords=text=>mentionSegments(text||'',mentionLabels()).filter(sg=>!sg.plantId).map(sg=>sg.text).join('').trim();
const selfTag=()=>V.plant&&plantById(V.plant)?'@'+shortName(plantById(V.plant).name)+' ':'';
/* A text box cannot colour part of its own text, so the tags are drawn on a
   copy of it underneath: same font, same wrapping, words invisible, only the
   chip behind each @name showing through. The box stays a real text box. */
const mbackHTML=text=>mentionSegments(text,mentionLabels()).map(sg=>sg.plantId
  ?`<mark class="mtag">${esc(sg.text)}</mark>`:esc(sg.text)).join('')+'\u200b';
function syncMback(t){

/* The @ list. It is drawn straight into the dock rather than through
   renderAll, which would rebuild the page under the caret on every key. */
let mq=null;          // {start,q,list,idx} while an @name is being typed
function updateMention(t){
  const hit=mentionQuery(t.value,t.selectionStart);
  const pop=$('#mpop');if(!pop)return;
  const q=hit&&hit.q.toLowerCase();
  /* A name matches from the start of any of its words, short names first. */
  const rank=p=>{const l=shortName(p.name).toLowerCase();
    return l.startsWith(q)||l.replace(/\s+/g,'').startsWith(q)?0
      :p.name.toLowerCase().split(/\s+/).some(w=>w.startsWith(q))?1:-1;};
  const list=hit?plants().map(p=>[rank(p),p]).filter(([r])=>r>=0)
    .sort((a,b)=>a[0]-b[0]).map(([,p])=>p).slice(0,8):[];
  if(!list.length){mq=null;pop.hidden=true;t.removeAttribute('aria-activedescendant');return;}
  const keep=mq&&mq.list[mq.idx]&&list.findIndex(p=>p.id===mq.list[mq.idx].id);
  mq={...hit,list,idx:keep>0?keep:0};
  pop.innerHTML=list.map((p,i)=>`<button type="button" role="option" id="mo-${esc(p.id)}"
    aria-selected="${i===mq.idx}" data-act="mention-pick" data-val="${esc(p.id)}">
    <span class="av">${avatarFor(p.id)}</span><b>${esc(shortName(p.name))}</b>${
      shortName(p.name)===p.name?'':`<span>${esc(p.name)}</span>`}</button>`).join('');
  pop.hidden=false;
  const c=caretXY(t,mq.start);
  pop.style.left=Math.max(0,Math.min(c.x,t.clientWidth-pop.offsetWidth))+'px';
  pop.style.top=c.y+'px';
  t.setAttribute('aria-activedescendant','mo-'+list[mq.idx].id);
}
/* Where a character of the note sits, from a hidden copy of the box with the
   same font and width, so the list opens under the @ being typed. */
function caretXY(t,at){
  const m=document.createElement('div'),cs=getComputedStyle(t);
  for(const k of ['fontFamily','fontSize','lineHeight','letterSpacing','padding','boxSizing','width','wordSpacing'])m.style[k]=cs[k];
  Object.assign(m.style,{position:'absolute',visibility:'hidden',whiteSpace:'pre-wrap',overflowWrap:'break-word',top:0,left:0});
  m.textContent=t.value.slice(0,at);
  const mark=document.createElement('span');mark.textContent='@';m.appendChild(mark);
  t.parentElement.appendChild(m);
  const out={x:mark.offsetLeft,y:mark.offsetTop+mark.offsetHeight-t.scrollTop+4};
  m.remove();return out;
}
function closeMention(){mq=null;const pop=$('#mpop');if(pop)pop.hidden=true;}
function pickMention(id){
  const t=$('#ctext'),p=plantById(id);if(!t||!p||!mq)return;
  const word='@'+shortName(p.name)+' ';
  const end=t.selectionStart;
  t.value=t.value.slice(0,mq.start)+word+t.value.slice(end);
  const at=mq.start+word.length;
  t.focus();t.setSelectionRange(at,at);
  draft=t.value;closeMention();
  t.dispatchEvent(new Event('input',{bubbles:true}));
  /* The chip just made pops in. */
  const marks=[...t.parentElement.querySelectorAll('.mback .mtag')];
  const idx=mentionSegments(t.value.slice(0,at),mentionLabels()).filter(sg=>sg.plantId).length-1;
  if(!calm.matches&&marks[idx])marks[idx].animate([{transform:'scale(.6)',opacity:0},{transform:'scale(1.08)',opacity:1,offset:.6},{transform:'none'}],
    {duration:320,easing:'cubic-bezier(.34,1.56,.64,1)'});
}
/* Keys the list answers while it is open. true = handled. */
function mentionKey(e){
  if(!mq||e.target.id!=='ctext')return false;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    mq.idx=(mq.idx+(e.key==='ArrowDown'?1:-1)+mq.list.length)%mq.list.length;
    document.querySelectorAll('#mpop [role=option]').forEach((b,i)=>b.setAttribute('aria-selected',i===mq.idx));
    e.target.setAttribute('aria-activedescendant','mo-'+mq.list[mq.idx].id);
    return true;
  }
  if(e.key==='Enter'||e.key==='Tab'){pickMention(mq.list[mq.idx].id);return true;}
  if(e.key==='Escape'){closeMention();return true;}
  return false;
}

/* ---- the chart ---- */
/* One window for the whole chart, recomputed each render so every bar and the
   scale above them share the same axis. */
let WIN={start:todayISO(),end:todayISO()};
const upcomingFor=id=>((careDoc&&careDoc.plants&&careDoc.plants[id])||{}).upcoming||[];
/* A plant's season, worked out one way for every bar, list and spine on the
   page: the variety table, moved by what was recorded and what is expected,
   then begun where this plant actually began. */
function plantSpans(p,end){
  const row=SEASON.find(r=>r.key===KEY_BY_ID[p.id]);
  return withStart(seasonSpans(row?row.ph:[],stagesOf(p.id),
    upcomingFor(p.id),end,{stage:p.stage,date:todayISO()}),p.started,p.startedHow||'sown');
}
/* The phase covering today, in the bar's own words. The plant's recorded
   stage settles a tie on a boundary day, but is never itself shown: the bar
   has one vocabulary and the Status text carries the nuance. */
function currentSpan(p,spans){
  const T=todayISO(),nowPh=phaseOfStage(p.stage);
  return spans.find(([c,f,to])=>f<=T&&to>=T&&c===nowPh)||spans.find(([,f,to])=>f<=T&&to>=T)||null;
}
/* When no band covers today (a basil that flowers, which its variety's season
   does not include, or a plant past the end of its usual season), the tag still
   names the stage the plant is in, rather than going blank. */
const currentPhaseCode=p=>{const s=currentSpan(p,plantSpans(p,WIN.end));return s?s[0]:phaseOfStage(p.stage)||'';};
const currentPhaseWord=p=>{const c=currentPhaseCode(p);return c?PHASE_LABEL[c]||c:'';};
/* The phase the plant is in, as a tag in that phase's colour: it is the same
   fact the bar shows, so it wears the bar's colour and outranks the dates. */
const phaseTagHTML=p=>{const w=currentPhaseWord(p);
  return w?`<em class="ptag-phase ${esc(currentPhaseCode(p))}">${esc(w)}</em>`:'';};
function refreshWindow(){
  const list=plants();
  WIN=chartWindow({
    spans:list.map(p=>plantSpans(p,null)),
    histories:list.map(p=>stagesOf(p.id)),
    upcomings:list.map(p=>upcomingFor(p.id)),
    today:todayISO(),monthsAhead:3});
}
/* Position on the shared axis, 0 to 100. */
const wpos=d=>{
  const a=Date.parse(WIN.start+'T00:00:00Z'),b=Date.parse(WIN.end+'T00:00:00Z');
  if(!(b>a))return 0;
  return Math.max(0,Math.min(100,(Date.parse(d+'T00:00:00Z')-a)/(b-a)*100));
};

/* Every phase name on the page comes from here, the legend included, so
   renaming a phase is this line and the next. */
const PHASE_LABEL={seed:'Seedling',grow:'Growing',flower:'Flowering',fruit:'Green fruit',harvest:'Harvest'};
/* What a narrow segment says instead, so a short phase is still named. */
const PHASE_SHORT={seed:'Seed',grow:'Grow',flower:'Flower',fruit:'Fruit',harvest:'Crop'};
/* How the plant arrived, said on the date it did. */
const STARTED_HOW={sown:'sown',planted:'planted',bought:'bought',cutting:'from a cutting'};
const startWord=p=>STARTED_HOW[p.startedHow]||'started';
const cap=w=>w.charAt(0).toUpperCase()+w.slice(1);
/* A date on the bar, with the way the plant arrived when it is that date. */
const spanDate=(p,d)=>(p&&p.started&&d===p.started?startWord(p)+' ':'')+chartDate(d);
const niceDate=d=>{const x=new Date(d+'T00:00:00Z');
  return `${x.getUTCDate()} ${['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][x.getUTCMonth()]}`;};
/* A bar can run past new year, so a date outside this year says which year it
   is. Every tooltip and every dated row goes through this one, or the small
   bar and the big one describe the same span differently. */
const chartDate=d=>niceDate(d)+(d.slice(0,4)===todayISO().slice(0,4)?'':' '+d.slice(0,4));

/* wpos clamps, so a position of 0 or 100 is no evidence that the date is on
   the chart at all. Ask the window itself before drawing the today marker. */
const inWindow=d=>d>=WIN.start&&d<=WIN.end;

/* Which phases actually happened. A stage change I wrote down dates its phase,
   and the stage the plant carries today is a recorded fact as well, since a
   plant that never changed stage has no history at all. Everything else is a
   guess, the variety table's or tonight's, however far back it sits. The bars
   and the dated list all ask this one question, so they cannot disagree about
   which parts of the year are recorded. */
function recordedPhases(p){
  const T=todayISO(),done=new Set();
  for(const h of stagesOf(p.id)){
    const ph=phaseOfStage(h.stage);
    if(ph&&h.date&&h.date<=T)done.add(ph);
  }
  const now=phaseOfStage(p.stage);
  if(now)done.add(now);
  if(p.started&&p.started<=T)done.add('seed');   // the start date is a record
  return done;
}

/* How much of a span is behind us and backed by a record, as an ISO date: the
   one rule the ribbon, the big band and the dated list all draw from. */
const spanSolidTo=(c,f,to,rec,T)=>rec.has(c)&&f<=T?(to<T?to:T):f;
const spanTip=(p,c,f,to,solidTo)=>`${PHASE_LABEL[c]||c}, ${spanDate(p,f)} to ${chartDate(to)}`+
  (solidTo>=to?'':solidTo>f?`, expected from ${chartDate(solidTo)}`:', expected');

/* The legend sits once, above the first chart. Past and future share one
   colour per phase now, so there is no Expected swatch: today is the line. */
function legendHTML(){
  return `<div class="legend">${Object.entries(PHASE_LABEL).map(([k,l])=>
    `<span><i class="sw ${k}"></i>${l}</span>`).join('')}</div>`;
}

function monthScaleHTML(){
  return `<div class="monthscale">${monthTicks(WIN.start,WIN.end).map(t=>
    `<b style="left:${wpos(t.date)}%">${t.label}</b>`).join('')}</div>`;
}

/* Solid is recorded, pale is expected, and today is where one stops being
   possible. A phase whose start nobody wrote down stays pale however long
   ago it was, because the variety table guessed it: drawing it solid claimed
   a record that does not exist, and the dated list underneath said so. Every
   span draws at least one piece, so nothing in that list is missing here. */
function seasonBarHTML(p){
  const spans=plantSpans(p,WIN.end);
  const T=todayISO(),rec=recordedPhases(p);
  const piece=(c,f,to,tip,end)=>
    `<i class="bar ${c}${end}" style="left:${wpos(f)}%;width:${
      Math.max(wpos(to)-wpos(f),0)}%" data-tip="${esc(tip)}"></i>`;
  /* A ribbon this small cannot say anything in words, so it says it here
     instead: the bar is one object with one sentence, not fourteen hoverable
     slivers, and it is the same sentence whether you can see colour or not. */
  const nowSpan=currentSpan(p,spans);
  const next=spans.find(x=>x!==nowSpan&&x[1]>=T);
  const low=c=>(PHASE_LABEL[c]||c).toLowerCase();
  const say=`Season bar. ${nowSpan?low(nowSpan[0])+' now':'no phase marked today'}`+
    (next?`, ${low(next[0])} expected from ${chartDate(next[1])}`:'')+'.';
  return `<span class="track" role="img" aria-label="${esc(say)}">${spans.map(([c,f,to],i)=>
      piece(c,f,to,spanTip(p,c,f,to,spanSolidTo(c,f,to,rec,T)),runEnds(i,spans.length))).join('')}
    ${inWindow(T)?`<i class="tline" style="left:${wpos(T)}%" data-tip="Today"></i>`:''}</span>`;
}

/* A photo as a print taped to the page. The tilt comes from the photo id, so a
   print keeps its angle from one render to the next instead of twitching. */
const tilt=(id,max)=>{let h=0;for(const c of id)h=(h*31+c.charCodeAt(0))|0;return ((h>>>0)%(max*20+1))/10-max;};
/* act and val say what a press does: on the page a print opens the plant's
   photos, in the gallery it opens that one photo. */
function snapHTML(x,name,cls='',act='gallery',val=x.plant){
  const when=x.date?niceDate(x.date):'';
  return `<button class="snap ${cls}" data-act="${act}" data-val="${esc(val)}" style="--tilt:${tilt(x.id,4).toFixed(1)}deg"
    aria-label="${act==='gallery'?`All photos of ${esc(name)}, newest ${esc(when)}`:`Photo of ${esc(name)}${when?', '+esc(when):''}`}">
    <img src="${photoURL(x.id)}" alt="" loading="lazy" decoding="async"><span class="cap">${esc(when)}</span></button>`;
}
/* The plant page keeps every print in one pile, newest on top. Two more peek
   out behind it so the pile reads as a pile; the viewer walks the rest. */
function stackHTML(p){
  const list=plantPhotos(shown(PHOTOS),p.id);
  if(!list.length)return '';
  return `<div class="stack">
    <div class="pile">${list.slice(1,3).reverse().map((x,i)=>`<span class="under u${i}" aria-hidden="true">
      <img src="${photoURL(x.id)}" alt="" loading="lazy"></span>`).join('')}
      ${snapHTML(list[0],p.name,'top')}</div>
    ${list.length>1?`<button class="stack-n" data-act="gallery" data-val="${esc(p.id)}">See all ${list.length} photos</button>`:''}
  </div>`;
}

/* Four rows: what it is and where it is in the season, when it was watered,
   what it is doing now, and what to do about it. The newest photo is taped on
   beside the two sentences. */
function plantRowHTML(p){
  const care=(careDoc&&careDoc.plants&&careDoc.plants[p.id])||null;
  const status=p.observations||'';
  const latest=plantPhotos(shown(PHOTOS),p.id)[0];
  return `<article class="prow ${touched.has(p.id)?'touched':''} ${latest?'has-snap':''}" data-pid="${esc(p.id)}">
    <div class="phead">
      <button class="pname" data-act="plant" data-val="${esc(p.id)}">
        <span class="art">${avatarFor(p.id)}</span>
        <b>${esc(p.name)}</b>${phaseTagHTML(p)}
      </button>
      <div class="chart">${monthScaleHTML()}${seasonBarHTML(p)}</div>
    </div>
    <div class="pbody">
    ${latest?snapHTML(latest,p.name):''}
    <p class="status"><b class="lbl">Status</b><span>${
      status?esc(status):'No reading yet.'}</span></p>
    <p class="guide"><b class="lbl">Care</b><span>${
      care&&care.guidance?esc(care.guidance)
      :'No guidance yet. Add a note, or wait for tonight\'s update.'}</span></p>
    </div>
    <div class="wline"><b class="lbl">Water</b><span>
      ${readAgo()}
      ${waterHTML(p)}
      <button class="waterbtn" data-act="water" data-val="${esc(p.id)}"><span class="drop">💧</span> Log water</button>
    </span></div>
  </article>`;
}

/* The journal. On the garden page it is what was actually written, once per
   entry, with every plant the distiller recognised turned into a tag. On a
   plant page it is that plant's own record. Either way it hangs off a spine
   tinted with the phase the plant was in, so the season reads down the page. */
function phaseAt(pid,date){
  /* The same spans the bars draw, so the spine and the bar agree. */
  const p=plantById(pid);
  const spans=p?plantSpans(p,WIN.end):[];
  const hit=spans.find(([,f,t])=>date>=f&&date<=t);
  return hit?hit[0]:'';
}

function tagsHTML(plants){
  return plants.map(t=>`<button class="ptag" data-act="plant" data-val="${esc(t.plantId)}"
    ><span class="av">${avatarFor(t.plantId)}</span>${esc(t.label)}</button>`).join(' ');
}

function entryBodyHTML(e){
  const mentions=(e.assigned||[]).filter(a=>a.mention).map(a=>({
    plantId:a.plantId,mention:a.mention,label:shortName((plantById(a.plantId)||{}).name||a.plantId)}));
  const segs=tagEntryText(e.text,mentions);
  /* A plant tagged by hand is not named in the words, so its tag goes after them. */
  const inText=new Set(segs.filter(sg=>sg.type==='tags').flatMap(sg=>sg.plants.map(t=>t.plantId)));
  const extra=(e.assigned||[]).filter(a=>!inText.has(a.plantId)&&plantById(a.plantId)).map(a=>({
    plantId:a.plantId,label:shortName(plantById(a.plantId).name)}));
  return segs.map(sg=>sg.type==='tags'?tagsHTML(sg.plants):esc(sg.text)).join('')+
    (extra.length?` <span class="handtags">${tagsHTML(extra)}</span>`:'');
}

function shotsHTML(ids){
  if(!ids.length)return '';
  return `<div class="shots">${ids.map(id=>
    `<button data-act="view" data-val="${esc(id)}"><img src="${photoURL(id)}" alt="" loading="lazy"></button>`
  ).join('')}</div>`;
}

function journalItemHTML(it){
  const editing_=editing&&editing.kind===it.kind&&editing.id===it.id;
  const fresh=it.id===lastEntryId&&Date.now()-savedAt<1500;
  return `<li class="jent ${it.phase?'ph-'+it.phase:''}${fresh?' fresh':''}">
    <div class="jdate">${dayLabel(it.date)}</div>
    <div class="jbody">
      ${editing_?editBoxHTML(it.kind,it.id,it.plantId,it.raw)
        :`<p class="prose">${it.html}</p>
          ${it.aside?`<p class="aside">${esc(it.aside)}${it.pickId?` <button class="lnk" data-act="assign-pick"
            data-val="${esc(it.pickId)}">Choose a plant</button>`:''}</p>`:''}
          ${shotsHTML(it.photoIds||[])}
          <div class="entry-acts">
            <button class="lnk" data-act="${it.kind}-edit" data-val="${esc(it.id)}"
              data-plant="${esc(it.plantId||'')}">Edit</button>
            <button class="lnk" data-act="${it.kind}-del"
              data-val="${esc(it.kind==='entry'?it.id:it.plantId)}" data-note="${esc(it.id)}">Delete</button>
          </div>`}
    </div></li>`;
}

function journalHTML(items,count){
  const groups=journalGroups(items);
  return `<div class="hd"><h2>Journal</h2><span class="meta">${count}</span></div>
    ${groups.length?`<div class="jwrap">${groups.map(g=>`<div class="jmonth">${esc(g.label)}</div>
      <ol class="jlist">${g.entries.map(journalItemHTML).join('')}</ol>`).join('')}</div>`
      :'<div class="none">Nothing written yet. The box at the top is where it starts.</div>'}`;
}

/* The garden journal: the entries as written. */
function gardenJournalHTML(){
  const items=shown(entriesDoc.entries).map(e=>({
    kind:'entry',id:e.id,date:e.date,raw:e.text,html:entryBodyHTML(e),
    photoIds:(e.photoIds||[]).filter(id=>shown(PHOTOS).some(x=>x.id===id)),
    phase:(e.assigned||[])[0]?phaseAt(e.assigned[0].plantId,e.date):'',
    aside:e.status==='unsorted'?'No plant recognised yet.':'',
    pickId:e.status==='unsorted'?e.id:'',
  }));
  const loose=shown(PHOTOS).filter(p=>!items.some(i=>(i.photoIds||[]).includes(p.id)));
  for(const p of loose)items.push({kind:'photo',id:p.id,date:p.date,html:'',photoIds:[p.id],phase:''});
  return journalHTML(items,count(items.length,'entry','entries'));
}

/* A plant's journal: what the model filed under it, and its photos. */
function plantJournalHTML(p){
  const notes=shown(p.notes).map(n=>({
    kind:'note',id:n.id,plantId:p.id,date:n.date,raw:n.text,html:esc(n.text),
    aside:n.quote?`from your note: “${n.quote}”`:'',
    phase:phaseAt(p.id,n.date),photoIds:[]}));
  const byDate={};
  for(const x of shown(PHOTOS).filter(x=>x.plant===p.id)){(byDate[x.date]=byDate[x.date]||[]).push(x.id);}
  for(const [date,ids] of Object.entries(byDate)){
    const hit=notes.find(n=>n.date===date);
    if(hit)hit.photoIds=ids;
    else notes.push({kind:'photo',id:ids[0],plantId:p.id,date,html:'',photoIds:ids,phase:phaseAt(p.id,date)});
  }
  return journalHTML(notes,count(notes.length,'entry','entries'));
}

/* ---- weather ---- */
/* The forecast is four numbers, so it rides the end of the area heading
   rather than taking a row of its own. The alert keeps its own line, since
   the reason is the useful half and hiding it would cost more than the row. */
function wxReadHTML(date){
  const w=wxOf(date);if(!w)return'';
  return `<div class="wxnow">
    <span class="deg ${w.tmax>=27?'hot':''}">${wxIcon(w)} ${Math.round(w.tmax)}°</span>
    <span>night <span class="${w.tmin<=10?'cold':''}">${Math.round(w.tmin)}°</span></span>
    <span>rain ${w.pop}%</span>
    <span>${date===todayISO()?'today':dayLabel(date)}</span>
  </div>`;
}
function wxAlertHTML(date){
  const w=wxOf(date);if(!w)return'';
  const al=weatherAlerts(date,w,plants());   // the rule keeps this to outdoor plants
  if(!al.length)return'';
  return `<div class="wxalerts">${al.map(a=>`<div class="warn ${a.key.startsWith('cold')?'cold':''}" role="note">
    <span class="wav" aria-hidden="true">${esc(a.ico)}</span>
    <p class="wmsg"><b>${esc(a.what)}</b><span>${esc(a.why)}</span></p></div>`).join('')}</div>`;
}

/* The page is the list, so the list needs no heading of its own.
   One card level only: the plant. The area is a heading on the page above
   its grid, and the forecast is a block of its own above the balcony grid.
   The forecast belongs to the balcony group, not to the page: an indoor
   plant must never be sitting under a cold-night warning. */
const count=(n,one,many)=>`${n} ${n===1?one:(many||one+'s')}`;
function allPlantsHTML(){
  const T=todayISO(),all=plants();
  return `${groupByArea(all).map((g,i)=>`
      <div class="areahd"><h2>${esc(g.label)}</h2><span>${count(g.plants.length,'plant')}</span>
        ${g.area==='balcony'?wxReadHTML(T):''}</div>
      ${g.area==='balcony'?wxAlertHTML(T):''}
      ${i===0?`<div class="lgd-row">${legendHTML()}</div>`:''}
      <div class="plist">${g.plants.map(plantRowHTML).join('')}</div>`).join('')}
    <section class="sect">${gardenJournalHTML()}</section>`;
}

/* ---- one plant, in full ---- */
/* The page works out the plant's season once and hands the same spans to the
   chart and to the dated list under it, so the two can never disagree. Same
   call, same arguments, as the small bar on the list page. */
function pfullSpans(p){ return plantSpans(p,WIN.end); }

/* The list ribbon is nine pixels because fourteen of them share a page. There
   is one bar here, so it gets the height to carry its own phase names, and
   the part of a phase that has not happened yet is a pale tint. The dated
   list below says it in words, because colour on its own never says
   "expected". */
/* What each changing line said the last time it was drawn, so the render
   in which it changes can mark it. Keyed on the fact, not the words: the
   minutes in "3 min ago" tick over on their own and that is not news. */
const drawn=new Map();
function changed(key,val){
  const had=drawn.has(key),prev=drawn.get(key);drawn.set(key,val);
  return had&&prev!==val;
}
let careTick=false;           // set once per render, since every card prints the same line
const readAgo=()=>careDoc&&careDoc.generatedAt
  ? `<i class="ago${careTick?' justnow':''}">Updated ${esc(relTime(careDoc.generatedAt))}</i>` : '';
const waterHTML=p=>`<span class="water${changed('w:'+p.id,p.last||'')?' justnow':''}">${esc(waterLabel(p.last,todayISO()))}</span>`;

/* The coloured run is rounded at its own two ends, wherever it starts and
   stops, rather than the grey track behind it being rounded at the window's
   edges. Otherwise a season ending in early December ends square. */
const runEnds=(i,n)=>(i===0?' first':'')+(i===n-1?' last':'');

function pfullChartHTML(p,spans){
  const T=todayISO(),t=wpos(T),rec=recordedPhases(p);
  const seg=([c,f,to],i)=>{
    const l=wpos(f),w=Math.max(wpos(to)-l,0);
    const tip=spanTip(p,c,f,to,spanSolidTo(c,f,to,rec,T));
    return `<i class="pfull-seg ${c}${runEnds(i,spans.length)}" style="left:${l}%;width:${w}%"
      data-tip="${esc(tip)}">${w>=3?
      `<b><span class="lg">${esc(PHASE_LABEL[c]||c)}</span><span class="sm">${
        esc(PHASE_SHORT[c]||c)}</span></b>`:''}</i>`;
  };
  const on=inWindow(T);
  return `<div class="pfull-chart">${monthScaleHTML()}
    <div class="pfull-track">${spans.map(seg).join('')}${p.started&&inWindow(p.started)?
      `<i class="pfull-startmk" style="left:${wpos(p.started)}%" data-tip="${
        esc(cap(spanDate(p,p.started)))}"></i>`:''}${on?
      `<i class="pfull-today" style="left:${t}%"></i>`:''}</div>
    <div class="pfull-axis">${on?
      `<b class="pfull-todaylbl" style="left:${Math.min(Math.max(t,4),96)}%">Today</b>`:''}</div></div>`;
}

/* The same phases again, this time with their dates spelled out and each one
   said to be recorded or expected, because a tint is not a sentence. The
   recorded test is the one the bars draw from, so a row cannot say expected
   next to a band drawn solid. */
function pfullStagesHTML(p,spans){
  if(!spans.length)return '<p class="pfull-none">No season worked out for this one yet.</p>';
  const T=todayISO(),done=recordedPhases(p);
  /* One phase is now, never two: the same span the title word names. */
  const at=spans.indexOf(currentSpan(p,spans));
  const rows=`<ol class="pfull-stages">${spans.map(([c,f,to],i)=>{
    /* Three honest words, not two: something logged, something already over
       that nobody logged so its dates are the table's guess, and something
       still to come. A finished phase is never called expected. */
    const kind=f<=T&&done.has(c)?'recorded':to<=T?'estimated':'expected';
    return `<li class="pfull-stage">
      <i class="sw ${c}"></i>
      <span class="pfull-name">${esc(PHASE_LABEL[c]||c)}</span>
      ${i===at?'<em class="pfull-nowtag">now</em>':''}
      <span class="pfull-when">${esc(cap(spanDate(p,f)))} to ${esc(chartDate(to))}</span>
      <em class="pfull-mark ${kind}">${kind[0].toUpperCase()+kind.slice(1)}</em>
    </li>`;}).join('')}</ol>`;
  /* A plant resting outside every phase has nothing marked now. Say so in
     the bar's own terms rather than leaving the reader to spot it. */
  const nowPh=phaseOfStage(p.stage);
  return rows+(at<0?`<p class="pfull-none">${nowPh
    ?`${esc(PHASE_LABEL[nowPh]||nowPh)} now, outside this variety's usual season, so the bar has no band for today.`
    :'Nothing on the bar is marked now.'}</p>`:'');
}

function plantHTML(p){
  const key=KEY_BY_ID[p.id],pr=PROFILE[key]||{t:p.name,body:[],src:''};
  const care=(careDoc&&careDoc.plants&&careDoc.plants[p.id])||null;
  const spans=pfullSpans(p);
  return `<div class="lgd-row">${legendHTML()}</div>
    <section class="sect pfull">
      <div class="hd"><span class="pfull-art">${avatarFor(p.id)}</span>
        <h2>${esc(p.name)}</h2>${phaseTagHTML(p)}
        <span class="meta">${p.area==='indoor'?'Indoor':'Balcony'}</span></div>
      ${pfullChartHTML(p,spans)}
      ${pfullStagesHTML(p,spans)}
      <div class="pfull-body">
      <div class="pfull-say">
        <p class="status"><b class="lbl">Status</b><span>${
          p.observations?esc(p.observations):'No reading yet.'}</span></p>
        <p class="guide"><b class="lbl">Care</b><span>${
          care&&care.guidance?esc(care.guidance)
          :'No guidance yet. Add a note, or wait for tonight\'s update.'}</span></p>
      </div>
      ${stackHTML(p)}
      </div>
      <div class="wline"><b class="lbl">Water</b><span>
        ${readAgo()}
        ${waterHTML(p)}
        <button class="waterbtn" data-act="water" data-val="${esc(p.id)}"><span class="drop">💧</span> Log water</button>
      </span></div>
    </section>

    <section class="sect">${plantJournalHTML(p)}</section>

    <section class="sect">
      <div class="hd vhd"><b class="lbl">About this variety</b>
        <h2>${esc(pr.t||p.name)}</h2></div>
      <div class="wiki">
        <div class="wtext">
          ${(pr.body||[]).map(b=>`<p class="prose">${esc(b)}</p>`).join('')}
          ${FACTS[key]?`<dl class="facts">${Object.entries(FACT_LABEL)
            .filter(([k])=>FACTS[key][k])
            .map(([k,l])=>`<dt>${esc(l)}</dt><dd>${factValue(FACTS[key],k)}</dd>`).join('')}</dl>`:''}
        </div>
        <div class="wpics">
          ${REAL[key]?`<figure><img src="${REAL[key][0]}" alt="${esc(REAL[key][1])}" loading="lazy"
            onerror="this.parentElement.style.display='none'"><figcaption>${esc(REAL[key][1].split(' · ')[0])}${REAL[key][2]?` <i>${esc(REAL[key][2])}</i>`:''}</figcaption></figure>`:''}
          ${FRUIT[key]?`<figure><img src="${FRUIT[key][0]}" alt="${esc(FRUIT[key][1])}" loading="lazy"
            onerror="this.parentElement.style.display='none'"><figcaption>${esc(FRUIT[key][1])}${FRUIT[key][2]?` <i>${esc(FRUIT[key][2])}</i>`:''}</figcaption></figure>`:''}
        </div>
      </div>
    </section>`;
}
function editBoxHTML(kind,id,plantId,text){
  return `<div class="note"><textarea id="etext">${esc(text)}</textarea>
    <div class="entry-acts">
      <button class="lnk" data-act="edit-cancel">Cancel</button>
      <button class="tick" data-act="edit-save" data-val="${esc(id)}" data-plant="${esc(plantId||'')}"
        data-kind="${kind}">Save</button>
    </div></div>`;
}

/* ---- the lock ---- */
function renderLock(){
  const el=$('#lock');
  /* Nothing behind the lock can be typed into or pressed. */
  const page=$('#page');if(page)page.inert=!!(busy||lockDone);
  if(!busy&&lockDone){el.className='on';document.body.classList.add('locked');
    el.setAttribute('aria-label','What your note changed');
    el.innerHTML=summaryHTML(lockDone);
    /* Keyboard focus starts inside: on the main button, else the first choice. */
    (el.querySelector('.primary')||el.querySelector('.guess')||el.querySelector('button'))?.focus();return;}
  if(!busy){el.className='';el.innerHTML='';document.body.classList.remove('locked');return;}
  const secs=Math.round((Date.now()-busyAt)/1000);
  const byTime=(a,b)=>(a.createdAt||0)-(b.createdAt||0);
  const e=entriesDoc.entries.filter(x=>pollWatch.includes(x.id)).sort(byTime).at(-1)
    ||shown(entriesDoc.entries).slice().sort(byTime).at(-1)||{text:''};
  const who=(e.assigned||[]).map(a=>plantById(a.plantId)).filter(Boolean);
  el.className='on';document.body.classList.add('locked');
  el.setAttribute('aria-label','Filing your note');
  /* Already showing: change only what moved, so its button stays put. */
  const open=el.querySelector('.waiting:not(.done)');
  if(open&&open.dataset.entry===(e.id||'')){
    const said=open.querySelector('.said');if(said)said.innerHTML=saidHTML(e);
    const found=who.length?`<div class="found">${who.map(p=>{
      const note=(p.notes||[]).find(n=>(e.assigned||[]).some(a=>a.noteId===n.id));
      return `<div class="read"><span class="art">${avatarFor(p.id)}</span>
        <span><b>${esc(p.name)}</b><span>${esc(note?note.text:'')}</span></span></div>`;}).join('')}</div>`:'';
    const old=open.querySelector('.found');
    if(old)old.outerHTML=found||'<span hidden></span>';else if(found)open.querySelector('.eta').insertAdjacentHTML('afterend',found);
    return;
  }
  el.innerHTML=`<div class="waiting" data-entry="${esc(e.id||'')}">
    <p class="said">${saidHTML(e)}</p>
    <div class="steps"><i><b style="width:${Math.min(95,8+secs*7)}%"></b></i></div>
    <div class="stage">Filing your note</div>
    <div class="eta">${secs} s · the care guidance is updated after this</div>
    ${who.length?`<div class="found">${who.map(p=>{
      const note=(p.notes||[]).find(n=>(e.assigned||[]).some(a=>a.noteId===n.id));
      return `<div class="read"><span class="art">${avatarFor(p.id)}</span>
        <span><b>${esc(p.name)}</b><span>${esc(note?note.text:'')}</span></span></div>`;}).join('')}</div>`:''}
    ${secs>15?'<button class="out" data-act="escape">Let me back in</button>':''}
  </div>`;
}

/* Your note in the lock and in the summary, drawn the way the journal draws
   it: your own hand, with each plant it names as a chip. The chips here are
   labels, not links, since the page underneath is out of reach. The model's
   mentions are used once it has read the note; before that, the @names. */
function saidHTML(e){
  const text=e.text||'';
  let ms=(e.assigned||[]).filter(a=>a.mention&&plantById(a.plantId));
  if(!ms.length)ms=noteMentions(text);
  const mentions=ms.map(m=>({plantId:m.plantId,mention:m.mention,label:shortName(plantById(m.plantId).name)}));
  return tagEntryText(text,mentions).map(sg=>sg.type==='tags'
    ?sg.plants.map(t=>`<span class="ptag"><span class="av">${avatarFor(t.plantId)}</span>${esc(t.label)}</span>`).join(' ')
    :esc(sg.text)).join('');
}

/* ---- what the note changed ----
   The lock does not just vanish when the work is done: everything it waited
   for is spread down a long page, and a return to the top shows none of it.
   So it turns into a short account instead: each plant the note landed on,
   what was filed under it, what else moved (stage, watering, its status),
   and a button that goes to that plant and flashes it. */
let lockDone=null;
function noteSummary(watch,before,flags={}){
  const e=entriesDoc.entries.filter(x=>watch.includes(x.id)).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0]
    ||entriesDoc.entries.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0))[0]||{};
  const rows=[],seen=new Set();
  const row=(pid,note,named=true)=>{
    const p=plantById(pid),b=before[pid];if(!p||seen.has(pid))return;
    const moved=[];
    if(b&&b.stage!==p.stage)moved.push(`Stage: ${p.stage}`);
    if(b&&b.last!==(p.last||'')&&p.last)moved.push(waterLabel(p.last,todayISO()));
    const status=named&&b&&b.obs!==(p.observations||'')?p.observations||'':'';
    if(named?!note&&!moved.length&&!status:!moved.length)return;
    seen.add(pid);rows.push({pid,note,moved,status});
  };
  for(const a of e.assigned||[]){
    const p=plantById(a.plantId);
    const n=p&&(p.notes||[]).find(x=>x.id===a.noteId);
    row(a.plantId,n?n.text:'');
  }
  /* The guidance run rewrites every plant's status, so a plant the note never
     named only counts when something real moved: its stage or its watering. */
  for(const p of plants())row(p.id,'',false);
  return {...flags,entryId:e.id,text:e.text||'',said:saidHTML(e),rows,
    date:e.date&&e.date!==todayISO()?e.date:'',
    guesses:(e.suggestions||[]).filter(pid=>plantById(pid))};
}
function summaryHTML(d){
  const head=d.failed?'Saved. The AI could not be reached'
    :d.stuck?'Which plant is this about?'
    :d.slow?'Saved. Still working out which plant'
    :d.rows.length?`Done · ${count(d.rows.length,'plant')} updated`:'Saved';
  const care=d.fresh?'Care guidance is refreshed for every plant.'
    :d.careFailed?'The care update did not work this time. It runs again with your next note and every night.'
    :d.careSlow?'The care update is taking a while. The page will show it when it arrives.'
    :d.waiting?'<span class="pulse" aria-hidden="true"></span>Updating the care guidance…'
    :d.slow?'The journal will update when it is done.':'';
  return `<div class="waiting done">
    <div class="donehd"><span class="tickmark ${d.failed||d.stuck?'ask':''}" aria-hidden="true">${d.failed||d.stuck?'?':'✓'}</span><b>${head}</b></div>
    ${d.date?`<p class="dated">Dated ${esc(niceDate(d.date))}</p>`:''}
    ${d.text?`<p class="said small">${d.said}</p>`:''}
    ${d.rows.length?`<ul class="changes">${d.rows.map(r=>{const p=plantById(r.pid);return `<li>
      <span class="art">${avatarFor(r.pid)}</span>
      <span class="what"><b>${esc(p.name)}</b>
        ${r.note?`<span class="filed">${esc(r.note)}</span>`:''}
        ${r.moved.length?`<span class="moved">${r.moved.map(esc).join(' · ')}</span>`:''}
        ${r.status?`<span class="status-new">Status: ${esc(r.status)}</span>`:''}</span>
      <button class="goto" data-act="lock-go" data-val="${esc(r.pid)}">Show</button></li>`;}).join('')}</ul>`:''}
    ${d.failed?`<p class="note-end">Your note is kept. Try again now, or pick the plant yourself.</p>
      <div class="doneacts"><button class="lnk" data-act="lock-close">Later</button>
        <button class="lnk" data-act="lock-pick" data-val="${esc(d.entryId||'')}">Choose a plant</button>
        <button class="primary" data-act="lock-retry" data-val="${esc(d.entryId||'')}">Try again</button></div>`
    :d.stuck?`<p class="note-end">${d.guesses.length?'It might be one of these. Pick it and the note is filed straight away.'
        :'Pick the plant and the note is filed straight away.'}</p>
      ${d.guesses.length?`<div class="guesses">${d.guesses.map(pid=>`<button class="guess" data-act="lock-assign"
        data-val="${esc(d.entryId)}" data-plant="${esc(pid)}"><span class="av">${avatarFor(pid)}</span>${
        esc(plantById(pid).name)}</button>`).join('')}</div>`:''}
      <div class="doneacts"><button class="lnk" data-act="lock-close">Later</button>
        <button class="${d.guesses.length?'lnk':'primary'}" data-act="lock-pick" data-val="${esc(d.entryId||'')}">${
          d.guesses.length?'Another plant…':'Choose a plant'}</button></div>`
    :`<p class="note-end">${care}</p>
      <div class="doneacts"><button class="primary" data-act="lock-close">Back to the garden</button></div>`}
  </div>`;
}
function closeSummary(){lockDone=null;renderLock();}
/* File a note onto plants by hand, from the summary or the journal. */
async function assignEntry(id,plantIds){
  const since=Date.now()-2000;      // the server's clock may run a little behind
  setBusy('read');
  const r=await apiWrite('PATCH','/api/entries/'+encodeURIComponent(id),JSON.stringify({plantIds}),'application/json');
  if(!r||!r.ok){setBusy('');toast('Could not save. Try again.');return;}
  refreshSoon(id,since);   // filed already; the summary reports it and follows the care update
}
/* Send the note's own words back: the server matches it to plants again. */
async function retryEntry(id){
  const e=entriesDoc.entries.find(x=>x.id===id);if(!e)return;
  const since=Date.now()-2000;
  setBusy('read');
  const r=await apiWrite('PATCH','/api/entries/'+encodeURIComponent(id),
    JSON.stringify({text:e.text,mentions:noteMentions(e.text)}),'application/json');
  if(!r||!r.ok){setBusy('');toast('Could not save. Try again.');return;}
  await loadEntries();
  refreshSoon(id,since);
}
/* Go to a plant from the summary: its card on the list, or its page. */
function showChanged(pid){
  closeSummary();
  if(V.plant&&V.plant!==pid){goTo(pid,true);window.scrollTo({top:0,behavior:'smooth'});return;}
  const el=V.plant?document.querySelector('.pfull'):document.querySelector(`.plist .prow[data-pid="${CSS.escape(pid)}"]`);
  if(!el)return;
  el.scrollIntoView({behavior:calm.matches?'auto':'smooth',block:'center'});
  el.classList.remove('touched');void el.offsetWidth;el.classList.add('touched');
  setTimeout(()=>el.isConnected&&el.classList.remove('touched'),2600);
}

/* ================= life ================= */
/* Everything that moves asks this first. */
const calm=matchMedia('(prefers-reduced-motion: reduce)');
const rnd=(a,b)=>a+Math.random()*(b-a);
/* A handful of drops or leaves from the middle of an element. They live on
   the body, not the page, so a re-render underneath cannot cut them short. */
function burst(el,kind){
  if(calm.matches||!el||!el.isConnected)return;
  const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  const n=kind==='water'?7:6;
  for(let i=0;i<n;i++){
    const d=document.createElement('i');d.className='fx fx-'+kind;document.body.appendChild(d);
    const at=`translate(${x}px,${y}px)`;
    const frames=kind==='water'
      ? (()=>{const dx=(i-(n-1)/2)*9+rnd(-4,4);return [
          {transform:`${at} translate(-50%,-50%) scale(.5)`,opacity:0},
          {transform:`${at} translate(calc(-50% + ${dx*.35}px),calc(-50% - ${rnd(10,18)}px)) scale(1)`,opacity:1,offset:.2},
          {transform:`${at} translate(calc(-50% + ${dx}px),calc(-50% + ${rnd(26,44)}px)) scale(.7)`,opacity:0}];})()
      : (()=>{const dx=rnd(-46,46),rot=rnd(-240,240);return [
          {transform:`${at} translate(-50%,-50%) rotate(0) scale(.4)`,opacity:0},
          {transform:`${at} translate(calc(-50% + ${dx*.4}px),calc(-50% - 26px)) rotate(${rot*.4}deg) scale(1)`,opacity:1,offset:.25},
          {transform:`${at} translate(calc(-50% + ${dx}px),calc(-50% - ${rnd(60,90)}px)) rotate(${rot}deg) scale(.8)`,opacity:0}];})();
    d.animate(frames,{duration:kind==='water'?rnd(650,850):rnd(1000,1300),
      easing:kind==='water'?'cubic-bezier(.3,.1,.6,1)':'cubic-bezier(.2,.7,.3,1)',delay:i*18}).onfinish=()=>d.remove();
  }
}
/* A card that was just watered soaks it up, without waiting for a re-render. */
function soak(pid){
  const c=document.querySelector(`.plist .prow[data-pid="${CSS.escape(pid)}"]`);if(!c)return;
  c.classList.remove('wet');void c.offsetWidth;c.classList.add('wet');
  setTimeout(()=>c.isConnected&&c.classList.remove('wet'),1700);
}
/* What arrives on screen after a load or a change of plant, in reading order. */
const arrivals=()=>[...document.querySelectorAll('#page > .areahd, #page > .lgd-row, .plist .prow, #page > .sect')];
/* The first visit: cards come up one after another, their season bars grow
   from the left and their prints are laid down. Runs once, after the data
   has arrived, so a re-render cannot restart it halfway. */
function playIntro(){
  document.documentElement.classList.remove('pre');
  if(calm.matches)return;
  introAlerts();
  const ease='cubic-bezier(.2,.7,.2,1)';
  arrivals().forEach((el,i)=>{
    const delay=Math.min(i,12)*55;
    el.animate([{opacity:0,transform:'translateY(16px)'},{opacity:1,transform:'none'}],{duration:540,delay,easing:ease,fill:'backwards'});
    /* The rail stays; the phases are drawn onto it from the left. Each piece
       starts when the sweep reaches its left edge and takes as long as the
       sweep takes to cross it, so together they read as one stroke. */
    el.querySelectorAll('.track,.pfull-track').forEach(t=>{
      const W=t.offsetWidth||1,T=900;
      t.querySelectorAll('.bar,.pfull-seg,.pfull-fut').forEach(b=>{
        const l=b.offsetLeft/W,w=Math.max(b.offsetWidth/W,.02);
        b.animate([{clipPath:'inset(0 100% 0 0)'},{clipPath:'inset(0 0 0 0)'}],
          {duration:w*T,delay:delay+220+l*T,easing:'linear',fill:'backwards'});
      });
      t.querySelectorAll('.tline,.pfull-today,.pfull-startmk').forEach(m=>m.animate(
        [{opacity:0,transform:m.classList.contains('pfull-startmk')?'scale(.3)':'scaleY(.2)'},{opacity:1,transform:'none'}],
        {duration:260,delay:delay+220+(m.offsetLeft/W)*T,easing:'cubic-bezier(.34,1.56,.64,1)',fill:'backwards'}));
    });
    el.querySelectorAll('.pbody > .snap, .pile').forEach(sn=>{
      const t=sn.classList.contains('pile')?'0deg':sn.style.getPropertyValue('--tilt')||'0deg';
      sn.animate([{opacity:0,transform:`translateY(-18px) rotate(calc(${t} - 12deg)) scale(1.08)`},
        {opacity:1,transform:`rotate(${t})`}],{duration:560,delay:delay+360,easing:'cubic-bezier(.3,1.4,.5,1)',fill:'backwards'});
    });
  });
}
/* The forecast types for a moment, then its message pops out of the tail. */
function introAlerts(){
  document.querySelectorAll('.wxalerts').forEach(box=>{
    const warns=[...box.querySelectorAll('.warn')];if(!warns.length)return;
    const narrow=getComputedStyle(warns[0]).borderTopLeftRadius==='4px';
    const typing=document.createElement('div');typing.className='wtyping';typing.setAttribute('aria-hidden','true');
    typing.innerHTML='<i></i><i></i><i></i>';box.prepend(typing);
    const origin=narrow?'0 0':'100% 0';
    typing.style.transformOrigin=origin;
    typing.animate([{opacity:0,transform:'scale(.4)'},{opacity:1,transform:'none'}],
      {duration:260,delay:200,easing:'cubic-bezier(.34,1.56,.64,1)',fill:'backwards'});
    warns.forEach((w,i)=>{w.style.transformOrigin=origin;
      w.animate([{opacity:0,transform:'scale(.5) translateY(-6px)'},{opacity:1,transform:'none'}],
        {duration:420,delay:1150+i*160,easing:'cubic-bezier(.34,1.56,.64,1)',fill:'backwards'});});
    typing.animate([{opacity:1},{opacity:0,transform:'scale(.6)'}],{duration:160,delay:1050,fill:'forwards'})
      .onfinish=()=>typing.remove();
  });
}
/* Changing plant: the new content fades up, quicker than the first visit. */
function turnPage(){
  if(calm.matches)return;
  arrivals().forEach((el,i)=>el.animate([{opacity:0,transform:'translateY(10px)'},{opacity:1,transform:'none'}],
    {duration:320,delay:Math.min(i,8)*35,easing:'cubic-bezier(.2,.7,.2,1)',fill:'backwards'}));
}

/* ================= the note ================= */
/* One composer, at the top of the page. A note carries the plants it is
   tagged with, the one the nav has selected and any named with @, so the
   distiller is not asked to guess them. */
/* date: the day the note is about when it is not today, so a catch-up note
   about last week lands on last week, and so does what the AI reads into it. */
const staged={top:[],date:null};
const NOTE_MIN='2024-01-01';     // the garden's first season; nothing earlier is a real note date
let draft='';
let lastEntryId=null,savedAt=0;
function clearDraft(){staged.top.forEach(s=>URL.revokeObjectURL(s.url));staged.top=[];staged.date=null;draft='';closeMention();}
let saving=false;
async function saveEntry(){
  /* One save at a time, and never from behind the lock. */
  if(saving||busy||lockDone)return;
  /* A box holding only the page's own tag and some photos is a photo note. */
  const text=noteWords(draft)?draft.trim():'';
  if(!text&&!staged.top.length)return;
  saving=true;
  try{await saveNote(text);}finally{saving=false;}
}
async function saveNote(text){
  const date=staged.date&&staged.date<todayISO()?staged.date:todayISO(),tags=noteTags();
  const btn=document.querySelector('[data-act="save"]');if(btn)btn.disabled=true;
  const photoIds=[];
  for(const s of staged.top){
    /* One tag says what the photo shows. Several leave it for the server to
       sort out among just those plants. */
    const rec=await uploadOne(s.blob,date,tags.length===1?tags[0]:'');
    if(!rec){if(btn)btn.disabled=false;return;}
    photoIds.push(rec.id);
  }
  const r=await apiWrite('POST','/api/entries',
    JSON.stringify({date,text,photoIds,...(tags.length?{plantIds:tags,mentions:noteMentions(text)}:{})}),'application/json');
  if(!r||!r.ok){if(r)toast('Could not save. Try again.');if(btn)btn.disabled=false;return;}
  const entry=await r.json();
  entriesDoc={...entriesDoc,entries:[...entriesDoc.entries,entry]};
  store.set('entriesDoc',entriesDoc);
  lastEntryId=entry.id;savedAt=Date.now();
  burst(document.querySelector('[data-act="save"]'),'leaf');
  /* Let go of the box first, or the redraw puts the caret back in it and the
     plant page writes its tag in again behind the lock. */
  document.activeElement?.blur?.();
  clearDraft();renderAll();refreshSoon(entry.id);
}

/* On a plant page, opening an empty box writes that plant's tag in first. */
document.addEventListener('focusin',e=>{
  const t=e.target;if(t.id!=='ctext'||t.value||!selfTag())return;
  t.value=selfTag();t.setSelectionRange(t.value.length,t.value.length);
  draft=t.value;syncMback(t);t.dispatchEvent(new Event('input',{bubbles:true}));
  const m=t.parentElement.querySelector('.mback .mtag');
  if(m&&!calm.matches)m.animate([{transform:'scale(.6)',opacity:0},{transform:'scale(1.08)',opacity:1,offset:.6},{transform:'none'}],
    {duration:320,easing:'cubic-bezier(.34,1.56,.64,1)'});
});
/* Left with nothing but that tag, the box goes back to its placeholder. */
document.addEventListener('focusout',e=>{
  const t=e.target;if(t.id!=='ctext'||!selfTag()||t.value.trim()!==selfTag().trim()||staged.top.length)return;
  /* A redraw swaps the box out from under the focus; that is not leaving it. */
  setTimeout(()=>{if(document.activeElement===t||!t.isConnected)return;
    t.value='';draft='';syncMback(t);t.dispatchEvent(new Event('input',{bubbles:true}));},150);
});
document.addEventListener('scroll',e=>{if(e.target.id==='ctext')syncMback(e.target);},true);
/* The note's date. A click anywhere on the chip opens the calendar; a day
   after today cannot be picked, and picking today goes back to "Today". */
document.addEventListener('click',e=>{
  const l=e.target.closest('.ndate');if(!l)return;
  const i=l.querySelector('input');try{i.showPicker();e.preventDefault();}catch{}
});
/* Changed in place, never by a redraw: a date can be typed a part at a time,
   and a redraw would throw the box away halfway through the year. A day that
   is not a real one between NOTE_MIN and today just means today. */
document.addEventListener('change',e=>{
  if(e.target.id!=='cdate')return;
  const v=e.target.value,T=todayISO();
  staged.date=/^\d{4}-\d{2}-\d{2}$/.test(v)&&v<T&&v>=NOTE_MIN?v:null;
  const chip=e.target.closest('.ndate');
  chip.classList.toggle('past',!!staged.date);
  chip.querySelector('span').textContent=(staged.date?niceDate(staged.date):'Today')+' ▾';
});
/* A press on the list must not take focus from the note first. */
document.addEventListener('pointerdown',e=>{if(e.target.closest('#mpop'))e.preventDefault();});
/* One tooltip for the page. Over a chart it follows the pointer and answers
   at once, because a chart is read by moving across it. Over a button it
   waits a beat, then sits under the button; once one tip is up, the next
   one along answers at once, the way toolbars usually behave. Keyboard
   focus shows a button's tip too. */
const tipEl=()=>document.getElementById('tip');
let tipFor=null,tipTimer=0,tipWarmUntil=0;
const pinned=b=>b.matches('button,[role="button"]');
function showTip(b,x,y){
  const el=tipEl();if(!el||!b.isConnected)return;
  tipFor=b;
  /* A season segment leads with its own colour. */
  const col=b.matches('.bar,.pfull-seg,.pfull-fut')?getComputedStyle(b).backgroundColor:'';
  el.innerHTML=(col&&col!=='rgba(0, 0, 0, 0)'?`<i class="dot" style="--dot:${col}"></i>`:'')+`<span>${esc(b.dataset.tip)}</span>`;
  el.classList.toggle('dark',!!b.closest('#viewer'));
  /* Every tip has the same shape, arrow and all; only a chart's follows the pointer. */
  el.classList.add('pin');
  el.classList.toggle('follow',!pinned(b));
  if(pinned(b))pinTip(b);else placeTip(x,y);
  el.classList.add('on');
}
function hideTip(){
  clearTimeout(tipTimer);tipFor=null;
  const el=tipEl();
  if(el&&el.classList.contains('on')){el.classList.remove('on');tipWarmUntil=Date.now()+500;}
}
function pinTip(b){
  const el=tipEl(),r=b.getBoundingClientRect(),w=el.offsetWidth,h=el.offsetHeight;
  const below=r.bottom+h+14<innerHeight,cx=r.left+r.width/2;
  const left=Math.max(6,Math.min(cx-w/2,innerWidth-w-6));
  el.dataset.side=below?'below':'above';
  el.style.setProperty('--ax',(cx-left)+'px');
  el.style.left=left+'px';el.style.top=(below?r.bottom+10:r.top-h-10)+'px';
}
function placeTip(x,y){
  const el=tipEl();if(!el)return;
  const w=el.offsetWidth,h=el.offsetHeight;
  /* Centred over the pointer, arrow pointing down at it. */
  const left=Math.max(6,Math.min(x-w/2,innerWidth-w-6));
  el.dataset.side='above';
  el.style.setProperty('--ax',Math.max(10,Math.min(x-left,w-10))+'px');
  el.style.left=left+'px';
  el.style.top=Math.max(6,y-h-14)+'px';
}
document.addEventListener('pointerover',e=>{
  const b=e.target.closest('[data-tip]');
  if(b===tipFor)return;
  if(!b){hideTip();return;}
  clearTimeout(tipTimer);
  const x=e.clientX,y=e.clientY,warm=tipEl()?.classList.contains('on')||Date.now()<tipWarmUntil;
  if(!pinned(b)||warm)showTip(b,x,y);
  else{tipFor=b;tipTimer=setTimeout(()=>{if(tipFor===b)showTip(b,x,y);},380);}
});
document.addEventListener('pointermove',e=>{
  const el=tipEl();if(el&&el.classList.contains('on')&&el.classList.contains('follow'))placeTip(e.clientX,e.clientY);
});
document.addEventListener('pointerout',e=>{
  const b=e.target.closest('[data-tip]');
  if(b&&!(e.relatedTarget&&b.contains(e.relatedTarget)))hideTip();
});
document.addEventListener('focusin',e=>{
  const b=e.target.closest&&e.target.closest('[data-tip]');
  if(b&&pinned(b)&&b.matches(':focus-visible'))showTip(b);
});
document.addEventListener('focusout',hideTip);
document.addEventListener('pointerdown',hideTip,true);
addEventListener('scroll',hideTip,{passive:true,capture:true});
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  if(busy&&el.dataset.act!=='escape')return;      /* the lock answers, nothing else */
  const fn=ACTIONS[el.dataset.act];if(!fn)return;
  /* A checkbox needs its own default: preventDefault would revert the tick
     after the handler runs. Everything else is a button or a link. */
  if(el.type!=='checkbox')e.preventDefault();
  fn(el.dataset.val,el,e);
});
document.addEventListener('input',e=>{
  if(!e.target.dataset.ta)return;
  draft=e.target.value;
  if(e.target.id==='ctext'){updateMention(e.target);syncMback(e.target);}
  const b=document.querySelector('[data-act="save"]');
  const has=!!noteWords(draft)||staged.top.length>0;
  if(b){b.disabled=!has;b.classList.toggle('on',has);}
  const d=document.querySelector('.dock');if(d)d.classList.toggle('tall',!!draft.trim());
});
/* Backspace right after a tag takes the whole tag, the way chat apps do. */
function tagBackspace(e){
  const t=e.target;
  if(e.key!=='Backspace'||t.id!=='ctext'||t.selectionStart!==t.selectionEnd)return false;
  const at=t.selectionStart;let pos=0,hit=null;
  for(const sg of mentionSegments(t.value,mentionLabels())){
    if(sg.plantId&&pos+sg.text.length===at){hit={from:pos,to:at};break;}
    pos+=sg.text.length;if(pos>at)break;
  }
  if(!hit)return false;
  t.setRangeText('',hit.from,hit.to,'end');
  t.dispatchEvent(new Event('input',{bubbles:true}));
  return true;
}
document.addEventListener('keydown',e=>{
  if(mentionKey(e)){e.preventDefault();e.stopPropagation();return;}
  if(tagBackspace(e)){e.preventDefault();return;}
  if(e.key==='Escape'){
    if(lockDone){closeSummary();return;}
    if($('#unlock').classList.contains('open'))closeUnlock(null);
    else if($('#picker').classList.contains('open'))closePicker(null);
    else if(viewerOn()||galPlant)stepBack();
    else if(!busy&&V.plant){goTo(null,true);}
    return;
  }
  if((e.metaKey||e.ctrlKey)&&e.key==='Enter'&&e.target.id==='ctext')saveEntry();
  if($('#viewer').classList.contains('on')){
    if(e.key==='ArrowLeft')showViewerAt(viewerIdx-1);
    else if(e.key==='ArrowRight')showViewerAt(viewerIdx+1);
  }
});
$('#ph-input').onchange=async e=>{
  const files=[...e.target.files];e.target.value='';
  if(!files.length)return;
  for(const f of files){
    const blob=await shrink(f);
    staged.top.push({blob,url:URL.createObjectURL(blob)});
  }
  renderAll();
};

/* ================= go ================= */
V.plant=plantFromPath();
if(!calm.matches)document.documentElement.classList.add('pre');
renderAll();
const loading=[
  !forecast||forecast.fetched!==todayISO()?loadWx():null,
  loadStatus().then(async()=>{
    await seedStatus();
    if(V.plant&&!plantById(V.plant)){V.plant=null;history.replaceState({},'','/');}
    syncTitle();renderAll();
  }),
  loadCare().then(renderAll),
  loadEntries().then(renderAll),
  loadPhotos()];
/* The intro waits for the data, but never longer than a moment. */
Promise.race([Promise.allSettled(loading),new Promise(r=>setTimeout(r,1400))]).then(playIntro);
addEventListener('visibilitychange',()=>{
  if(document.hidden)return;
  Promise.all([loadEntries(),loadStatus(),loadCare()]).then(renderAll);
});
/* The lock's clock ticks in place. Rebuilding the lock every second replaced
   "Let me back in" under the pointer and threw keyboard focus away. */
setInterval(()=>{
  if(!busy)return;
  const el=$('#lock .waiting:not(.done)');if(!el){renderLock();return;}
  const secs=Math.round((Date.now()-busyAt)/1000);
  const bar=el.querySelector('.steps b');if(bar)bar.style.width=Math.min(95,8+secs*7)+'%';
  const eta=el.querySelector('.eta');if(eta)eta.textContent=`${secs} s · the care guidance is updated after this`;
  if(secs>15&&!el.querySelector('.out'))el.insertAdjacentHTML('beforeend','<button class="out" data-act="escape">Let me back in</button>');
},1000);

</script>
</body>
