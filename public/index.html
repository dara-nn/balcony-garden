<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dara's Balcony Garden, Tampere</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231E4D3B'/%3E%3Cpath d='M32 52V30' stroke='%23EAF0E9' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M32 36c-11 0-17-6-17-15 10 0 17 6 17 15z' fill='%237FBFA0'/%3E%3Cpath d='M32 32c0-10 6-17 16-17 0 10-6 17-16 17z' fill='%23EAF0E9'/%3E%3C/svg%3E">

<meta name="theme-color" content="#1E4D3B">
<!-- Two faces from Google Fonts in one request. Young Serif is the display
     face for titles and highlights, single weight, 400 only. Shantell Sans is
     the hand the journal entries are set in, also 400 only. Preconnect so the
     woff2 is not stuck behind a cold DNS and TLS handshake after the
     stylesheet lands. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shantell+Sans:wght@400&family=Young+Serif&display=swap">
<script>try{var _t=JSON.parse(localStorage.getItem('theme')||'null');if(_t)document.documentElement.dataset.theme=_t;}catch(e){}</script>
<style>
  /* ============================================================
     Daran parvekepuutarha, the chart direction.

     Soft, rounded, and organised by colour rather than by rules. Every plant
     owns the background colour of its own illustration, and that colour washes
     the whole row, chip and tile that belong to it, so the page is legible as a
     garden before it is read as an interface. Nothing shouts in capitals.

     UI       Avenir Next  , the site's own voice
     Prose    Charter      , what the model writes, in something you read
     Display  Young Serif  , titles and the one number worth looking at
     Hand     Shantell Sans, the journal, because those words are mine
     ============================================================ */
  :root{
    --paper:#EFF2EA; --field:#FFFFFF; --ink:#17211B; --dim:#6C7A70; --rule:#E1E7DA;
    --pine:#1E4D3B; --leaf:#3E7D5C; --tomato:#C4462C; --water:#2F6E8F; --pollen:#B0810F;
    /* The season phases, seedling first. Mid tones, so the bar reads as a
       calm timeline rather than a heavy stripe, and a step apart in hue and
       lightness so two phases that touch are still two. Seedling is the
       palest, a sand that sits before the greens. Expected is a pale tint of
       the same hue, mixed in the bar rules below. */
    --ph-seed:#D9D2A6; --ph-grow:#92C6A4; --ph-flower:#E394AC; --ph-fruit:#EDA55E; --ph-harvest:#DB7054;
    --ph-tint:42%;
    --ui:"Avenir Next","Avenir","Segoe UI",system-ui,sans-serif;
    --prose:"Charter","Iowan Old Style","Georgia",serif;
    --display:"Young Serif","Charter","Iowan Old Style","Georgia",serif;
    --hand:"Shantell Sans","Avenir Next",system-ui,sans-serif;
    /* One ladder for every size on the site. 1.125, a major second, stepped
       off a 16px reading base and rounded to whole pixels, because half
       pixels were how 15.5 and 14.5 and 13.5 got here in the first place.
       Two rungs rounded onto 13 and 14, which are the same size to a reader,
       so the lower one is pulled down to 12 and the ladder stays countable.
       t1 eyebrows and ticks, t2 meta and captions, t3 the UI default,
       t4 reading prose, t5 sub-heads, t6 area heads, t7 section titles and
       the one number worth looking at, t8 the masthead. Nothing off it. */
    --t1:11px; --t2:12px; --t3:14px; --t4:16px;
    --t5:18px; --t6:20px; --t7:23px; --t8:29px;
    --s1:4px; --s2:8px; --s3:12px; --s4:18px; --s5:28px; --s6:44px;
    --r-lg:20px; --r-md:14px; --r-sm:10px; --r-pill:999px;
    --tint:#9BC7AA;
    --wash:color-mix(in srgb,var(--tint) 16%,var(--field));
    --shadow:0 2px 10px rgba(22,40,28,.05);
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){
      --paper:#0F140F; --field:#19201A; --ink:#E7EEE4; --dim:#8B9A8C; --rule:#27302A;
      --pine:#8FCBA9; --leaf:#7FBFA0; --tomato:#EF7355; --water:#7BB9DB; --pollen:#DDB059;
      --ph-seed:#D6CFA4; --ph-grow:#9BC7AA; --ph-flower:#DDA0B4; --ph-fruit:#E79A4E; --ph-harvest:#CC5438;
      --shadow:0 2px 12px rgba(0,0,0,.3);
      --wash:color-mix(in srgb,var(--tint) 20%,var(--field));
    }
  }
  :root[data-theme="dark"]{
    --paper:#0F140F; --field:#19201A; --ink:#E7EEE4; --dim:#8B9A8C; --rule:#27302A;
    --pine:#8FCBA9; --leaf:#7FBFA0; --tomato:#EF7355; --water:#7BB9DB; --pollen:#DDB059;
    --ph-seed:#D6CFA4; --ph-grow:#9BC7AA; --ph-flower:#DDA0B4; --ph-fruit:#E79A4E; --ph-harvest:#CC5438;
    --shadow:0 2px 12px rgba(0,0,0,.3);
    --wash:color-mix(in srgb,var(--tint) 20%,var(--field));
  }

  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html,body{margin:0}
  body{background:var(--paper);color:var(--ink);font:var(--t3)/1.5 var(--ui);-webkit-text-size-adjust:100%}
  button{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--leaf);outline-offset:2px}
  .vhid{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.01em}

  #root{container-type:inline-size;position:relative;margin:0 auto;background:var(--paper)}

  .page{max-width:1120px;margin:0 auto;padding:var(--s5) var(--s6) var(--s6)}
  @container (max-width:899px){ .page{padding:var(--s4) var(--s4) var(--s5)} }
  @container (max-width:560px){ .page{padding:var(--s3) var(--s3) var(--s4)} }

  /* ---- masthead ---- */
  .mast{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s4)}
  /* The display face at its own size. Young Serif is single weight, so 400 is
     stated to stop a faux bold, the sans tracking is zeroed because it was cut
     for a different face, and the leading closes to the 1.11 of the specimen. */
  .mast h1{font-family:var(--display);font-size:clamp(var(--t7),3vw,var(--t8));
    font-weight:400;line-height:1.12;letter-spacing:0}
  /* The title and the sentence under it are one block, so the freshness note
     still sits at the far end of the row rather than under the paragraph. */
  .mast .mtitle{flex:1 1 48ch;min-width:0}
  .mast .blurb{margin:var(--s2) 0 0;max-width:80ch;font-size:var(--t3);
    line-height:1.5;color:var(--dim)}

  /* ---- a section is a card ---- */
  .sect{background:var(--field);border:1px solid var(--rule);border-radius:var(--r-lg);
    padding:var(--s4) var(--s4) var(--s5);margin-bottom:var(--s6);box-shadow:var(--shadow)}
  .sect:last-child{margin-bottom:0}
  .sect > .hd{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;
    padding-bottom:var(--s3);margin-bottom:var(--s4);border-bottom:2px solid var(--ink)}
  /* Same face one step down. A point smaller than the sans it replaces, since
     the large x-height already reads bigger at the same nominal size. */
  .sect > .hd h2{font-family:var(--display);font-size:var(--t7);
    font-weight:400;line-height:1.18;letter-spacing:0}
  .sect > .hd .meta{margin-left:auto;font-size:var(--t2);color:var(--dim)}
  .sect > .hd .meta b{font-weight:600;color:var(--tomato)}
  /* the plant list: one row per plant, status in words, season bar, guidance */
  /* One column for the names, so every bar starts and ends at the same x and
     the month scale above them lines up with all of them. */
  .sect{--namecol:300px}
  .prow{padding:var(--s2) 0;border-bottom:1px solid var(--rule)}
  .phead{display:grid;grid-template-columns:var(--namecol) 1fr;align-items:center;gap:var(--s2)}
  .pname{display:flex;align-items:baseline;flex-wrap:wrap;gap:var(--s1) var(--s2);background:none;
    border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:left;min-width:0}
  /* The drawing identifies the plant, it does not rank it, so it is sized to
     sit beside the name rather than to outweigh it. */
  .pname .art{align-self:center;width:26px;height:26px;flex:none;overflow:hidden;
    border-radius:var(--r-pill)}
  .pname .art svg{width:100%;height:100%;display:block}
  /* The plant name is the card's title, and now the heaviest thing in it. The
     b was carrying a browser bold the single-weight face cannot serve, so
     weight is pinned to 400. */
  .pname b{font-family:var(--display);font-size:var(--t5);font-weight:400;
    line-height:1.25;letter-spacing:0}
  .pname em{font-style:normal;color:var(--dim);font-size:var(--t2)}
  em.ptag-phase{align-self:center;font-style:normal;font-size:var(--t2);font-weight:600;
    line-height:1.3;padding:2px var(--s2);border-radius:var(--r-pill);white-space:nowrap;
    background:color-mix(in srgb,var(--c) 30%,var(--field));
    color:color-mix(in srgb,var(--c) 40%,var(--ink))}
  .water{color:var(--dim)}
  .wline>span{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
  .waterbtn{display:inline-flex;align-items:center;gap:var(--s1);border:1px solid var(--rule);
    background:var(--paper);border-radius:var(--r-pill);padding:var(--s1) var(--s3);cursor:pointer;
    font:inherit;font-size:var(--t2);color:var(--ink)}
  .waterbtn:hover,.waterbtn:focus-visible{border-color:var(--water);color:var(--water)}
  .photobtn{display:inline-flex;align-items:center;gap:var(--s2);border:1px solid var(--rule);
    background:var(--paper);border-radius:var(--r-pill);padding:var(--s2) var(--s4);cursor:pointer;
    font:inherit;font-size:var(--t3);color:var(--ink)}
  .photobtn:hover,.photobtn:focus-visible{border-color:var(--leaf);color:var(--pine)}
  /* Two paragraphs that read differently: what it is doing, then what to do.
     The label sits above its text rather than in a column beside it, so both
     paragraphs start at the same x AND wrap at the same measure, and neither
     one can look indented next to the other. */
  .status,.guide,.wline{display:grid;grid-template-columns:1fr;gap:var(--s1);
    margin:0;font-size:var(--t3);line-height:1.5}
  .wline{margin-top:var(--s3)}
  /* .32em, not a spacing step: it is what drops a 11px eyebrow onto the same
     baseline as the sentence beside it when the two do share a line. */
  .lbl{font-size:var(--t1);letter-spacing:.09em;text-transform:uppercase;font-weight:600;
    color:var(--dim);padding-top:0}
  .status,.guide,.wline{grid-template-rows:auto auto}
  .status{color:var(--dim)}
  .status>span{color:var(--ink)}
  .guide{color:var(--ink)}
  .legend{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;
    margin:0 0 var(--s3);padding:0 var(--s4);font-size:var(--t2);color:var(--dim)}
  .legend span{display:flex;align-items:center;gap:var(--s1)}

  .sw{width:14px;height:6px;border-radius:3px;display:inline-block}
  /* Each phase names its colour once as --c, so solid and expected are the
     same hue by construction and only the tint differs. */
  .seed{--c:var(--ph-seed)} .grow{--c:var(--ph-grow)} .flower{--c:var(--ph-flower)}
  .fruit{--c:var(--ph-fruit)} .harvest{--c:var(--ph-harvest)}
  .sw.seed,.sw.grow,.sw.flower,.sw.fruit,.sw.harvest{background:var(--c)}
  /* Expected stands for all four phases at once, so it is the same tint of
     a neutral rather than of any one colour. */

  .chart{min-width:0}

  /* Two plants to a row. A plant needs a name, a bar and two short paragraphs,
     so a whole page width each wastes half of it and doubles the scroll. The
     page is 1120px less its gutters, which is room for exactly two columns and
     never three, so every bar keeps the same width. In the narrower cell the
     name sits above the chart instead of beside it. */
  .plist{display:grid;gap:var(--s4);margin:0 0 var(--s6);
    grid-template-columns:repeat(auto-fill,minmax(min(430px,100%),1fr))}
  /* ---- the plant card ----
     Four bands, and the gaps do the grouping. The name and the year belong to
     each other, so s3 between them and nothing else inside that block. The
     two sentences the model wrote are a pair of their own, s4 below the year.
     The water row is the only thing here you can press, so a rule fences it
     off from everything you only read.

     Five treatments, not one: the name in the display face, the year as a
     ribbon, the status in the UI face at UI size, the care in the reading
     face one step up on a tinted band, and the water line small and quiet.
     A card you can scan rather than a card you have to read. */
  .plist .phead{grid-template-columns:1fr;gap:var(--s3)}
  /* The plant is the card now. Nothing wraps the grid any more, so the card
     takes the field colour and the lift the old section card used to have,
     and it sits straight on the paper. overflow so the care band can run to
     the card's own edge. */
  .plist .prow{display:flex;flex-direction:column;padding:var(--s4);background:var(--field);
    overflow:hidden;border:1px solid var(--rule);border-radius:var(--r-lg);box-shadow:var(--shadow)}
  .plist .status{margin-top:var(--s4)}
  /* Care is the sentence to act on. It takes the tint, the reading face and
     the full width of the card: a band of the card rather than a box wedged
     between two loose lines, which is what an inset panel looked like. */
  .plist .guide{margin:var(--s4) 0 0;padding:0 0 0 var(--s3);
    border-left:2px solid color-mix(in srgb,var(--leaf) 55%,transparent)}
  .plist .guide > span{font-family:var(--prose);font-size:var(--t3);line-height:1.55}
  .plist .guide .lbl{color:var(--pine)}
  /* The action, fenced off from the reading. auto on the top so that in a
     row of two the shorter card puts its water line on the same bottom edge
     as the taller one, instead of leaving the card empty underneath it. */
  /* The bottom margin eats into the card's s4 padding down to s3, so the
     row has the same s3 above and below its content. */
  .plist .wline{display:flex;align-items:center;gap:var(--s3);
    margin:auto calc(-1 * var(--s4)) calc(var(--s3) - var(--s4));
    padding:var(--s3) var(--s4) 0;border-top:1px solid var(--rule);font-size:var(--t2)}
  .plist .wline .lbl{display:none}
  .wline .ago,.wline .water,.wline .waterbtn{font-size:var(--t2);line-height:1.4}
  .wline .ago,.wline .water{color:var(--dim)}
  .plist .wline > span{flex:1;display:flex;align-items:center;gap:var(--s3)}
  .plist .wline .water{margin-left:auto}
  /* The water row's top margin is auto, which collapses to nothing once the
     card is full, so the last paragraph was landing on the rule. This is the
     floor under it, whether care or status is the one that ends the card. */
  .plist .prow > p:last-of-type{margin-bottom:var(--s4)}
  /* The area name labels the grid under it from the page itself: no box, no
     rule, nothing that would read as a second card around the plants. */
  .areahd{display:flex;align-items:baseline;gap:var(--s2);flex-wrap:wrap;
    margin:0 0 var(--s3)}
  .areahd h2{font-family:var(--display);font-size:var(--t6);
    font-weight:400;line-height:1.2;letter-spacing:0}
  /* The count is a label, not a title, so it goes back to the UI face. */
  .areahd > span{font-family:var(--ui);font-size:var(--t3);font-weight:400;letter-spacing:0;color:var(--dim)}
  /* The reading takes the empty end of the area heading row. It wraps to its
     own line before it would squeeze the area name. */
  .wxnow{margin-left:auto;display:flex;align-items:baseline;gap:var(--s3);
    flex-wrap:wrap;font-size:var(--t3);color:var(--dim)}
  .wxnow .deg{font-family:var(--display);font-size:var(--t7);font-weight:400;
    line-height:1.1;letter-spacing:0;color:var(--ink)}
  .wxnow .deg.hot{color:var(--tomato)} .wxnow .cold{color:var(--water)}
  /* The forecast reads for the balcony only, so it stands on its own above
     the balcony plants instead of boxing them in. */
  /* Only as wide as it needs to be, so a one line warning does not draw a
     band across the page. */
  /* The warning hangs off the reading it came from: right aligned under it,
     with a tail up into it, so it reads as the forecast speaking rather than
     as a banner that turned up on its own. */
  .wxalerts{position:relative;display:flex;flex-direction:column;align-items:flex-end;
    gap:var(--s2);margin:var(--s2) 0 var(--s3)}
  .wxalerts .warn{position:relative;max-width:min(100%,56ch);margin:0}
  @container (max-width:640px){
    .wxnow{margin-left:0;width:100%}
    .wxalerts{align-items:flex-start}
    .wxalerts .warn,.wtyping{border-radius:4px 16px 16px 16px}
    .wtyping{right:auto;left:0}
  }
  /* The legend is reference, not content: once at the top, flush with the
     cards now that no card padding is left to line it up with. */
  .lgd-row .legend{margin:0 0 var(--s3);padding:0 0 0 var(--s4)}
  /* One tooltip for the whole page, in place of the browser's slow grey one,
     and one shape for it: a small rounded box with an arrow pointing at what
     it describes. Over a chart it sits centred above the pointer and follows
     it; over a button it hangs under the button. A season segment puts its own
     colour in a dot at the front, so the bubble says which phase before it
     says a word. It pops out of its tail with a little overshoot, and on the
     dark photo view it turns light so it can still be seen. */
  #tip{position:fixed;left:0;top:0;z-index:60;pointer-events:none;opacity:0;
    display:flex;align-items:center;gap:6px;max-width:240px;
    background:var(--ink);color:var(--paper);font-size:var(--t2);line-height:1.3;
    padding:var(--s1) var(--s2);border-radius:var(--r-sm);
    box-shadow:0 6px 18px rgba(0,0,0,.18);transform-origin:0 100%;transform:translateY(4px) scale(.7);
    transition:opacity .1s ease,transform .22s cubic-bezier(.34,1.56,.64,1)}
  #tip.on{opacity:1;transform:none}
  #tip .dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--dot);
    box-shadow:0 0 0 2px color-mix(in srgb,var(--paper) 30%,transparent)}
  #tip.pin{padding:var(--s1) var(--s3);transform-origin:var(--ax,50%) 0;transform:translateY(-4px) scale(.7)}
  #tip.pin[data-side="above"]{transform-origin:var(--ax,50%) 100%;transform:translateY(4px) scale(.7)}
  #tip.pin.on{transform:none}
  #tip.pin::after{content:"";position:absolute;left:var(--ax,50%);width:8px;height:8px;background:inherit;
    border-radius:1px;transform:translateX(-50%) rotate(45deg)}
  #tip.pin[data-side="below"]::after{top:-4px}
  #tip.pin[data-side="above"]::after{bottom:-4px}
  #tip.dark{background:#EAF0EA;color:#0B0F0C;box-shadow:0 6px 18px rgba(0,0,0,.5)}
  @media (prefers-reduced-motion:reduce){ #tip,#tip.pin,#tip.pin[data-side="above"]{transform:none;transition:opacity .08s} }
  .prow .track .bar{cursor:default}
  /* The scale is the chart's label, so it is read at full strength rather
     than ghosted under it. */
  .monthscale{position:relative;height:1.05em;margin:0 0 var(--s1);font-size:var(--t1);color:var(--dim)}
  .monthscale b{position:absolute;font-weight:400;transform:translateX(-50%)}
  /* 6px read as a divider rule rather than as data. Nine is a ribbon: still
     one line of the card, but unmistakably a measured thing. The segments
     stay square and the track clips them, so the year is one continuous band
     instead of a row of separate lozenges. */
  /* The empty track is quieter than any expected tint, so the end of the
     season is still visible. Only the track is rounded: the phases inside it
     are square and meet on a straight join. */
  .prow .track{position:relative;height:9px;border-radius:var(--r-pill);
    background:color-mix(in srgb,var(--rule) 55%,var(--field))}
  .sect>.prow:first-of-type{padding-top:0}
  /* min-width keeps a phase the plant passed through in a day from vanishing
     off the bar while the dated list still lists it. */
  .prow .track .bar{position:absolute;top:0;height:100%;min-width:2px;background:var(--c)}
  .prow .track .bar.first{border-radius:var(--r-pill) 0 0 var(--r-pill)}
  .prow .track .bar.last{border-radius:0 var(--r-pill) var(--r-pill) 0}
  .prow .track .bar.first.last{border-radius:var(--r-pill)}
  /* One colour per phase, past and future alike, so today is the only thing
     that splits them and has to carry that on its own: taller than the bar,
     with a ring of card colour so it stands clear of any phase it crosses. */
  .prow .track .tline{position:absolute;top:-4px;width:3px;height:17px;margin-left:-1.5px;
    background:var(--ink);border-radius:2px;box-shadow:0 0 0 2px var(--field);z-index:1}

  .striplabel{align-self:center;padding:0 var(--s2);font-size:var(--t2);color:var(--dim)}
  /* Every other breakpoint in here asks the page container, not the window,
     so these do too: the phone preview is then the same page a phone gets. */
  @container (max-width:760px){
    .sect{--namecol:1fr}
    .phead{grid-template-columns:1fr;gap:var(--s3)}
  }

  /* ---- the journal ----
     A spine down the left carries the season: each entry's dot takes the colour
     of the phase the plant was in that day, the same colours as the charts.

     The entry text is the one thing on this site I wrote myself, so it is set
     in a hand. Shantell Sans, not a script: it keeps a sans skeleton and its
     figures stay crisp, which matters because these notes carry volumes,
     times and temperatures. Only the sentence gets it. Dates, tags, month
     headings and controls stay in the UI face, or the page turns into a
     scrapbook and nothing is findable. */
  .jmonth{position:relative;font-size:var(--t2);letter-spacing:.02em;color:var(--dim);
    margin:0;padding:var(--s4) 0 var(--s2) calc(var(--jrail) + var(--s3))}
  .jmonth:first-of-type{padding-top:var(--s2)}

  .jlist{--jrail:88px;list-style:none;margin:0;padding:0}
  .sect{--jrail:88px}
  .jent{position:relative;display:grid;grid-template-columns:var(--jrail) 1fr;
    gap:var(--s3);padding:0 0 var(--s4)}
  .jent::before{content:"";position:absolute;left:calc(var(--jrail) + 5px);top:.75em;bottom:0;
    width:2px;background:var(--rule)}
  /* Each month has its own line, which stops short of the next month's
     heading. Its last entry, or its only one, ends in the same short tail,
     so every month closes the same way whatever it holds. */
  .jent:last-child::before{bottom:auto;height:var(--s5)}
  .jent::after{content:"";position:absolute;left:var(--jrail);top:calc(.75em - 5px);
    width:12px;height:12px;border-radius:50%;background:var(--dim);
    box-shadow:0 0 0 3px var(--field)}
  .jent.ph-seed::after{background:var(--ph-seed)}
  .jent.ph-grow::after{background:var(--ph-grow)}
  .jent.ph-flower::after{background:var(--ph-flower)}
  .jent.ph-fruit::after{background:var(--ph-fruit)}
  .jent.ph-harvest::after{background:var(--ph-harvest)}
  /* .15em, not a spacing step: it drops the date onto the first baseline of
     the entry beside it, which is a type measurement, not a gap. */
  .jdate{text-align:right;font-size:var(--t2);color:var(--dim);padding-top:.15em;white-space:nowrap}
  .jbody{padding-left:var(--s3);min-width:0}
  .jbody .prose{margin:0;max-width:60ch;font-family:var(--hand);
    font-size:var(--t4);line-height:1.7;letter-spacing:.005em}
  .aside{margin:var(--s1) 0 0;font-size:var(--t2);color:var(--dim);font-style:italic;max-width:60ch}
  /* controls stay out of the way until you reach for them */
  .jbody .entry-acts{opacity:0;transition:opacity .12s;margin-top:var(--s1)}
  .jent:hover .entry-acts,.jbody:focus-within .entry-acts{opacity:1}
  @media (hover:none){.jbody .entry-acts{opacity:1}}
  /* a plant named in an entry, standing in for its name */
  /* A tag stands in for a plant's name mid-sentence, so it has to sit on the
     line like a word, not float above it like a button. */
  .ptag{display:inline-flex;align-items:center;gap:var(--s1);vertical-align:-.18em;
    border:1px solid var(--rule);background:var(--paper);border-radius:var(--r-pill);
    /* The pill's own padding is optical, it hugs a 15px avatar and a word,
     and its size rides the sentence it is sitting in. */
    padding:0 7px 0 2px;margin:0 1px;line-height:1.35;font:inherit;font-size:.82em;
    cursor:pointer;color:inherit;font-family:var(--ui)}
  .ptag .av{width:15px;height:15px;flex:none;overflow:hidden;border-radius:var(--r-pill)}
  .ptag .av svg{width:100%;height:100%;display:block}
  .ptag:hover,.ptag:focus-visible{border-color:var(--leaf);background:var(--field)}
  @container (max-width:560px){
    .jlist,.sect{--jrail:0px}
    .jent{grid-template-columns:1fr;gap:var(--s1)}
    .jent::before,.jent::after{display:none}
    .jdate{text-align:left}
    .jbody{padding-left:0;border-left:2px solid var(--rule);padding-left:var(--s3)}
    .jmonth{padding-left:0}
    .jbody .entry-acts{opacity:1}   /* never strand the controls on a small screen */
  }

  /* ---- the variety page: text left, pictures in a narrow column ---- */
  .wiki{display:grid;grid-template-columns:1fr 260px;gap:var(--s5)}
  .wtext .prose{max-width:62ch}
  .facts{display:grid;grid-template-columns:auto 1fr;gap:var(--s2) var(--s4);margin:var(--s4) 0 0;
    font-size:var(--t3);border-top:1px solid var(--rule);padding-top:var(--s3)}
  .facts dt{color:var(--dim)}
  .facts dd{margin:0}
  .facts dd a{color:var(--ink);text-decoration:underline;text-underline-offset:2px;
    text-decoration-color:var(--rule)}
  .facts dd a:hover{text-decoration-color:var(--leaf)}
  .wpics{display:flex;flex-direction:column;gap:var(--s3)}
  .wpics figure{margin:0}
  .wpics img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:var(--r-md);
    border:1px solid var(--rule);display:block}
  .wpics figcaption{margin-top:var(--s1);font-size:var(--t2);color:var(--dim)}
  .wpics figcaption i{font-style:normal;opacity:.65;white-space:nowrap}
  @container (max-width:760px){
    .wiki{grid-template-columns:1fr;gap:var(--s4)}
    .wpics{flex-direction:row}
    .wpics figure{flex:1 1 0;min-width:0}
  }

  /* ---- the nav: it governs the whole page, so it sits above the whole page ---- */
  /* Every plant is reachable without scrolling sideways, so the strip wraps.
     It gives up stickiness once it is more than a couple of rows tall, rather
     than eating the screen on a phone. */
  .nav{position:sticky;top:0;z-index:15;background:var(--paper);margin:0 0 var(--s4);
    padding:var(--s2) 0;border-bottom:1px solid var(--rule)}
  @container (max-width:760px){.nav{position:static}}
  /* The 4px of padding is room for a focus ring, not a gap. */
  .strip{display:flex;flex-wrap:wrap;gap:var(--s2);padding:var(--s1)}
  .chip{display:inline-flex;align-items:center;gap:var(--s2);flex:none;border:1px solid var(--rule);
    background:var(--field);border-radius:var(--r-pill);padding:var(--s1) var(--s3) var(--s1) var(--s1);
    cursor:pointer;min-height:32px;font-size:var(--t3);white-space:nowrap}
  .chip .av{width:24px;height:24px;flex:none;overflow:hidden;border-radius:var(--r-pill)}
  .chip .av svg{width:100%;height:100%;display:block}
  .chip:hover{border-color:var(--leaf)}
  .chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:600}
  .chip.all{padding:var(--s1) var(--s4)}

  /* ---- the season bar ---- */
  @keyframes settle{0%{transform:scale(1.01)}100%{transform:none}}
  .prow.touched{animation:settle .7s ease-out;background:color-mix(in srgb,var(--leaf) 10%,transparent)}
  .track{position:relative;display:block;height:10px;background:color-mix(in srgb,var(--ink) 8%,transparent);
    border-radius:var(--r-pill);overflow:hidden}
  .bar{position:absolute;top:0;height:100%}
  .bar.grow{background:var(--ph-grow)} .bar.flower{background:var(--ph-flower)}
  .bar.fruit{background:var(--ph-fruit)} .bar.harvest{background:var(--ph-harvest)}

  .legend{display:flex;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s3);font-size:var(--t2);color:var(--dim)}
  .legend i{display:inline-block;width:18px;height:8px;border-radius:var(--r-pill);margin-right:var(--s2);vertical-align:0}

  /* ---- prose the model wrote ---- */
  p.prose{font-family:var(--prose);font-size:var(--t4);line-height:1.6;margin:0 0 var(--s3);max-width:62ch}

  /* ---- buttons ---- */
  .tick{border:1px solid var(--leaf);color:var(--leaf);background:var(--field);border-radius:var(--r-pill);
    font-size:var(--t2);padding:var(--s2) var(--s3);cursor:pointer;white-space:nowrap;flex:none}

  /* ---- weather ----
     The reading rides the area heading (see .wxnow). All that is left here is
     the alert: a line, not a card. The warning and the reason sit on the same
     line and wrap together, so a cold night costs one row instead of a block. */
  /* The alert is the forecast talking: a chat bubble under the reading, its
     one sharp corner the tail pointing up at it, with the weather as the
     sender's avatar. The headline is in the journal's hand, the reason under
     it a size down, so a cold night is two short lines, not a banner. */
  /* A stronger tint than the page's own washes plus a hairline in the same
     hue, so the bubble stands off the paper instead of melting into it. */
  .warn{--hue:var(--tomato);--bub:color-mix(in srgb,var(--hue) 22%,var(--field));
    display:flex;align-items:flex-start;gap:var(--s2);background:var(--bub);
    border:1px solid color-mix(in srgb,var(--hue) 40%,transparent);
    border-radius:16px 4px 16px 16px;padding:8px 14px 9px 8px;font-size:var(--t2);line-height:1.4;
    box-shadow:0 3px 10px color-mix(in srgb,var(--hue) 18%,transparent)}
  .warn.cold{--hue:var(--water)}
  .warn .wav{flex:none;width:26px;height:26px;border-radius:50%;background:var(--field);
    display:grid;place-items:center;font-size:14px;line-height:1;box-shadow:0 1px 3px rgba(0,0,0,.12)}
  .warn .wmsg{margin:0;min-width:0}
  .warn b{display:block;font-family:var(--hand);font-size:var(--t3);font-weight:600;line-height:1.3;
    color:color-mix(in srgb,var(--hue) 80%,var(--ink))}
  .warn .wmsg span{display:block;margin-top:1px;color:color-mix(in srgb,var(--ink) 75%,var(--hue))}
  /* The "typing" bubble the forecast shows before it speaks, first visit only. */
  .wtyping{position:absolute;top:0;right:0;display:flex;gap:4px;padding:11px 13px;
    background:color-mix(in srgb,var(--water) 22%,var(--field));border:1px solid color-mix(in srgb,var(--water) 40%,transparent);
    border-radius:16px 4px 16px 16px}
  .wtyping i{width:6px;height:6px;border-radius:50%;background:var(--dim)}

  /* ---- photos ---- */
  .shots{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:var(--s2)}
  .shots button{padding:0;border:none;border-radius:var(--r-md);overflow:hidden;background:var(--wash);
    cursor:pointer;aspect-ratio:1;position:relative;display:block}
  .shots svg{width:100%;height:100%;display:block}

  /* ---- notes ---- */
  .note{padding:var(--s3) 0;border-top:1px solid var(--rule)}
  .note .prose{margin-bottom:var(--s2)}
  .note .prose:last-child{margin-bottom:0}

  .none{color:var(--dim);font-size:var(--t3);font-family:var(--prose);font-style:italic;padding:var(--s2) 0}

  /* ---- the composer ---- */
  .dock{margin:0 0 var(--s5)}
  .dock .box{background:var(--field);border:1px solid var(--rule);border-radius:var(--r-lg);
    overflow:visible;transition:border-color .15s ease}
  .dock:focus-within .box{border-color:var(--leaf);box-shadow:0 0 0 3px color-mix(in srgb,var(--leaf) 14%,transparent)}
  .dock .top{display:flex;align-items:center;gap:var(--s2);padding:var(--s3) var(--s4);font-size:var(--t2);color:var(--dim)}
  .dock .in{padding:0 var(--s4) var(--s3)}
  .dock textarea{width:100%;min-height:52px;resize:none;font:inherit;
    font-family:var(--hand);font-size:var(--t4);line-height:1.6;color:var(--ink);
    background:none;border:none;padding:0 0 var(--s2);transition:min-height .16s ease}
  .dock textarea:focus{outline:none}
  .dock:focus-within textarea,.dock.tall textarea{min-height:104px}
  .dock .acts{display:flex;align-items:center;gap:var(--s2)}
  .dock .acts .sp{flex:1}
  .dock .acts button{border:1px solid var(--rule);background:var(--field);border-radius:var(--r-pill);
    padding:var(--s2) var(--s4);cursor:pointer;font-size:var(--t3)}
  .dock .acts .save{border-color:var(--leaf);color:var(--leaf)}
  .dock .acts .save:disabled{opacity:.35;cursor:default}
  .dock .acts .save.on{background:var(--leaf);color:#fff;border-color:var(--leaf)}

  /* ---- prints ----
     A photo is a print taped to the page: a white border with a deeper chin
     for the date, a slight tilt, and a strip of tape across the top edge. The
     print stays white in the dark theme too, the way a real print would. */
  :root{--print:#FBFAF6;--tape:color-mix(in srgb,#E9DDB4 72%,transparent)}
  .snap{position:relative;display:block;padding:6px 6px 0;border:0;background:var(--print);
    cursor:zoom-in;transform:rotate(var(--tilt,2deg));box-shadow:0 1px 2px rgba(0,0,0,.12),0 6px 16px rgba(22,40,28,.14);
    transition:transform .18s ease}
  .snap:hover,.snap:focus-visible{transform:rotate(0deg) scale(1.03)}
  .snap img{display:block;width:100%;aspect-ratio:1;object-fit:cover;background:var(--wash)}
  /* The date is written on the chin in pen: dark ink, a touch crooked, with
     room above and below it rather than squeezed against the photo. */
  .snap{--chin:26px}
  .snap .cap{display:block;height:var(--chin);line-height:var(--chin);text-align:center;font-family:var(--hand);
    font-size:var(--t2);color:#2F3A33;transform:rotate(-1.5deg)}
  .snap::before{content:"";position:absolute;z-index:1;top:-9px;left:50%;width:58%;height:20px;
    transform:translateX(-50%) rotate(calc(var(--tilt,2deg) * -1.5));background:var(--tape);
    box-shadow:0 1px 1px rgba(0,0,0,.06);
    /* torn ends */
    clip-path:polygon(0 8%,4% 0,8% 10%,12% 2%,88% 2%,92% 12%,96% 0,100% 8%,100% 92%,96% 100%,92% 90%,88% 98%,12% 98%,8% 88%,4% 100%,0 92%)}

  /* On the card: the newest print sits to the right of the two sentences and
     the text runs round it, so the bars above keep their full, shared width. */
  .plist .prow{overflow:visible}
  .pbody{display:flow-root}
  .plist .pbody{margin-bottom:var(--s4)}
  .plist .prow > p:last-of-type{margin-bottom:0}
  /* s5 on top is s4, the step every block under the bar takes, plus the
     tape's overhang, so the tape's top edge lines up with the STATUS label
     instead of pressing on the bar. s5 at the side because a tilted print
     needs more air than a straight text edge. */
  .pbody > .snap{float:right;width:118px;margin:var(--s5) 0 var(--s3) var(--s5)}
  @container (max-width:560px){ .pbody > .snap{width:96px} }

  /* On the plant page: the whole pile beside the two sentences. */
  .pfull-body{display:grid;grid-template-columns:minmax(0,66ch) auto;justify-content:space-between;
    gap:var(--s5);align-items:start;margin:var(--s5) 0 0}
  .pfull-body .pfull-say{margin:0}
  /* s5 under the pile, because the tilted prints behind reach lower than the top one. */
  .stack{display:flex;flex-direction:column;align-items:center;gap:var(--s5);padding:var(--s3) var(--s4) 0 var(--s2)}
  .pile{position:relative;width:188px}
  .pile .under{position:absolute;inset:0;background:var(--print);padding:8px 8px 0;box-shadow:0 1px 2px rgba(0,0,0,.12),0 4px 12px rgba(22,40,28,.12);
    transition:transform .22s ease}
  .pile .under img{display:block;width:100%;aspect-ratio:1;object-fit:cover;filter:saturate(.8)}
  .pile .snap{--tilt:-1.5deg;--chin:40px;padding:8px 8px 0}
  .pile .snap .cap{font-size:var(--t3)}
  /* The deepest print leans left, the next one right, so both edges show. */
  .pile .u0{transform:rotate(-7deg) translate(-10px,6px)}
  .pile .u1{transform:rotate(5deg) translate(9px,2px)}
  .pile:hover .u0{transform:rotate(-12deg) translate(-26px,8px)}
  .pile:hover .u1{transform:rotate(10deg) translate(24px,2px)}
  /* A link, not a caption: in the UI face so it cannot be read as writing on the print. */
  .stack-n{border:0;background:none;padding:var(--s1) var(--s2);cursor:pointer;font-family:var(--ui);
    font-size:var(--t2);color:var(--pine);text-decoration:underline;text-underline-offset:3px;
    text-decoration-color:color-mix(in srgb,var(--pine) 40%,transparent)}
  .stack-n:hover{text-decoration-color:currentColor}
  @container (max-width:760px){
    .pfull-body{grid-template-columns:1fr}
    .stack{order:-1;padding:var(--s3) 0 0}
    .pile{width:160px}
  }

  /* ---- tags on a note ----
     Tags come from @names in the text. A small list under the caret offers
     the names to pick from. */
  /* The date chip: reads "Today" until a past day is picked, then shows that
     day in the pollen colour so a backdated note cannot go unnoticed. The
     real date input sits invisibly over it and opens the calendar. */
  .ndate{position:relative;display:inline-flex;align-items:center;border:1px solid var(--rule);
    border-radius:var(--r-pill);padding:2px var(--s2);color:var(--ink);cursor:pointer;font-size:var(--t2)}
  .ndate:hover,.ndate:focus-within{border-color:var(--leaf)}
  .ndate.past{border-color:var(--pollen);color:var(--pollen);font-weight:600}
  .ndate input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
  .mwrap{position:relative}
  /* The chip layer: the text box's twin, sitting exactly under it. Every
     property that moves a letter has to match the box, or the chips drift
     off their words. The chips grow with a shadow, not padding, for the same
     reason: padding would push the letters after them along. */
  .mback{position:absolute;left:0;right:0;top:0;bottom:0;overflow:hidden;pointer-events:none;
    font-family:var(--hand);font-size:var(--t4);line-height:1.6;letter-spacing:normal;
    padding:0 0 var(--s2);white-space:pre-wrap;overflow-wrap:break-word;color:transparent}
  .mback .mtag{color:transparent;background:color-mix(in srgb,var(--leaf) 20%,transparent);
    border-radius:6px;box-shadow:0 0 0 2px color-mix(in srgb,var(--leaf) 20%,transparent);
    -webkit-box-decoration-break:clone;box-decoration-break:clone}
  .dock textarea{position:relative;z-index:1}
  .mpop{position:absolute;left:0;top:100%;z-index:20;min-width:240px;max-width:100%;
    background:var(--field);border:1px solid var(--rule);border-radius:var(--r-md);
    box-shadow:0 8px 24px rgba(22,40,28,.16);padding:var(--s1);display:flex;flex-direction:column}
  .mpop[hidden]{display:none}
  .mpop button{display:flex;align-items:center;gap:var(--s2);border:0;background:none;text-align:left;
    padding:var(--s2) var(--s3);border-radius:var(--r-sm);cursor:pointer;font-size:var(--t3)}
  .mpop button[aria-selected="true"],.mpop button:hover{background:var(--wash)}
  .mpop .av{width:22px;height:22px;flex:none;overflow:hidden;border-radius:var(--r-pill)}
  .mpop .av svg{width:100%;height:100%;display:block}
  .mpop b{font-weight:600}
  .mpop span:last-child{color:var(--dim);font-size:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .handtags{white-space:nowrap}

  /* ---- narrow ---- */
  @container (max-width:760px){
    .sect{padding:var(--s3)}
  }

  /* ---- the lock ---- */
  #lock{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;
    padding:var(--s4);background:color-mix(in srgb,var(--paper) 80%,transparent);backdrop-filter:blur(3px)}
  #lock.on{display:flex}
  .waiting{width:min(430px,100%);background:var(--field);border-radius:var(--r-lg);
    padding:var(--s4) var(--s4) var(--s3);box-shadow:0 20px 54px rgba(16,32,22,.24)}
  .waiting .said{font-family:var(--hand);font-size:var(--t5);line-height:1.5;margin:0 0 var(--s3)}
  .waiting .said .ptag{cursor:default}
  .waiting .steps{display:flex;gap:var(--s1);margin-bottom:var(--s2)}
  .waiting .steps i{flex:1;height:5px;background:var(--paper);border-radius:var(--r-pill);
    overflow:hidden;position:relative}
  .waiting .steps i b{position:absolute;inset:0 auto 0 0;background:var(--leaf);border-radius:var(--r-pill)}
  .waiting .stage{font-size:var(--t3);font-weight:600;color:var(--leaf)}
  .waiting .eta{font-size:var(--t2);color:var(--dim);margin-top:2px}
  .waiting .found{margin-top:var(--s3);display:flex;flex-direction:column;gap:var(--s1)}
  .waiting .found .read{display:flex;gap:var(--s2);align-items:flex-start;padding:var(--s2) var(--s3);
    background:var(--wash);border-radius:var(--r-sm)}
  .waiting .found .art{width:30px;height:30px;flex:none;border-radius:var(--r-sm);overflow:hidden;background:var(--field)}
  .waiting .found .art svg{width:100%;height:100%;display:block}
  .waiting .found b{font-size:var(--t3);font-weight:600;display:block}
  .waiting .found span{font-size:var(--t3);line-height:1.4;font-family:var(--prose)}
  .waiting .out{margin-top:var(--s3);border:none;background:none;color:var(--dim);cursor:pointer;
    font-size:var(--t2);text-decoration:underline;padding:var(--s2) 0}
  body.locked{overflow:hidden}
  /* The lock's last state: what the note changed. Same card, so the wait
     turns into the answer in place rather than jumping somewhere else. */
  .waiting.done{width:min(480px,100%);max-height:calc(100dvh - 2 * var(--s4));overflow-y:auto}
  .donehd{display:flex;align-items:center;gap:var(--s2);margin-bottom:var(--s2)}
  .donehd b{font-family:var(--display);font-weight:400;font-size:var(--t5)}
  .tickmark{width:26px;height:26px;border-radius:50%;background:var(--leaf);color:#fff;
    display:grid;place-items:center;font-size:var(--t3);font-weight:700;flex:none}
  .waiting .said.small{font-size:var(--t4);color:var(--ink);margin:0 0 var(--s3);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .changes{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:var(--s2)}
  .changes li{display:flex;align-items:flex-start;gap:var(--s3);padding:var(--s3);
    background:var(--wash);border-radius:var(--r-md)}
  .changes .art{width:30px;height:30px;flex:none;border-radius:50%;overflow:hidden;background:var(--field)}
  .changes .art svg{width:100%;height:100%;display:block}
  .changes .what{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-size:var(--t2);line-height:1.4}
  .changes .what b{font-size:var(--t3);font-weight:600}
  .changes .filed{font-family:var(--prose);font-size:var(--t3);color:var(--ink)}
  .changes .moved{color:var(--water);font-weight:600}
  .changes .status-new{color:var(--dim)}
  .changes .goto{flex:none;align-self:center;border:1px solid var(--rule);background:var(--field);color:var(--ink);
    border-radius:var(--r-pill);padding:var(--s1) var(--s3);font-size:var(--t2);cursor:pointer}
  .changes .goto:hover{border-color:var(--leaf);color:var(--pine)}
  .note-end{margin:var(--s3) 0 0;font-size:var(--t2);color:var(--dim)}
  .tickmark.ask{background:var(--pollen)}
  .waiting .dated{margin:0 0 var(--s2);font-size:var(--t2);font-weight:600;color:var(--pollen)}
  /* A small breathing dot while the care update runs behind the summary. */
  .pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--leaf);
    margin-right:var(--s2);vertical-align:1px}
  @media (prefers-reduced-motion:no-preference){
    @keyframes breathe{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:none}}
    .pulse{animation:breathe 1.4s ease-in-out infinite}
  }
  .guesses{display:flex;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s2)}
  .guess{display:inline-flex;align-items:center;gap:var(--s2);border:1px solid var(--leaf);background:var(--field);
    color:var(--pine);border-radius:var(--r-pill);padding:var(--s1) var(--s3) var(--s1) var(--s1);
    font-size:var(--t3);font-weight:600;cursor:pointer}
  .guess:hover{background:var(--wash)}
  .guess .av{width:24px;height:24px;border-radius:50%;overflow:hidden;flex:none}
  .guess .av svg{width:100%;height:100%;display:block}
  .note-end:empty{display:none}
  .doneacts{display:flex;justify-content:flex-end;align-items:center;gap:var(--s3);margin-top:var(--s3)}
  .doneacts .primary{border:0;background:var(--leaf);color:#fff;border-radius:var(--r-pill);
    padding:var(--s2) var(--s4);font-size:var(--t3);font-weight:600;cursor:pointer}
  @media (prefers-reduced-motion:no-preference){
    @keyframes donein{from{opacity:.4;transform:scale(.97)}to{opacity:1;transform:none}}
    .waiting.done{animation:donein .3s cubic-bezier(.2,.8,.2,1)}
    @keyframes tickpop{0%{transform:scale(.3)}60%{transform:scale(1.15)}100%{transform:none}}
    .tickmark{animation:tickpop .45s cubic-bezier(.34,1.56,.64,1)}
    .changes li{animation:sprout .4s cubic-bezier(.2,.8,.2,1) backwards}
    .changes li:nth-child(2){animation-delay:.06s} .changes li:nth-child(3){animation-delay:.12s}

  @media(prefers-reduced-motion:reduce){.prow.touched{animation:none}}

  /* ---- pieces the live site needs on top of the prototype's system ---- */

  .cshots{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s2)}
  .cshot{position:relative}
  .cshot img{width:74px;height:74px;object-fit:cover;border-radius:var(--r-sm);display:block}
  .cshot .rm{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:var(--r-pill);
    border:1px solid var(--rule);background:var(--field);cursor:pointer;font-size:var(--t3);line-height:1;padding:0}
  .shots button img{width:100%;height:100%;object-fit:cover;display:block}
  .entry-acts{display:flex;gap:var(--s3);margin-top:var(--s2)}
  .lnk{border:none;background:none;color:var(--dim);cursor:pointer;font-size:var(--t2);
    text-decoration:underline;padding:var(--s1) 0}
  .lnk:hover{color:var(--leaf)}

  .note textarea{width:100%;min-height:74px;resize:vertical;font:inherit;
    font-family:var(--hand);font-size:var(--t4);line-height:1.6;color:var(--ink);
    background:var(--paper);border:1px solid var(--leaf);border-radius:var(--r-sm);padding:var(--s3)}
  .foot{display:flex;align-items:center;gap:var(--s4);flex-wrap:wrap;padding:var(--s4) var(--s1) 0;
    border-top:1px solid var(--rule);margin-top:var(--s6)}
  .theme-switch{display:inline-flex;align-items:center;gap:var(--s3);cursor:pointer;font-size:var(--t2);color:var(--dim)}
  .theme-switch input{position:absolute;opacity:0;width:0;height:0}
  .theme-switch .track2{width:42px;height:24px;border-radius:var(--r-pill);background:var(--rule);
    position:relative;flex:none;transition:background .15s ease}
  .theme-switch .knob{position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;
    background:var(--field);box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .15s ease}
  .theme-switch input:checked + .track2{background:var(--leaf)}
  .theme-switch input:checked + .track2 .knob{transform:translateX(18px)}
  .theme-switch .tl.act{color:var(--ink)}
  #lockbtn{border:1px solid var(--rule);background:var(--field);color:var(--dim);border-radius:var(--r-pill);
    padding:var(--s2) var(--s4);font-size:var(--t2);cursor:pointer}

  /* ---- overlays kept from the live site, restyled ---- */
  /* ---- one photo, full screen ----
     The photo-app pattern: one bar on top, the way back on the left with what
     the photo is beside it, and the actions as icons on the right, so the
     photo gets everything under the bar. Solid, so the page behind stops
     competing with it. Every icon has a 44px target and a tooltip. */
  #viewer{position:fixed;inset:0;z-index:31;display:none;background:#0B0F0C;color:#EAF0EA;
    grid-template-rows:auto minmax(0,1fr);height:100dvh}
  #viewer.on{display:grid}
  #viewer button{font:inherit;color:inherit;cursor:pointer}
  .vbar{display:flex;align-items:center;gap:var(--s1);padding:var(--s2) var(--s3)}
  .vic{flex:none;width:44px;height:44px;padding:0;border:0;border-radius:var(--r-pill);background:none;
    display:flex;align-items:center;justify-content:center;color:rgba(234,240,234,.85)}
  .vic:hover{background:rgba(255,255,255,.1);color:#fff}
  .vic.vdel:hover{color:#F59A85}
  .vic[hidden]{display:none}
  .vcap{flex:1;min-width:0;display:flex;flex-direction:column;margin-left:var(--s2);line-height:1.3}
  .vcap b{font-weight:600;font-size:var(--t3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .vcap span{font-size:var(--t2);color:rgba(234,240,234,.6);font-variant-numeric:tabular-nums}
  .vstage{position:relative;display:flex;align-items:center;justify-content:center;min-height:0;
    padding:0 72px var(--s5);touch-action:pan-y}
  #viewer img{max-width:100%;max-height:100%;object-fit:contain;border-radius:var(--r-sm);
    box-shadow:0 10px 40px rgba(0,0,0,.5);user-select:none;-webkit-user-drag:none}
  #viewer .vnav{position:absolute;top:50%;transform:translateY(-50%);width:48px;height:48px;padding:0;
    border:0;border-radius:var(--r-pill);background:rgba(255,255,255,.1);
    display:flex;align-items:center;justify-content:center}
  #viewer .vnav:hover:not(:disabled){background:rgba(255,255,255,.18)}
  #viewer #viewer-prev{left:var(--s3)} #viewer #viewer-next{right:var(--s3)}
  #viewer .vnav:disabled{opacity:0;pointer-events:none}
  /* A phone swipes between photos instead. */
  @media (max-width:560px){
    .vstage{padding:0 0 var(--s4)}
    #viewer .vnav{display:none}
  }

  /* ---- life on the page ----
     Small moves that belong to a garden: water falls and soaks in, a saved
     note sends up leaves, the plant drawings sway when you reach for them,
     cards come up like seedlings on the first visit, and prints are laid down
     rather than switched on. Everything here is off for anyone who asked
     their system for less motion; the page reads the same without it. */
  .waterbtn .drop{display:inline-block}
  .fx{position:fixed;left:0;top:0;z-index:60;pointer-events:none}
  .fx-water{width:7px;height:10px;background:var(--water);border-radius:50% 50% 50% 50%/62% 62% 38% 38%}
  .fx-leaf{width:11px;height:7px;background:var(--leaf);border-radius:0 100% 0 100%}
  .fx-leaf:nth-child(odd){background:var(--ph-grow)}
  .pre .plist .prow,.pre #page > .sect,.pre .pfull-body .stack{opacity:0}
  .plist .prow{position:relative}
  .plist .prow::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;
    background:radial-gradient(120% 90% at 92% 100%,color-mix(in srgb,var(--water) 18%,transparent),transparent 62%)}
  @media (prefers-reduced-motion:no-preference){
    /* A drawing sways from its base, the way a stem does in a breeze. */
    @keyframes sway{0%,100%{transform:rotate(0)}30%{transform:rotate(-8deg)}70%{transform:rotate(6deg)}}
    .chip .av svg,.pname .art svg,.ptag .av svg,.pfull-art svg,.gal-art svg,.mpop .av svg{transform-origin:50% 88%}
    .chip:hover .av svg,.pname:hover .art svg,.ptag:hover .av svg,.pfull-art:hover svg,.mpop button[aria-selected="true"] .av svg{
      animation:sway 1.3s ease-in-out infinite}
    /* Hover says what the pointer is on. A season segment brightens so the
       tooltip plainly belongs to it; a card rises a little off the paper;
       the plant name takes the pine; a journal photo leans in. */
    .prow .track .bar,.pfull-seg{transition:filter .15s ease}
    .prow .track .bar:hover,.pfull-seg:hover{filter:brightness(1.08) saturate(1.15)}
    .plist .prow{transition:box-shadow .2s ease,transform .2s ease}
    .plist .prow:hover{box-shadow:0 6px 22px rgba(22,40,28,.10);transform:translateY(-2px)}
    .pname b{transition:color .15s ease}
    .pname:hover b{color:var(--pine)}
    .shots button img{transition:transform .25s ease}
    .shots button:hover img{transform:scale(1.05)}
    /* The weather avatar wobbles when you reach for it; the typing dots hop. */
    @keyframes wobble{0%,100%{transform:rotate(0)}25%{transform:rotate(-14deg) scale(1.1)}60%{transform:rotate(10deg)}}
    .warn:hover .wav{animation:wobble .7s ease-in-out}
    @keyframes hop{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-4px);opacity:1}}
    .wtyping i{animation:hop 1s ease-in-out infinite}
    .wtyping i:nth-child(2){animation-delay:.15s} .wtyping i:nth-child(3){animation-delay:.3s}
    /* A line whose fact just changed rolls its new words up into place and
       flashes the colour of what changed it: water for a watering, leaf for
       a fresh reading from the model. */
    @keyframes tickup{from{opacity:0;transform:translateY(70%)}to{opacity:1;transform:none}}
    @keyframes flashwater{0%,45%{color:var(--water)}100%{color:var(--dim)}}
    @keyframes flashleaf{0%,45%{color:var(--leaf)}100%{color:var(--dim)}}
    .water.justnow,.ago.justnow{display:inline-block}
    .water.justnow{animation:tickup .45s cubic-bezier(.2,.8,.2,1),flashwater 1.8s ease-out}
    .ago.justnow{animation:tickup .45s cubic-bezier(.2,.8,.2,1),flashleaf 1.8s ease-out}
    /* The drop in the water button bobs as if about to fall. */
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
    .waterbtn:hover .drop{animation:bob .9s ease-in-out infinite}
    /* Things you press give a little. */
    .chip,.waterbtn,.photobtn,.dock .acts .save,.stack-n,.vic,.gal-x,.mpop button{transition:transform .12s ease}
    .chip:active,.waterbtn:active,.photobtn:active,.dock .acts .save:active:not(:disabled),.stack-n:active,
      .vic:active,.gal-x:active,.mpop button:active{transform:scale(.94)}
    /* Watered: the card soaks it up from the corner the water came from. */
    @keyframes soak{0%{opacity:0}25%{opacity:1}100%{opacity:0}}
    .plist .prow.wet::after{animation:soak 1.6s ease-out}
    /* A note just landed on this plant: a leaf-green ring that fades out. */
    @keyframes tended{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--leaf) 45%,transparent),var(--shadow)}
      30%{box-shadow:0 0 0 4px color-mix(in srgb,var(--leaf) 30%,transparent),var(--shadow)}
      100%{box-shadow:0 0 0 0 transparent,var(--shadow)}}
    .plist .prow.touched{animation:tended 2.4s ease-out}
    /* A new journal entry grows in at the top of the list. */
    @keyframes sprout{from{opacity:0;transform:translateY(-10px) scale(.98)}to{opacity:1;transform:none}}
    .jent.fresh{animation:sprout .6s cubic-bezier(.2,.8,.2,1) both;transform-origin:0 0}
    /* The @ list opens from the caret. */
    @keyframes pop{from{opacity:0;transform:translateY(-4px) scale(.98)}to{opacity:1;transform:none}}
    .mpop:not([hidden]){animation:pop .14s ease-out;transform-origin:0 0}
    /* The photo panel rises, and its prints are dealt onto the table one by one. */
    @keyframes fadein{from{opacity:0}to{opacity:1}}
    @keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
    @keyframes deal{from{opacity:0;transform:translateY(16px) rotate(calc(var(--tilt,0deg) * 4))}
      to{opacity:1;transform:rotate(var(--tilt,0deg))}}
    #gallery.on{animation:fadein .2s ease-out}
    #gallery.on .gal-in{animation:rise .34s cubic-bezier(.2,.8,.2,1)}
    #gallery.on .gal-grid .snap{animation:deal .5s cubic-bezier(.2,.8,.2,1) backwards;
      animation-delay:calc(120ms + var(--i,0) * 45ms)}
    #viewer.on{animation:fadein .18s ease-out}
    @keyframes toastin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    .toast{animation:toastin .28s cubic-bezier(.2,.8,.2,1)}
  }

  /* ---- all photos of one plant ----
     A panel over the plant page rather than a page of its own: the page stays
     in view, dimmed, so it is plain where closing it goes. A press outside
     the panel closes it. On a phone it is a sheet up from the bottom edge.
     The prints keep a small tilt each so the grid reads as prints on a
     table, not a file browser, but no tape: twenty strips of tape is noise. */
  #gallery{position:fixed;inset:0;z-index:30;display:none;align-items:center;justify-content:center;
    padding:var(--s5);background:rgba(10,14,11,.55)}
  #gallery.on{display:flex}
  .gal-in{position:relative;width:min(960px,100%);max-height:calc(100dvh - 2 * var(--s5));overflow-y:auto;
    overscroll-behavior:contain;background:var(--paper);border-radius:var(--r-lg);
    box-shadow:0 20px 60px rgba(0,0,0,.35);padding:0 var(--s5) var(--s6)}
  .gal-head{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:var(--s3);
    margin:0 calc(-1 * var(--s5)) var(--s2);padding:var(--s4) var(--s5);
    background:var(--paper);border-bottom:1px solid var(--rule)}
  .gal-art{width:36px;height:36px;flex:none;overflow:hidden;border-radius:var(--r-pill)}
  .gal-art svg{width:100%;height:100%;display:block}
  .gal-head h2{font-family:var(--display);font-weight:400;font-size:var(--t7);line-height:1.18;letter-spacing:0}
  .gal-n{color:var(--dim);font-size:var(--t3)}
  .gal-x{margin-left:auto;width:44px;height:44px;flex:none;border:0;background:none;padding:0;
    border-radius:var(--r-pill);cursor:pointer;color:var(--ink);display:flex;align-items:center;justify-content:center}
  .gal-x:hover{background:var(--wash)}
  .gal-month{margin:var(--s5) 0 var(--s4);font-size:var(--t1);letter-spacing:.09em;text-transform:uppercase;
    font-weight:600;color:var(--dim)}
  .gal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:var(--s6) var(--s5)}
  #gallery .snap::before{display:none}
  #gallery .snap{--chin:34px;padding:8px 8px 0}
  @media (max-width:560px){
    #gallery{align-items:flex-end;padding:var(--s5) 0 0}
    .gal-in{max-height:100%;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:0 var(--s3) var(--s6)}
    .gal-head{margin:0 calc(-1 * var(--s3)) var(--s2);padding:var(--s3)}
    .gal-head h2{font-size:var(--t6)}
    .gal-grid{grid-template-columns:repeat(2,1fr);gap:var(--s5) var(--s4)}
  }
  .modal{position:fixed;inset:0;background:rgba(10,14,11,.7);display:none;z-index:35;
    align-items:flex-end;justify-content:center}
  .modal.open{display:flex}
  .modal.center{align-items:center}
  .pk-card{background:var(--field);width:100%;max-width:560px;border-radius:var(--r-lg) var(--r-lg) 0 0;
    padding:var(--s4);max-height:82vh;overflow-y:auto}
  .pk-head{display:flex;align-items:center;justify-content:space-between;font-size:var(--t5);font-weight:600;
    margin-bottom:var(--s3)}
  .pk-head button{border:none;background:none;color:var(--dim);font-size:var(--t7);cursor:pointer;min-width:38px}
  .pk-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:var(--s2)}
  .pk-grid button{border:1px solid var(--rule);background:var(--paper);border-radius:var(--r-md);
    padding:var(--s2);cursor:pointer;display:flex;flex-direction:column;align-items:center;
    gap:var(--s2);font-size:var(--t2);text-align:center}
  .pk-grid button .av{width:40px;height:40px;border-radius:var(--r-sm);overflow:hidden}
  .pk-grid button .av svg{width:100%;height:100%;display:block}
  .unlock-card{max-width:400px;border-radius:var(--r-lg);margin:auto var(--s3);padding:var(--s4)}
  .unlock-card h3{font-size:var(--t5);margin-bottom:var(--s2)}
  .unlock-card p{margin:0 0 var(--s3);font-size:var(--t3);color:var(--dim);line-height:1.55}
  .unlock-card input{width:100%;font:inherit;font-size:var(--t4);color:var(--ink);background:var(--paper);
    /* 16px, never smaller: anything under it makes iOS zoom the page on focus. */
    border:1px solid var(--rule);border-radius:var(--r-sm);padding:var(--s3)}
  .unlock-card .row2{display:flex;gap:var(--s2);justify-content:flex-end;margin-top:var(--s3)}
  .unlock-card button{font:inherit;font-size:var(--t3);border:1px solid var(--rule);background:var(--paper);
    border-radius:var(--r-pill);padding:var(--s2) var(--s4);cursor:pointer}
  .unlock-card button.go{border-color:var(--leaf);background:var(--leaf);color:#fff;font-weight:600}
  #toasts{position:fixed;left:0;right:0;bottom:var(--s4);z-index:45;display:flex;flex-direction:column;
    align-items:center;gap:var(--s2);pointer-events:none;padding:0 var(--s3)}
  .toast{pointer-events:auto;background:var(--ink);color:var(--paper);border-radius:var(--r-pill);
    padding:var(--s3) var(--s4);font-size:var(--t3);display:flex;align-items:center;gap:var(--s3);max-width:520px;
    box-shadow:0 6px 22px rgba(0,0,0,.3)}
  .toast button{border:none;background:none;color:#9FE0BE;font-size:var(--t2);cursor:pointer;padding:var(--s1)}

  /* ---- one plant, in full ----
     The list is twenty plants at a glance. This is one plant at reading size,
     so nothing here is sized to fit a column: the bar is tall enough to name
     its own phases, the dates get a line each, and the two paragraphs the
     model writes get the prose face they were written for. */
  .pfull > .hd{align-items:center}
  /* The section above is this pot, this one is the cultivar it belongs to, so
     the eyebrow says which of the two you are reading and the title names it.
     Two pots of the same variety were otherwise two pages with one heading. */
  .sect > .hd.vhd{display:block}
  .sect > .hd.vhd .lbl{display:block;margin-bottom:var(--s1)}
  /* Same token as the card's, one size up because this one is a page head. */
  .pfull .pfull-art{width:36px;height:36px;flex:none;overflow:hidden;border-radius:var(--r-pill)}
  .pfull .pfull-art svg{width:100%;height:100%;display:block}

  /* One tall band, so the year still reads left to right in a single line. The
     expected tail of a phase is a pale tint of the phase, and the today marker
     names itself instead of being a bare tick. */
  .pfull-chart{margin-bottom:var(--s4)}
  /* Same size as the list's scale, so the two charts speak at one volume. */
  .pfull-chart .monthscale{height:1.15em;margin-bottom:var(--s1);font-size:var(--t1)}
  .pfull-track{position:relative;height:56px;border-radius:var(--r-sm);
    background:color-mix(in srgb,var(--rule) 55%,var(--field))}
  .pfull-seg.first{border-radius:var(--r-sm) 0 0 var(--r-sm)}
  .pfull-seg.last{border-radius:0 var(--r-sm) var(--r-sm) 0}
  .pfull-seg.first.last{border-radius:var(--r-sm)}
  /* Names sit along the bottom of the band, so the today marker has the top
     edge to itself and the two never collide. */
  /* min-width for the same reason as the list ribbon: a phase with no length
     left in it is still a row in the dated list, so it has to be on the bar. */
  /* Square segments on a rounded track: the two ends of the year are round,
     every join between phases is a straight line with no gap. */
  .pfull-seg{position:absolute;top:0;height:100%;display:flex;align-items:flex-end;overflow:hidden;
    container:pseg/inline-size;min-width:3px;background:var(--c);font-style:normal}
  /* Straight on the phase, no pill: the mid-tone palette is light enough for
     ink to read on every phase and every tint, and a pill per segment was
     more chrome than the name it carried. The segments are <i>, so italic is
     switched off here. */
  .pfull-seg b{position:relative;z-index:1;margin:0 var(--s2) var(--s2);
    color:color-mix(in srgb,var(--c) 30%,#000);font-size:var(--t2);font-weight:600;
    white-space:nowrap;overflow:hidden}
  .pfull-seg b .sm{display:none}
  /* The solid phases are mid tones in both themes, so their names are always
     dark. A wholly expected phase sits on the tint, which follows the card,
     so its name follows the page ink instead. */
  @container pseg (max-width:112px){
    .pfull-seg b .lg{display:none}
    .pfull-seg b .sm{display:inline}
  }
  /* Below this the widest short word plus its margins no longer fits, so the
     name goes rather than being clipped. Measured, not guessed. */
  @container pseg (max-width:64px){ .pfull-seg b{display:none} }
  .pfull-today{position:absolute;top:-5px;bottom:-5px;width:3px;margin-left:-1.5px;
    background:var(--ink);border-radius:2px;box-shadow:0 0 0 2px var(--field);z-index:2}
  /* Where the season began: a hollow ring pinned on the left end of the bar.
     Today is a solid line through the bar; a ring is a point, so the two can
     never be mistaken for each other. Hover for the date. */
  .pfull-startmk{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;
    border-radius:50%;background:var(--field);border:2.5px solid var(--ink);z-index:2;cursor:default}
  /* The label hangs under the track rather than inside it, so it never lands on
     a phase name. Clamped off the edges so a season ending today cannot push
     the pill out of the card. */
  .pfull-axis{position:relative;height:24px;margin:var(--s1) 0 var(--s3)}
  /* A quiet caption under the marker, same size and colour as the month
     scale, not a black pill competing with the phase names. */
  .pfull-todaylbl{position:absolute;top:var(--s1);transform:translateX(-50%);white-space:nowrap}
  .pfull-todaylbl,.pfull-nowtag{font-style:normal;font-size:10px;line-height:1.2;letter-spacing:.06em;
    text-transform:uppercase;font-weight:600;padding:2px 7px;
    border-radius:var(--r-pill);background:var(--ink);color:var(--paper)}

  /* The dates under the chart. Wrapping rather than a grid, so on a narrow
     screen the mark drops to its own line instead of squeezing the dates. */
  .pfull-stages{list-style:none;margin:0;padding:0;border-top:1px solid var(--rule)}
  .pfull-stage{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s2) var(--s3);
    padding:var(--s3) var(--s1);border-bottom:1px solid var(--rule);font-size:var(--t3)}
  .pfull-stage .sw{width:16px;height:8px;border-radius:var(--r-pill);flex:none}
  .pfull-name{font-weight:600;min-width:98px}
  .pfull-when{color:var(--dim)}
  .pfull-mark{margin-left:auto;font-style:normal;font-size:var(--t1);letter-spacing:.07em;
    text-transform:uppercase;font-weight:600;padding:var(--s1) var(--s3);border-radius:var(--r-pill);
    border:1px solid var(--rule);color:var(--dim)}
  .pfull-mark.recorded{color:var(--pine);border-color:color-mix(in srgb,var(--leaf) 45%,transparent);
    background:color-mix(in srgb,var(--leaf) 10%,transparent)}
  .pfull-mark.expected,.pfull-mark.estimated{border-style:dashed}
  .pfull-none{margin:var(--s3) 0 0;font-size:var(--t2);line-height:1.5;color:var(--dim)}

  /* Two different kinds of sentence, so two different treatments. Status is
     what the model saw, a quiet note with the time of the reading on it. Care
     is what to do about it, so it gets the tint, the accent edge and the
     reading face. Same size panels made them read as the same thing. */
  /* Held to a measure. On a 1120px page the same two paragraphs ran to well
     over a hundred characters a line, which is not a reading width. */
  .pfull-say{margin:var(--s5) 0 0;max-width:66ch}
  .pfull .status,.pfull .guide{grid-template-columns:1fr;align-content:start;gap:var(--s1);margin:0}
  .pfull .lbl{padding-top:0}
  .pfull .status{padding:0 0 var(--s4);font-size:var(--t4);line-height:1.55}
  .pfull .status > span{color:var(--ink)}
  .pfull .guide{padding:0 0 0 var(--s4);
    border-left:2px solid color-mix(in srgb,var(--leaf) 55%,transparent)}
  .pfull .guide > span{font-family:var(--prose);font-size:var(--t4);line-height:1.6}
  .pfull .guide .lbl{color:var(--pine)}
  /* When the reading happened. Sits on the label line, never competing with it. */
  .ago{font-style:normal;font-weight:400;letter-spacing:0;text-transform:none;
    font-size:var(--t1);color:var(--dim);white-space:nowrap}
  .pfull .wline{display:flex;align-items:center;gap:var(--s3);
    margin:var(--s4) 0 0;padding-top:var(--s4);border-top:1px solid var(--rule)}
  .pfull .wline .lbl{display:none}
  .pfull .wline > span{flex:1;display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap}
  .pfull .wline .water{margin-left:auto}

  @container (max-width:560px){
    .pfull-track{height:46px}
    .pfull-seg b{font-size:var(--t1);margin:0 var(--s1) var(--s1)}
    /* At this width the four parts of a stage line only fit without the column
       the name keeps on a wide screen. */
    .pfull-stage{gap:var(--s1) var(--s2)}
    .pfull-name{min-width:0}
    .pfull-mark{padding:var(--s1) var(--s2);letter-spacing:.05em}
    .pfull .status,.pfull .guide{padding:0 0 0 var(--s3)}
  }
</style>
</head>

<script type="module">
import { weatherAlerts } from '/care-rules.js';
import { groupByArea, waterLabel, seasonSpans, withStart, phaseOfStage, chartWindow, monthTicks, tagEntryText, journalGroups, plantPhotos, findMentions, mentionQuery, mentionSegments, stageRecord } from '/garden-view.js';

/* ================= basics ================= */
const $=s=>document.querySelector(s);
const store={get:k=>JSON.parse(localStorage.getItem(k)||'null'),set:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const TAMPERE={la:61.4981,lo:23.7610};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const todayISO=()=>iso(new Date());
const WEEKDAYS=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const esc=s=>(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shortDate=s=>{const d=new Date(s);return d.getDate()+'.'+(d.getMonth()+1)+'.';};

/* ================= server docs ================= */
let statusDoc=store.get('statusDoc')||{updatedAt:0,plants:{}};
let careDoc=store.get('careDoc')||null;
let entriesDoc=store.get('entriesDoc')||{updatedAt:0,entries:[]};

async function loadStatus(){
  try{const r=await fetch('/api/status',{cache:'no-store'});
    if(r.ok){statusDoc=await r.json();store.set('statusDoc',statusDoc);}}catch(e){}
}
async function loadCare(){
  try{const r=await fetch('/api/care',{cache:'no-store'});
    if(r.ok){const d=await r.json();careDoc=(d&&d.plants)?d:null;store.set('careDoc',careDoc);}}catch(e){}
}
async function loadEntries(){
  try{const r=await fetch('/api/entries',{cache:'no-store'});
    if(r.ok){entriesDoc=await r.json();store.set('entriesDoc',entriesDoc);}}catch(e){}
}
function relTime(ms){if(!ms)return'';
  const s=Math.round((Date.now()-ms)/1000);
  if(s<90)return'just now';if(s<3600)return Math.round(s/60)+' min ago';
  if(s<86400)return Math.round(s/3600)+' h ago';return Math.round(s/86400)+' d ago';}

/* The distiller takes a few seconds; poll until the entry stops being pending. */
function flashPlant(pid){touched.add(pid);setTimeout(()=>{touched.delete(pid);renderAll();},2600);}
/* pollGen: every watcher checks it after each wait, so a newer save, or "Let me
   back in", stops an older one instead of the two racing for the lock. */
let _poll=null,busy='',pollGen=0,pollSince=0,pollWatch=[];
/* Saving kicks off two model calls back to back: the distiller sorts the note,
   then the planner rewrites the guidance. Watch for BOTH, or the page stops
   refreshing seconds before the new guidance actually arrives. */
/* focus: the entry to report on when it is not a pending one, as when a
   note is filed onto a plant by hand. */
function refreshSoon(focus,since){
  const gen=++pollGen;clearTimeout(_poll);lockDone=null;
  /* What every plant looked like before, so the summary can say what moved. */
  const before=Object.fromEntries(plants().map(p=>[p.id,{obs:p.observations||'',stage:p.stage,last:p.last||''}]));
  const watch=focus?[focus]:entriesDoc.entries.filter(e=>e.status==='pending').map(e=>e.id);
  /* Guidance counts as new for this note once it was worked out from data at
     least as new as the note's filing: care.basedOn against the entry's
     filedAt (when it was put onto plants), else when it was saved. */
  const baseline=()=>Math.max(since||0,...entriesDoc.entries.filter(e=>watch.includes(e.id))
    .map(e=>e.filedAt||e.createdAt||0))||Date.now();
  pollSince=baseline();
  pollWatch=watch;
  let n=0;
  setBusy('read');
  const tick=async()=>{
    await Promise.all([loadStatus(),loadCare(),loadEntries()]);
    if(gen!==pollGen)return;
    renderAll();
    pollSince=baseline();
    const mine=entriesDoc.entries.filter(e=>watch.includes(e.id));
    const pending=mine.some(e=>e.status==='pending');
    if(pending&&++n<12){_poll=setTimeout(tick,2000);return;}          // ~25 s to file it
    mine.filter(e=>e.status==='sorted').forEach(e=>(e.assigned||[]).forEach(a=>flashPlant(a.plantId)));
    const failed=mine.find(e=>e.status==='unsorted'&&e.error);
    const stuck=!failed&&mine.some(e=>e.status==='unsorted');
    const fresh=careFresh(pollSince);
    lockDone=noteSummary(watch,before,{fresh,stuck,failed:!!failed,slow:pending,waiting:!fresh&&!stuck&&!failed&&!pending});
    setBusy('');renderAll();
    if(lockDone.waiting||lockDone.slow)followCare(gen,watch,before);
  };
  _poll=setTimeout(tick,focus?600:1200);
}
const careFresh=since=>!!(careDoc&&careDoc.basedOn&&careDoc.basedOn>=since);
/* The care update carries on after the lock has let go. Keep looking, quietly:
   when it lands the cards redraw and an open summary says so; when the server
   reports it failed, the summary says that instead. */
function followCare(gen,watch,before){
  let n=0;
  const look=async()=>{
    await Promise.all([loadCare(),loadStatus(),loadEntries()]);
    if(gen!==pollGen)return;
    if(careFresh(pollSince)){
      if(lockDone)lockDone={...noteSummary(watch,before,{fresh:true}),entryId:lockDone.entryId};
      renderAll();renderLock();return;
    }
    const err=careDoc&&careDoc.lastError;
    if(err&&err.at>=pollSince){if(lockDone){lockDone={...lockDone,waiting:false,careFailed:true};renderLock();}return;}
    if(++n<45){_poll=setTimeout(look,4000);return;}                   // ~3 minutes
    if(lockDone){lockDone={...lockDone,waiting:false,careSlow:true};renderLock();}
  };
  _poll=setTimeout(look,3000);
}
/* One state for the whole page while the two model calls run: everything on
   screen is about to be replaced, so nothing may be touched until it is. */
function setBusy(label){
  busy=label;
  if(label&&!busyAt)busyAt=Date.now();
  if(!label)busyAt=0;
  renderLock();
}
/* Give the server a record for any plant it has never seen. Place is not sent:
   the Worker reads garden-data.js itself, so it is right without a browser. */
async function seedStatus(){
  const seed=window.GARDEN_SEED;if(!seed)return;
  if(store.get('statusSeedVersion')===seed.version)return;
  if(!store.get('uploadPass'))return;                       // visitors never write
  for(const sp of seed.plants){
    await api('/api/status/'+encodeURIComponent(sp.id)+'?seed=1',{
      method:'PUT',headers:{'content-type':'application/json'},
      body:JSON.stringify({name:sp.name,species:sp.species,
        ...(statusDoc.plants[sp.id]?.stage?{}:{stage:sp.stage,lastWatered:sp.water||todayISO()})}),
    });
  }
  store.set('statusSeedVersion',seed.version);
  await loadStatus();
}

/* ================= weather ================= */
let forecast=store.get('forecastT3');
async function loadWx(){
  try{
    const u=`https://api.open-meteo.com/v1/forecast?latitude=${TAMPERE.la}&longitude=${TAMPERE.lo}`+
      `&current=temperature_2m,relative_humidity_2m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,relative_humidity_2m_mean`+
      `&forecast_days=14&timezone=auto`;
    const d=await(await fetch(u)).json();
    forecast={fetched:todayISO(),nowT:d.current.temperature_2m,rh:d.current.relative_humidity_2m,
      days:Object.fromEntries(d.daily.time.map((t,i)=>[t,{tmax:d.daily.temperature_2m_max[i],tmin:d.daily.temperature_2m_min[i],pop:d.daily.precipitation_probability_max[i],rh:d.daily.relative_humidity_2m_mean?.[i]}]))};
    store.set('forecastT3',forecast);
  }catch(e){}
  renderAll();
}
const wxOf=date=>forecast?.days?.[date];
const wxIcon=w=>!w?'':w.pop>=60?'🌧️':w.pop>=30?'🌦️':w.tmax>=27?'☀️':w.tmax>=18?'⛅':'☁️';

/* Condition comes from the server; identity and place come from the seed. */
function plants(){
  const seed=window.GARDEN_SEED;if(!seed)return[];
  return seed.plants.map(sp=>{
    const s=statusDoc.plants[sp.id]||{};
    return {id:sp.id,name:sp.name,species:sp.species,area:sp.area||'balcony',
      stage:s.stage||sp.stage,last:s.lastWatered||sp.water||'',
      started:sp.started||'',startedHow:sp.startedHow||'',
      observations:s.observations,notes:s.notes||[]};
  });
}
const plantById=id=>plants().find(p=>p.id===id);
/* A plant's stage record: what was noticed live plus what the notes date. */
const stagesOf=id=>{const s=statusDoc.plants[id]||{};return stageRecord(s.history,s.noteStages);};

const avatarFor=pid=>ART[KEY_BY_ID[pid]]||'<span aria-hidden="true">🪴</span>';
const dayLabel=s=>`${WEEKDAYS[new Date(s).getDay()]} ${shortDate(s)}`;

/* ================= season chart + profiles ================= */

 {key:'chilli',lbl:'Lombardo ×2',ph:[['grow','2026-07-10','2026-08-05'],['flower','2026-08-05','2026-08-20'],['fruit','2026-08-20','2026-09-05'],['harvest','2026-09-05','2026-09-30']]},
